const QP={
/* ---------- M1 ---------- */
'The board has four waiting patients':{t:'mcq',tag:'Apply',q:`08:10. Four patients are waiting on the board. Who do you pick up first?`,o:[
[`CTAS 3 · 45M · renal colic · waiting 35 min · had analgesia at triage`,`Slightly past target, but his pain has been treated. Someone else has been waiting longer past theirs.`],
[`CTAS 3 · 70F · “dizzy since breakfast” · waiting 50 min`,''],
[`CTAS 2 · 52M · chest pain · waiting 5 min · your senior is already with him`,`CTAS 2 normally comes first — but he is already being seen. Doubling up leaves the overdue patient alone.`],
[`CTAS 4 · 25M · wrist injury · waiting 40 min · has complained twice`,`Complaints don’t change acuity, and he is still inside his 60-minute target.`]],a:1,
h:`Compare each wait with its CTAS target — and check who is already being seen.`,
e:`Pick the most urgent patient <b>not already being seen</b>, then the one furthest past their target. A dizzy 70-year-old 20 minutes past target is the right pick. “Dizzy” in the elderly can be arrhythmia, bleeding, stroke or sepsis.`},
'can an intern do <b>without</b>':{t:'multi',q:`Which of these may an intern do <b>without</b> a licensed doctor present or countersigning?`,o:[
[`Take a history and examine a CTAS 3 patient`,`Your core job.`],
[`Record a 12-lead ECG and show it to your senior`,`Yes — and show every ECG.`],
[`Start chest compressions on a patient in arrest`,`Anyone trained starts CPR immediately.`],
[`Give a family the news of a death when the senior is stuck in Resus`,`Breaking the news of a death is a licensed doctor’s role — wait, or ask the senior to delegate to another licensed doctor.`],
[`Take consent for a lumbar puncture your senior will do`,`Consent is taken by the doctor performing the procedure (or another licensed doctor).`],
[`Issue a sick leave on Seha after your senior verbally agrees`,`Even with verbal agreement, it must be issued under a licensed doctor’s own account.`],
[`Ask the nurse to give IV paracetamol you have written up, before countersignature`,`Intern orders need countersignature before they are given (except in an emergency with a verbal order from a licensed doctor).`]],a:[0,1,2],
h:`Three are correct. Ask: does this need a <b>licensed</b> signature or decision?`,
e:`Assessing, recording ECGs and starting CPR are yours. Anything that creates a legal record or decision — consent, sick leave, orders, breaking news of death — needs a licensed doctor.`},
/* ---------- M2 ---------- */
'A 74-year-old woman is triaged CTAS 4':{t:'mcq',tag:'Spot the trap',q:`A 74-year-old woman is triaged CTAS 4 for “generally unwell”. Temp 36.4 °C, HR 96, BP 104/60, RR 24. Her daughter says she has been confused since this morning. What do you do?`,o:[
[`Ask the triage nurse to recheck her vitals in 30 minutes, as CTAS 4 policy requires`,`Rechecking is good practice — but the numbers you already have are enough to act on now.`],
[`Request re-triage to CTAS 2 now: new confusion and RR 24 — possible sepsis`,''],
[`Re-triage to CTAS 3: she has no fever, so sepsis is unlikely, but she needs bloods sooner`,`The trap is the normal temperature. Elderly septic patients are often afebrile.`],
[`Keep CTAS 4 but send a urine dip and bloods from triage to speed things up`,`Useful tests, but she needs a doctor within 15 minutes, not tests while she waits.`]],a:1,
h:`Count the qSOFA criteria: RR ≥22, new confusion, systolic ≤100. Then ask what her temperature does — and doesn’t — tell you.`,
e:`She meets 2 of 3 qSOFA criteria (RR 24, new confusion) and her systolic of 104 is borderline. No fever does <b>not</b> reassure in the elderly. Say it politely: “I’m worried she may be septic — could we re-triage?”`},
'A well-known businessman with a CTAS 4':{t:'mcq',tag:'Apply',q:`A well-known businessman with a CTAS 4 wrist sprain has waited 40 minutes. The hospital director’s office calls asking you to “take care of him”. A CTAS 3 elderly man has waited 25 minutes. What do you do?`,o:[
[`See the businessman first — a sprain takes 5 minutes and it takes pressure off the department`,`Feels efficient, but it jumps the queue for non-clinical reasons, and “5-minute” patients rarely take 5 minutes.`],
[`See the CTAS 3 patient first, and tell your senior about the call so they can handle it`,''],
[`Ask the elderly man whether he would mind waiting a few minutes for the businessman`,`This pressures a vulnerable patient to give up his place. Agreement under social pressure isn’t free.`],
[`Ask the triage nurse to re-triage the businessman to CTAS 3 so he can be seen sooner`,`Changing a triage level for non-clinical reasons falsifies the record.`]],a:1,
h:`Who should deal with administrative pressure — you, or your senior?`,
e:`Clinical priority decides the order. Passing the call up protects you and keeps the queue honest; managing VIP requests is a senior’s job.`},
/* ---------- M3 ---------- */
'give 1 of adrenaline':{t:'mcq',tag:'Apply',q:`Mid-resuscitation, your senior says “Give one of adrenaline.” You are holding the drug. What is the safest response?`,o:[
[`Give 1 mg IV straight away — in an arrest that is the standard dose, and every second counts`,`Probably right this time. But assuming is how 1 mg IV ends up given in anaphylaxis, or 1 mL of the wrong strength.`],
[`Say back “1 milligram adrenaline, 1 in 10,000, IV — giving now,” and wait for “yes”`,''],
[`Ask your senior to write the order before you give it`,`Writing comes after the emergency. Delaying adrenaline in an arrest causes harm.`],
[`Give it, then tell the recorder “adrenaline given”`,`Nobody confirmed dose, route or strength — the loop was never closed.`]],a:1,
h:`Which answer closes the communication loop <b>without</b> delaying the drug?`,
e:`Closed-loop communication takes two seconds: drug, dose, strength, route said back and confirmed. The written order follows the arrest.`},
'What is the most dangerous phrase in an ED handover?':{t:'mcq',tag:'Spot the trap',q:`Which handover line is most likely to cause harm?`,o:[
[`“Bed 4 is a watcher — if his BP drops below 90, give a 500 mL bolus and call me.”`,`This is a good contingency plan: a trigger and an action.`],
[`“Bed 7’s potassium is pending — should be fine, he’s not on anything that affects it.”`,''],
[`“Bed 2 is DNR, documented by three physicians, family aware.”`,`Clear, documented and verified — exactly what a handover needs.`],
[`“Bed 9: discharge planned after the second troponin at 21:00, if negative.”`,`Actionable, with a time and a decision rule. Reasonable.`]],a:1,
h:`Look for a result with no owner, no time and no plan if it is abnormal.`,
e:`“Pending… should be fine” has no owner, no time and no plan. The most dangerous line is often the one that sounds the most relaxed.`},
/* ---------- M4 ---------- */
'A 26-year-old married woman needs a CT':{t:'mcq',tag:'Apply',q:`A 26-year-old woman needs a contrast CT and agrees to it. Her husband arrives and refuses — he doesn’t want her “exposed to radiation”. She still wants the scan. What do you do?`,o:[
[`Proceed — she is a competent adult; ask your senior to talk with the husband`,''],
[`Postpone the scan for a few hours until the couple have discussed it and agree`,`Delaying a needed test because a third party objects puts her at risk. The decision is hers.`],
[`Proceed, but ask the husband to sign a refusal form first so the hospital is protected`,`He isn’t the patient. His signature has no legal weight over her care.`],
[`Refer the disagreement to the hospital ethics committee before proceeding`,`Ethics committees are for genuine dilemmas. A competent adult consenting to her own care isn’t one.`]],a:0,
h:`Whose body, whose decision?`,
e:`A competent adult — man or woman — consents for herself, as MOH directives confirm. Your senior can explain this kindly to the husband.`},
'A caller says he is the brother':{t:'mcq',tag:'Apply',q:`A caller says he is the brother of a patient admitted after an RTA. He gives the full name and date of birth correctly and asks whether the patient was drunk. What do you say?`,o:[
[`He has the correct identifiers, so confirm the patient is admitted and stable, but share no results`,`Anyone can know a name and date of birth. Even confirming admission can be a breach.`],
[`“I can’t share information by phone. If you come in, the team can update you with the patient’s permission.”`,''],
[`Tell him the alcohol test was negative — it is good news and will calm the family`,`Good news is still confidential, and RTA results are medico-legal.`],
[`Transfer the call to the hospital police office, since RTAs are medico-legal cases`,`The police office handles police matters, not family enquiries.`]],a:1,
h:`Can details given over the phone prove who someone is?`,
e:`You can’t verify identity on the phone. Keep it general and polite, and invite him in.`},
'A 30-year-old woman has bruises':{t:'mcq',tag:'Apply',q:`A 30-year-old woman has bruises of different ages on her upper arms. Her husband answers every question for her. What is your best next step?`,o:[
[`Ask her kindly but directly, in front of him, “Has anyone hurt you?” — it shows you take it seriously`,`Asking is right; asking in front of a possible abuser can put her at greater risk.`],
[`Say you examine all patients privately, see her alone with a female nurse, and ask open, safe questions`,''],
[`Document the bruises and report to the police office immediately`,`Documentation, yes. Going to the police before speaking to her or involving the senior and social worker can endanger her.`],
[`Ask the social worker to interview the couple together`,`The key first step is separating them safely.`]],a:1,
h:`What does she need before she can speak freely?`,
e:`Safety first: separate them without accusing anyone. If she discloses, your senior and the social worker know the reporting pathway and safe options.`},
'A young man with a mild cold asks you for three days':{t:'mcq',tag:'Apply',q:`A man with a mild cold asks for three days’ sick leave. Your senior is in Resus. He says “the other doctor always gives it”. What do you do?`,o:[
[`Issue one day on Seha using your senior’s login, since they agreed to it last week for someone similar`,`Using someone else’s login is a serious violation — and interns cannot issue sick leave.`],
[`Explain a licensed doctor decides and issues it via Seha; ask your senior when free`,''],
[`Explain that a cold doesn’t justify three days off, and discharge him with symptom advice`,`You can’t discharge, and you can’t make that decision alone.`],
[`Offer a signed attendance note on hospital paper instead, which interns are allowed to write`,`An attendance note is still an official document and goes through the proper process.`]],a:1,
h:`Who is allowed to decide — and to issue — a sick leave?`,
e:`You neither issue it nor promise it. Your senior assesses and, if justified, issues it through Seha.`},
'An 88-year-old with metastatic cancer arrests':{t:'mcq',tag:'Spot the trap',q:`An 88-year-old with metastatic cancer arrests in the ED. A nurse is sure he had a DNR last admission, but the form can’t be found. His son shouts “do everything!”. What do you do?`,o:[
[`Start CPR and call your senior; search for a valid form at the same time`,''],
[`Don’t start CPR — a recent DNR still applies and the nurse is certain`,`Without a valid form in front of you it can’t be applied. Memory isn’t documentation.`],
[`Start CPR but hold shocks and drugs until the form turns up`,`A partial (“slow”) code is dishonest and gives the worst of both.`],
[`Ask the son what his father wanted and follow that`,`Under Saudi DNR policy the family is informed, not the decision-maker — in either direction.`]],a:0,
h:`What counts as a valid DNR at the moment of arrest?`,
e:`No valid form = full resuscitation until a senior confirms otherwise.`},
/* ---------- M5 ---------- */
'Which is the best opening to a presentation?':{t:'mcq',tag:'Apply',q:`Your senior has 30 seconds. Which opening is best for a patient you’re worried about?`,o:[
[`“Bed 3, 72F, fell at home — hypertension, diabetes, AF, osteoporosis, knee replacement in 2019, lives with her son…”`,`Too much background before the problem — and the key risk is buried.`],
[`“Bed 3, 72F on warfarin, fell and hit her head an hour ago, GCS 15. Worried about a bleed — OK to request CT and INR?”`,''],
[`“Bed 3, I think she has a subdural — can you look at her CT request?”`,`Jumps to a diagnosis without the facts that support it.`],
[`“Bed 3, 72F, minor head injury, GCS 15, looks well, family worried — OK to discharge?”`,`Leaves out the anticoagulant, which changes everything.`]],a:1,
h:`Which line makes the risk factor visible in the first sentence?`,
e:`Age, the risk that matters (anticoagulation), mechanism, findings, concern, plan. Your senior can say “yes” in five seconds.`},
'sudden pleuritic chest pain and mild breathlessness after a long flight':{t:'multi',q:`A 30-year-old man has sudden pleuritic chest pain and mild breathlessness after a long flight from Jakarta. Which diagnoses must you <b>actively rule out</b> before settling on a benign cause?`,o:[
[`Pulmonary embolism`,`Long flight + sudden pleuritic pain: top of the list.`],
[`Pneumothorax`,`Sudden pleuritic pain in a young man — and flying can play a part.`],
[`Musculoskeletal pain`,`A diagnosis you reach after excluding the dangerous ones.`],
[`Acute coronary syndrome`,`Uncommon at 30, but must not be missed — one ECG.`],
[`Panic attack`,`Panic can cause chest pain and breathlessness, but it is a diagnosis of exclusion — especially after a long flight.`],
[`Aortic dissection`,`Rare at 30, but a can’t-miss cause of sudden chest pain.`],
[`Pericarditis`,`Possible, but not immediately life-threatening on its own — consider it, don’t chase it first.`]],a:[0,1,3,5],
h:`Four are “can’t-miss”. Which could kill him in hours?`,
e:`PE and pneumothorax lead. ACS and dissection stay on the list even in young men. Musculoskeletal pain, panic and pericarditis come after.`},
/* ---------- M6 ---------- */
'You arrive at a code.':{t:'mcq',tag:'Apply',q:`You arrive at a code. Compressions, airway and defibrillator are covered. What is the most useful thing you can do?`,o:[
[`Ask loudly “What happened?” so the team can think about reversible causes`,`Important question — but the leader is already managing it; extra voices add noise.`],
[`Introduce yourself to the leader and offer to take the next compression cycle`,''],
[`Start drawing up amiodarone so it’s ready if needed`,`Drawing up drugs nobody asked for causes errors. The drug nurse prepares on the leader’s instruction.`],
[`Go to the family in the corridor and explain what is happening`,`Kind, but updating the family is the senior’s job once there is information.`]],a:1,
h:`What will the team need in under 2 minutes?`,
e:`Compressors tire within 2 minutes. A fresh, named pair of hands is exactly what the leader needs.`},
'Pulseless patient, strip A':{t:'mcq',tag:'Read the strip',q:`Pulseless patient, strip A. What is it, and what do you do?`,o:[
[`Ventricular fibrillation — shock, then resume CPR`,''],
[`Polymorphic VT — not shockable because it is irregular`,`Pulseless VT — polymorphic or not — is shockable. But there are no recognisable QRS complexes here: this is VF.`],
[`Probably artefact from a loose lead — check the leads, then decide`,`Always worth a glance at the leads, but artefact doesn’t look like this in a pulseless patient. Delay costs survival.`],
[`Fine VF — continue CPR and give adrenaline before shocking`,`It isn’t fine VF (the waves are coarse), and VF gets a shock first.`]],a:0,
h:`Are there any QRS complexes at all?`,e:`Chaotic waves of varying size, no QRS complexes = VF. Shock, then straight back to CPR.`},
'Pulseless patient, strip B':{t:'mcq',tag:'Read the strip',q:`Pulseless patient, strip B. What do you do?`,o:[
[`Shock once — fine VF can look almost flat on the monitor`,`Shocking true asystole doesn’t help and interrupts compressions. Confirm leads and gain instead.`],
[`CPR, adrenaline 1 mg ASAP, check the leads and gain`,''],
[`CPR, and give adrenaline after the third cycle`,`That is the shockable-rhythm timing. In non-shockable rhythms, adrenaline goes in as soon as possible.`],
[`CPR, and atropine 3 mg IV once for the slow electrical activity`,`Atropine was removed from cardiac arrest algorithms.`]],a:1,
h:`Shockable or not? And when does adrenaline go in for this group?`,e:`Asystole: confirm it’s real, then CPR + adrenaline ASAP, and hunt for reversible causes.`},
'The monitor shows an organised rhythm (strip C)':{t:'mcq',tag:'Read the strip',q:`The monitor shows strip C. You can’t feel a pulse in 10 seconds.`,o:[
[`PEA — CPR, adrenaline, and search for the Hs and Ts`,''],
[`Pulseless VT — shock`,`The complexes are narrow and organised, not wide VT.`],
[`ROSC — stop CPR and support the blood pressure`,`A rhythm is not a pulse.`],
[`Sinus with a weak pulse — give fluids and recheck in 2 minutes`,`If you can’t feel a pulse within 10 seconds, treat it as arrest.`]],a:0,
h:`The electricity looks fine. What about the pump?`,e:`Pulseless electrical activity. Reversible causes are common: bleeding, tension pneumothorax, tamponade, hyperkalaemia, PE.`},
'A 25-year-old develops lip swelling':{t:'mcq',tag:'Apply',q:`A 25-year-old develops lip swelling, wheeze and BP 80/50 a few minutes into IV ceftriaxone. The infusion is stopped. What is the next drug?`,o:[
[`Hydrocortisone 200 mg IV`,`Steroids take hours to work and aren’t first-line.`],
[`Adrenaline 0.5 mg IM into the thigh`,''],
[`Adrenaline 1 mg IV push`,`That is the cardiac arrest dose. In anaphylaxis an IV bolus can cause arrhythmias and MI.`],
[`Salbutamol nebuliser for the wheeze, then reassess`,`Treats one symptom and ignores the shock.`]],a:1,
h:`Which drug treats the airway swelling, the wheeze <b>and</b> the shock — and by which route?`,e:`IM adrenaline first, every time. Lie her flat (or sitting up if breathing is worse), high-flow oxygen, IV fluids.`},
/* ---------- M7 ---------- */
'ST elevation in V1–V4 with reciprocal':{t:'mcq',tag:'Challenge',q:`ST elevation in II, III and aVF, with ST depression in I and aVL. The elevation is greater in III than in II. Which artery is most likely blocked?`,o:[
[`Right coronary artery`,''],
[`Left anterior descending`,`LAD occlusion gives anterior (V1–V4) elevation.`],
[`Circumflex`,`It can cause inferior MI, but III > II with reciprocal changes in I and aVL favours the RCA.`],
[`None — it is pericarditis`,`Reciprocal depression argues strongly against pericarditis.`]],a:0,
h:`Inferior leads first. Then: which inferior artery makes lead III taller than II?`,
e:`Inferior STEMI with III > II and depression in I/aVL points to the RCA. Ask for a right-sided ECG (V4R) — RV involvement makes nitrates dangerous.`},
'pH 7.31, PaCO₂ 62 mmHg':{t:'mcq',tag:'Challenge',q:`A drowsy COPD patient has been on a 15 L non-rebreather since the ambulance. ABG: pH 7.22, PaCO₂ 80 mmHg, HCO₃⁻ 32. Best interpretation?`,o:[
[`Acute-on-chronic respiratory acidosis, likely worsened by too much oxygen`,''],
[`Metabolic alkalosis with respiratory compensation`,`The pH is acidaemic, so the primary problem is an acidosis.`],
[`Chronic, fully compensated respiratory acidosis — no change needed`,`A pH of 7.22 is not compensated.`],
[`Mixed respiratory and metabolic acidosis`,`A metabolic acidosis would lower the HCO₃⁻; here it is raised.`]],a:0,
h:`pH first. Then: is a HCO₃⁻ of 32 enough to explain a CO₂ of 80?`,
e:`Raised HCO₃⁻ shows chronic CO₂ retention; the low pH shows a new acute rise — classic with high-flow oxygen in CO₂ retainers. Venturi mask to 88–92%, and ask your senior about BiPAP.`},
'A 49-year-old hypertensive man':{t:'mcq',tag:'Spot the trap',q:`A 49-year-old hypertensive man has sudden severe pain between his shoulder blades. BP right arm 182/100, left arm 140/86. His ECG shows mild ST depression laterally. Which of these must you avoid until imaging?`,o:[
[`IV morphine`,`Pain control helps lower HR and BP — it is part of treatment.`],
[`IV labetalol, aiming for HR <60`,`This is the right first treatment for suspected dissection.`],
[`Heparin and dual antiplatelet loading for NSTEMI`,''],
[`A GTN infusion after the heart rate is controlled`,`A vasodilator after beta-blockade is acceptable for BP control.`]],a:2,
h:`The ST depression is a distraction. What does the arm BP difference suggest?`,
e:`Dissection can involve the coronary arteries and mimic ACS on the ECG. Anticoagulants and antiplatelets can be fatal. CT aortogram first.`},
/* ---------- M8 ---------- */
'Which belong in the hour-1 sepsis bundle?':{t:'multi',q:`Which belong in the hour-1 sepsis bundle?`,o:[
[`Measure lactate`,`Yes — and repeat it if ≥2.`],
[`Blood cultures before antibiotics, even if it delays antibiotics by 45 minutes`,`Cultures first only if they don’t meaningfully delay antibiotics.`],
[`Broad-spectrum antibiotics within the hour`,`Yes.`],
[`Wait for the chest X-ray if the source is unclear`,`Never delay antibiotics for imaging.`],
[`30 mL/kg crystalloid for hypotension or lactate ≥4`,`Yes, with reassessment.`],
[`Vasopressors if MAP stays below 65 after fluids`,`Yes — noradrenaline first-line.`],
[`Hydrocortisone for every septic patient`,`Only for refractory shock on vasopressors.`]],a:[0,2,4,5],
h:`Four belong. Watch for words that change a good action into a harmful one.`,
e:`The bundle is about speed. Anything that delays antibiotics — even a good test — is the wrong order.`},
'A 22-year-old Umrah pilgrim':{t:'mcq',tag:'Spot the trap',q:`A 22-year-old Umrah pilgrim has fever, headache and a few dark-purple spots on his legs that don’t fade under a glass. BP 94/60. The LP tray is ready and your senior can do it in 10 minutes. What first?`,o:[
[`LP first, so the CSF is cultured before antibiotics sterilise it`,`Tempting — but delay kills within hours, and an LP is unsafe in shock or with low platelets.`],
[`Blood cultures, then ceftriaxone 2 g IV immediately`,''],
[`CT head, then LP, then antibiotics`,`Two delays before the only treatment that matters.`],
[`Ceftriaxone once the blood count confirms low platelets`,`The rash already tells you enough.`]],a:1,
h:`What is the one thing that changes his survival in the next hour?`,
e:`Suspected meningococcal sepsis: antibiotics first. Droplet precautions, notify infection control, contacts need prophylaxis. The LP can come later, if ever.`},
'A 30-year-old construction worker collapsed':{t:'mcq',tag:'Apply',q:`A 30-year-old construction worker collapsed on site at 14:00 in August. Rectal temperature 41.6 °C, GCS 10, glucose normal. What is the priority?`,o:[
[`IV access and 2 L of cold saline as the first cooling measure`,`Cold fluids help, but they cool slowly. Immersion or evaporative cooling is much faster.`],
[`Ice-water immersion or evaporative cooling now`,''],
[`Urgent CT head — a GCS of 10 needs imaging before cooling`,`The heat explains the low GCS. Cooling comes first; image if he doesn’t improve.`],
[`Paracetamol 1 g IV and ice packs to the armpits`,`Paracetamol doesn’t work in heat stroke, and ice packs alone are too slow.`]],a:1,
h:`What causes the organ damage — and what is the fastest way to stop it?`,
e:`Every minute above 40 °C damages organs. Cool first, stop at about 38.5–39 °C, then look for complications (rhabdomyolysis, DIC, kidney injury).`},
/* ---------- M9 ---------- */
'A man opens his eyes to pain':{t:'mcq',tag:'Calculate',q:`A man opens his eyes only to pain, says inappropriate words, and reaches up to push your hand away from his sternum. GCS?`,o:[
[`E2 V3 M5 = 10`,''],
[`E2 V4 M5 = 11`,`Inappropriate words = V3. V4 is confused conversation.`],
[`E2 V3 M4 = 9`,`Reaching towards the painful stimulus = localising (M5). Withdrawing = M4.`],
[`E3 V3 M5 = 11`,`E3 is eyes opening to voice. He needed pain.`]],a:0,
h:`Pushing your hand away from the sternum — is that withdrawing or localising?`,
e:`Localising means moving <b>towards</b> the stimulus to remove it. Report it as E2 V3 M5.`},
'A 17-year-old footballer collapsed':{t:'mcq',tag:'Spot the trap',q:`A 17-year-old footballer collapsed mid-match on a hot evening and recovered in a minute. He feels fine now. His uncle died suddenly at 35. ECG: sinus rhythm, QTc 510 ms. What now?`,o:[
[`Probable heat syncope — oral fluids, observe 2 hours, discharge`,`Jeddah heat makes this tempting, but syncope <b>during</b> exertion is never “just heat” until the heart is cleared.`],
[`High-risk syncope: monitor, senior, cardiology, no sport`,''],
[`Vasovagal — reassure and discharge with hydration advice`,`Vasovagal faints happen after standing or exertion, with warning — not mid-sprint.`],
[`Check electrolytes; if normal, discharge with a cardiology clinic in 6 weeks`,`Electrolytes are worth checking, but exertional syncope + family history + long QT needs monitoring now.`]],a:1,
h:`Three red flags are hidden in the question. Find them.`,
e:`Exertional syncope, family history of sudden death under 40, and a prolonged QTc. This could be an inherited arrhythmia syndrome.`},
'A 34-year-old has been seizing for 6 minutes':{t:'mcq',tag:'Apply',q:`A 34-year-old woman has been seizing for 6 minutes. Two attempts at IV access have failed. Glucose 5.4 mmol/L. What next?`,o:[
[`Keep trying for IV access — IV lorazepam works fastest`,`Every minute of seizure makes it harder to stop. Don’t let the vein become the delay.`],
[`IM midazolam 10 mg now, into the thigh`,''],
[`Insert an IO and load levetiracetam`,`IO access is useful, but levetiracetam is second-line — a benzodiazepine comes first.`],
[`Rectal diazepam 10 mg while you keep trying for IV`,`It works, but absorption is less reliable. IM or buccal midazolam is preferred.`]],a:1,
h:`Which first-line drug doesn’t need a vein?`,
e:`IM midazolam is as effective as IV lorazepam. Also ask: could she be pregnant or recently delivered? That would mean eclampsia and magnesium.`},
/* ---------- M10 ---------- */
'A 72-year-old on apixaban slipped':{t:'mcq',tag:'Apply',q:`A 72-year-old on apixaban slipped in the bathroom and hit her head. GCS 15, no vomiting, no amnesia. She wants to go home. Best plan?`,o:[
[`Discharge with head-injury advice — GCS 15 and no high-risk symptoms`,`Two high-risk features are hiding in the question.`],
[`CT head now, even though she feels well`,''],
[`Observe 4 hours; scan only if symptoms develop`,`Tempting, but delayed bleeds are more common on anticoagulants, and most protocols scan.`],
[`Give reversal for apixaban now, then decide on imaging`,`Reversal is for a confirmed significant bleed, not a precaution.`]],a:1,
h:`Look at her age and her medication list.`,
e:`Age ≥65 and anticoagulation both point to CT. Many protocols also advise a delayed review or a second scan.`},
'A 70 kg man has partial-thickness burns':{t:'mcq',tag:'Calculate',q:`A 70 kg man has partial-thickness burns to his whole back and both arms. Using 2 mL/kg/%TBSA, how much fluid in the first 8 hours, and from when?`,o:[
[`5,040 mL over 8 hours from the time of the burn`,`5,040 mL is the 24-hour total. Half goes in the first 8 hours.`],
[`2,520 mL over 8 hours from the time of the burn`,''],
[`2,520 mL over 8 hours from arrival in the ED`,`Right volume, wrong clock. The 8 hours start at the time of the burn.`],
[`10,080 mL in 24 hours, half in the first 8`,`That is the classic Parkland (4 mL) figure, not 2 mL/kg/%.`]],a:1,
h:`Back 18% + each arm 9%. Then 2 × kg × % — and halve it.`,
e:`36% TBSA × 70 kg × 2 = 5,040 mL in 24 h; 2,520 mL in the first 8 h <b>from the burn</b>. If he arrives 2 hours late, that volume goes in over 6 hours. Then titrate to urine output.`},
'A 28-year-old after an RTA: HR 132':{t:'mcq',tag:'Apply',q:`A 28-year-old after an RTA: HR 132, BP 86/58, confused, FAST positive in the right upper quadrant. Best plan?`,o:[
[`2 L of crystalloid, then repeat the FAST in an hour`,`Large crystalloid volumes worsen clotting, and an hour is too long.`],
[`Urgent CT abdomen to define the injury before theatre`,`CT is for stable patients. Taking an unstable patient to the scanner is dangerous.`],
[`Massive transfusion, TXA and straight to theatre`,''],
[`Blood, then interventional radiology for embolisation`,`IR suits stable patients or those responding to blood. Confused and hypotensive = theatre.`]],a:2,
h:`Is he stable enough to leave Resus for anything except theatre?`,
e:`Unstable + positive FAST = theatre. The haemoglobin can be normal early in bleeding.`},
/* ---------- M11 ---------- */
'A woman 10 days after delivery':{t:'mcq',tag:'Spot the trap',q:`Ten days after a delivery with an epidural, a woman has a severe headache and blurred vision. BP 168/112. What should you think about first?`,o:[
[`Post-dural puncture headache from the epidural`,`Tempting with an epidural history — but that headache is postural and doesn’t raise BP to 168/112 or blur vision.`],
[`Postpartum pre-eclampsia — even 10 days on`,''],
[`Migraine — she has a history of them`,`A past history doesn’t protect her. New features + hypertension come first.`],
[`Tension headache from lack of sleep`,`Common in new mothers, but it doesn’t explain the BP or the visual symptoms.`]],a:1,
h:`Which diagnosis explains all three: headache, visual symptoms <b>and</b> the blood pressure?`,
e:`Pre-eclampsia can appear up to 6 weeks after delivery. Venous sinus thrombosis is the other big postpartum diagnosis.`},
'A 16-year-old boy has had sudden severe right testicular pain':{t:'mcq',tag:'Apply',q:`A 16-year-old boy has had sudden severe right testicular pain for 2 hours, with vomiting. Ultrasound can scan him in 3 hours. What do you do?`,o:[
[`Wait for the Doppler — a normal result could avoid unnecessary surgery`,`A Doppler can look normal early in torsion. Waiting 3 hours puts the testis at risk.`],
[`Urgent urology review now for surgical exploration`,''],
[`Attempt manual detorsion; if the pain settles, arrange outpatient follow-up`,`Detorsion only buys time — he still needs surgery to fix the testis.`],
[`Treat as epididymitis: urine test and antibiotics`,`Sudden onset with vomiting at 16 is torsion until proven otherwise.`]],a:1,
h:`What decides the outcome here — the scan, or the clock?`,
e:`Clinical suspicion of torsion = surgical exploration. Salvage falls sharply after 6 hours.`},
/* ---------- M12 ---------- */
'A 2-year-old with fever lies still':{t:'mcq',tag:'Apply',q:`A 2-year-old with fever lies still on his mother’s lap. He doesn’t look at you or cry when examined, and his legs are mottled. His breathing is quiet and regular. What does the assessment triangle tell you?`,o:[
[`He is calm, which is more reassuring than a crying child`,`Calm is fine; not reacting to a stranger examining him is not.`],
[`Abnormal appearance and circulation — possible septic shock: Resus and senior now`,''],
[`Febrile child — give paracetamol and reassess his appearance in 30 minutes`,`Fever doesn’t cause mottling. Waiting loses time.`],
[`Normal work of breathing, so not critically ill — CTAS 3`,`Two of the three sides are abnormal. Breathing alone doesn’t clear him.`]],a:1,
h:`Score each side of the triangle separately.`,
e:`Poor interaction + mottled skin = compensated or decompensating shock. Children hold their BP until very late.`},
'Using the helper above':{t:'mcq',tag:'Calculate',q:`Using the APLS formulas: what is the estimated weight of a 4-year-old, and the size of one fluid bolus?`,o:[
[`16 kg, 160 mL`,''],
[`16 kg, 320 mL`,`20 mL/kg was the old bolus volume. Current guidance is 10 mL/kg, then reassess.`],
[`19 kg, 190 mL`,`3 × age + 7 is the formula for 6–12 years.`],
[`12 kg, 120 mL`,`That is closer to a 2-year-old.`]],a:0,
h:`For 1–5 years: (2 × age) + 8. Bolus: 10 mL/kg.`,
e:`(2 × 4) + 8 = 16 kg; 10 mL/kg = 160 mL, then reassess. Adult habits (“give a litre”) can drown a child.`},
'An 18-month-old has a barking cough':{t:'mcq',tag:'Apply',q:`An 18-month-old has a barking cough and stridor only when crying. Between coughs he is playing. Best treatment?`,o:[
[`Nebulised salbutamol to open the airway`,`Salbutamol works on the small airways, not the swollen upper airway in croup.`],
[`A single dose of oral dexamethasone, then observe`,''],
[`Nebulised adrenaline, then discharge after an hour`,`For severe croup, and it needs a longer observation — its effect wears off.`],
[`Oral antibiotics in case it turns bacterial`,`Croup is viral.`]],a:1,
h:`Stridor only when upset = mild to moderate. What reduces the swelling?`,
e:`Mild–moderate croup: oral dexamethasone, keep him calm on a parent’s lap, safety-net advice.`},
'A 3-month-old has a swollen thigh':{t:'mcq',tag:'Spot the trap',q:`A 3-month-old has a swollen thigh. The father says he “rolled off the sofa”. X-ray shows a femur fracture. What next?`,o:[
[`Above-knee cast and orthopaedic follow-up — some babies roll early`,`Some do — but a femur fracture from a sofa fall needs more force than that usually provides.`],
[`Tell your senior: safeguarding review and skeletal survey`,''],
[`Ask the father to describe the fall again in detail to check for inconsistencies`,`That is an interrogation. Leave it to the Child Protection team.`],
[`Admit under orthopaedics for traction and call the police office yourself`,`Admission may be right, but reporting goes through your senior and the pathway.`]],a:1,
h:`Does the mechanism match the injury and the baby’s development?`,
e:`Escalating isn’t an accusation — it protects the baby and is how the pathway works.`},
/* ---------- M13 ---------- */
'A 21-year-old with type 1 diabetes in DKA':{t:'mcq',tag:'Spot the trap',q:`A 21-year-old with type 1 diabetes is in DKA. Potassium is 3.0 mmol/L. When does the insulin infusion start?`,o:[
[`Now, but at half rate (0.05 units/kg/h) to protect the potassium`,`Even a low rate drives potassium into cells.`],
[`Once IV potassium brings K⁺ above about 3.3–3.5`,''],
[`Now, adding 40 mmol/L of potassium to the fluids at the same time`,`That is the plan for K⁺ 3.5–5.5. At 3.0 it isn’t safe.`],
[`After IV sodium bicarbonate has corrected the acidosis`,`Bicarbonate makes hypokalaemia worse and isn’t routine in DKA.`]],a:1,
h:`What does insulin do to potassium?`,
e:`Insulin moves potassium into cells. Starting it with a low K⁺ can cause fatal arrhythmias. Fluids and potassium first.`},
'A child was stung by a scorpion':{t:'mcq',tag:'Apply',q:`A 6-year-old was stung by a scorpion an hour ago while playing in the garden of his family’s villa in Obhur. He is sweating, vomiting and restless. BP 150/100. What next?`,o:[
[`Local lidocaine and analgesia, observe 4 hours — most stings settle`,`True for local symptoms only. He has systemic signs.`],
[`Systemic envenomation: senior, antivenom per protocol, monitored bed`,''],
[`Antihistamine and hydrocortisone for the reaction`,`This is envenomation, not allergy.`],
[`Oral nifedipine for the BP, then observe`,`The hypertension comes from the venom. Treat the cause.`]],a:1,
h:`Local pain only, or signs elsewhere in the body?`,
e:`Children are at highest risk. Systemic signs need antivenom and monitoring for heart and lung complications.`},
/* ---------- M14 ---------- */
'A Filipino domestic worker':{t:'mcq',tag:'Apply',q:`A Filipino domestic worker has lower abdominal pain. Her employer brought her, offers to translate, and says “she’s fine, just give her something.” She speaks some English. What is best?`,o:[
[`Let the employer translate — he knows her well and it saves time`,`He may not translate accurately, and his presence may stop her saying what matters.`],
[`Speak with her in English, with the employer outside`,''],
[`Use her roommate, who came along and speaks Tagalog`,`Better than the employer, but a friend isn’t confidential either.`],
[`Ask the employer whether she could be pregnant before you examine her`,`That is her information to share, privately, not his.`]],a:1,
h:`She can communicate. What is actually missing?`,
e:`She speaks English, so the gap is <b>privacy</b>. Lower abdominal pain needs a private history — pregnancy, injury or abuse may not be mentioned in front of an employer. Use a professional interpreter if her English isn’t enough.`},
'You realise you gave a patient paracetamol':{t:'mcq',tag:'Apply',q:`You realise you gave a 70 kg patient paracetamol 1 g IV two hours after the nurse gave 1 g. The patient is well. What do you do?`,o:[
[`Document it, but no further action — 2 g is well within the daily limit`,`Clinically probably harmless, but the system failure behind it isn’t.`],
[`Tell senior and nurse, document, incident report, adjust doses`,''],
[`Ask the nurse to delay the next dose — no report needed since there was no harm`,`Near-misses are exactly what incident reports are for.`],
[`Tell your senior and check a paracetamol level and liver tests`,`2 g in 2 hours isn’t a toxic dose. Tests won’t change anything.`]],a:1,
h:`Is an incident report about harm — or about learning?`,
e:`Reporting near-misses prevents the serious error next time. Never alter records.`},
'A 60-year-old man’s CT shows a likely pancreatic cancer':{t:'mcq',tag:'Apply',q:`A 60-year-old man’s CT shows a likely pancreatic cancer. His sons stop you: “Don’t tell him anything, he won’t cope.” What do you do?`,o:[
[`Agree for now and tell him it is “pancreatic inflammation” until the team meets`,`A temporary lie is still a lie — and it’s hard to undo.`],
[`Tell him the result yourself, gently and soon — it is his right to know`,`It is his right, but an intern shouldn’t give this news, and he may prefer his family to lead.`],
[`Acknowledge their worry; your senior asks the patient how he wants to hear results`,''],
[`Give the sons the full result so they can choose when and how to tell him`,`Sharing with family first, without his permission, breaches his confidentiality.`]],a:2,
h:`Whose preference decides how much he hears?`,
e:`Neither lying nor forcing information on him. The patient’s own wishes decide, and a senior leads the conversation.`},
/* ---------- M15 ---------- */
'Who do you hand over first?':{t:'mcq',tag:'Apply',q:`Who do you hand over first?`,o:[
[`The police case — the officer is still waiting`,`Waiting police don’t change clinical priority.`],
[`The grandmother in septic shock on noradrenaline`,''],
[`The allergy patient — she’s the quickest to hand over`,`Quick first is cherry-picking again.`],
[`The toddler — the mother is very anxious`,`Stable now, waiting for a bed.`]],a:1,
h:`Same rule as picking patients.`,e:`Sickest first. The unstable patient gets the incoming team’s freshest attention.`}
};

/* ---------- Case choices: plausible mistakes, not strawmen ---------- */
const C=(x,s,go,f)=>({x,s,go,f});
const CP={
'Your first hour':{
a:[C(`Explain calmly that patients are seen by urgency, tonight’s wait is long, and his father will be called soon`,0,'b',`Accurate — but it ends the conversation without learning anything about a father who may be getting worse.`),
C(`Introduce yourself, ask his father’s name and why he came, and check where he is on the list`,2,'c',`Name, empathy, action. Most anger in the ED is fear plus waiting.`),
C(`Apologise and ask the triage nurse to move his father up because he has waited two hours`,0,'b',`Waiting time alone isn’t a clinical reason to jump the queue — although checking on the father is the right instinct.`)],
c:[C(`Ask the triage nurse to repeat his vitals now, telling her he looks worse than before`,2,'d',`Triage is a snapshot. A waiting patient who looks different gets re-triaged.`),
C(`Check his triage vitals in the system — normal two hours ago — and reassure the son`,0,'d',`Two-hour-old numbers don’t describe the man now leaning against the wall.`),
C(`Tell the son you’ll see his father straight after the CTAS 3 patient you’re picking up`,1,'d',`Fair order in principle — but a patient who now looks pale needs reassessment first.`)]},
'The waiting room':{
a:[C(`Reassure her that vomiting is common with headaches, and ask the nurse for an antiemetic`,0,'b',`“Sudden, like being hit on the head” is a thunderclap headache — SAH until proven otherwise.`),
C(`Go and see him now, ask exactly how it started, and ask the nurse to re-triage`,2,'c',`The wife’s history changes everything. Sudden, worst-ever headache is CTAS 2.`),
C(`Ask the nurse to repeat his vitals; if they are normal, keep him CTAS 4`,1,'b',`Vitals are often normal in SAH. The history — onset — is what changes the level.`)],
c:[C(`Re-triage CTAS 2, tell your senior, urgent non-contrast CT head`,2,'d',`Right. CT within 6 hours of onset is very sensitive for SAH.`),
C(`Analgesia and an antiemetic; CT if it hasn’t settled in an hour`,0,'d',`Response to painkillers doesn’t rule out SAH. A warning bleed can improve before it rebleeds.`),
C(`Arrange a lumbar puncture — it is the most sensitive test for SAH`,1,'d',`LP has a role if CT is negative, but CT comes first.`)]},
'Needlestick at 3 a.m.':{
a:[C(`Squeeze it to make it bleed, finish the shift, and report to occupational health in the morning`,0,'b',`Squeezing isn’t recommended, and the delay pushes back HIV prophylaxis.`),
C(`Wash under running water, tell your senior and charge nurse, and go to the needlestick service now`,2,'c',`Correct: wash, don’t scrub or squeeze, report straight away.`),
C(`Wash it, finish the blood sample while you’re still gloved, then report`,1,'c',`Finishing the task delays assessment and risks a second injury while you’re shaken. Hand it over.`)]},
'“I want to go home”':{
a:[C(`Explain he can’t leave until the troponin is back, and ask security to stay near the door`,0,'b',`A competent adult can’t be held. Security is for violence, not disagreement.`),
C(`Sit down, ask what worries him, explain the risks plainly in Arabic, and call your senior`,2,'c',`Most patients stay once someone listens. Fear of cost, work or a long wait is common.`),
C(`Respect his decision — he is competent — and get the DAMA form signed before he gets angrier`,0,'b',`Too fast. A form doesn’t protect anyone if nobody assessed capacity or explained the risks.`)],
c:[C(`He has capacity: document, DAMA form, offer aspirin and advice, invite him back any time`,2,'d',`A safe DAMA keeps the door open.`),
C(`Call his wife and ask her to persuade him to stay before he signs anything`,1,'d',`Family can help if he agrees — but he has already made a capacitous decision. Don’t use them to pressure him.`),
C(`He refuses admission, so let him sign DAMA and go without starting medication, to limit liability`,0,'d',`Leaving against advice doesn’t mean losing all care. Offer whatever he will accept.`)]},
'The patient who looked fine':{
a:[C(`Give IV pantoprazole and an antacid, and reassess his pain in 30 minutes`,0,'b',`You’ve anchored on his diagnosis. A diabetic with epigastric pain needs an ECG first.`),
C(`Ask about exertion, radiation and sweating, and get a 12-lead ECG now`,2,'c',`Epigastric pain is an MI equivalent until the ECG says otherwise.`),
C(`Send bloods including troponin and lipase, and review when they’re back`,1,'b',`Good tests — but results take an hour. The ECG takes two minutes.`)],
c:[C(`Inferior STEMI: senior now, cath lab activation, aspirin 300 mg`,2,'d',`Correct. Ask for a right-sided ECG (V4R).`),
C(`Sublingual GTN for the pain, then repeat the ECG in 15 minutes`,0,'d',`GTN can crash BP in inferior/RV infarction, and STEMI doesn’t wait for a repeat ECG.`),
C(`Start heparin and admit to CCU as NSTEMI, since the troponin isn’t back yet`,0,'d',`ST elevation is STEMI, whatever the troponin. It needs reperfusion.`)]},
'Megacode: collapse in the corridor':{
a:[C(`Shout for help and start chest compressions straight away`,2,'b',`Recognise → call → compress.`),
C(`Check for a radial pulse and get a BP to confirm before starting`,0,'b2',`No central pulse and not breathing normally = arrest. Radial pulses and BP cuffs waste time.`),
C(`Put him in the recovery position and send someone for the doctor`,0,'b2',`The recovery position is for someone breathing normally.`)],
b:[C(`Shockable — charge, clear, shock 200 J, resume CPR immediately`,2,'c',`Shock and straight back on the chest.`),
C(`Shockable — shock, then check for a pulse to see if it worked`,0,'c',`Resume compressions immediately. Even after conversion, the heart rarely pumps well for the first minute.`),
C(`Adrenaline 1 mg first — the heart responds better to the shock`,0,'c',`In VF, defibrillation comes first.`)],
c:[C(`Shock, resume CPR, and give adrenaline 1 mg IV now`,2,'d',`AHA: adrenaline after the 2nd shock, then every 3–5 minutes.`),
C(`Shock, resume CPR, amiodarone 300 mg IV now`,1,'d',`Amiodarone is due after the 3rd shock.`),
C(`Shock, resume CPR, and give adrenaline only if still VF at the next check`,0,'d',`Under AHA, adrenaline goes in now.`)],
d:[C(`Shock, resume CPR, amiodarone 300 mg IV`,2,'e',`Correct. The next dose, 150 mg, comes after the 5th shock.`),
C(`Shock, resume CPR, adrenaline 1 mg IV`,1,'e',`Adrenaline was given 2 minutes ago — next due at 3–5 minutes. Amiodarone is due now.`),
C(`Shock, resume CPR, amiodarone 150 mg IV`,0,'e',`150 mg is the second dose. The first is 300 mg.`)],
e:[C(`Check the carotid pulse — no more than 10 seconds`,2,'f',`Organised rhythm → pulse check.`),
C(`It’s organised — stop compressions and get a BP`,0,'f',`A rhythm is not a pulse.`),
C(`Continue compressions for another full 2 minutes before checking`,1,'f',`An organised rhythm at a rhythm check gets a pulse check now.`)],
f:[C(`ABCDE, titrate to SpO₂ 92–98%, 12-lead ECG, glucose, MAP ≥65`,2,'g',`That is post-ROSC care.`),
C(`ABCDE, 12-lead ECG, and keep 100% oxygen for 24 hours to protect the brain`,0,'g',`Too much oxygen after ROSC is harmful. Titrate once SpO₂ is reliable.`),
C(`ABCDE, 12-lead ECG, and 2 L of fluid quickly to get the systolic to 120`,1,'g',`Hypotension needs treating, but big boluses can harm a heart that just arrested. Target MAP ≥65.`)]},
'“Just tired and a bit of heartburn”':{
a:[C(`12-lead ECG and hs-troponin now, before anything else`,2,'b',`Fatigue + breathlessness + “heartburn” in an elderly diabetic is ACS until proven otherwise.`),
C(`Give an antacid; do an ECG if it doesn’t help`,0,'b',`Response to antacids doesn’t exclude ACS.`),
C(`Chest X-ray and BNP — breathlessness in an elderly diabetic suggests heart failure`,1,'b',`Possible — but ACS must be excluded first, and the ECG comes first.`)],
b:[C(`Possible NSTEMI: aspirin, senior for anticoagulation and cardiology, monitor`,2,'c',`Right. Not a cath lab emergency unless she is unstable.`),
C(`Activate the cath lab now — raised troponin with ischaemic ST changes, give aspirin`,0,'c',`ST <b>depression</b> isn’t STEMI. Emergency activation is for STEMI or an unstable NSTEMI.`),
C(`Give aspirin, repeat the troponin in 3 hours, and refer to cardiology if still raised`,1,'c',`One raised troponin with ischaemic ECG changes is enough to start treatment.`)]},
'Dust storm Thursday':{
a:[C(`Oxygen, back-to-back salbutamol + ipratropium nebs, steroids, senior`,2,'b',`Can’t finish sentences + SpO₂ 90% = acute severe. Treat first.`),
C(`Salbutamol through his own inhaler with a spacer, then take a full history`,0,'b',`He is too breathless for a spacer to work. Oxygen-driven nebulisers.`),
C(`Oxygen, then a portable chest X-ray to exclude a pneumothorax before nebulisers`,0,'b',`X-ray after initial treatment, unless signs point to pneumothorax.`)],
b:[C(`Silent chest: senior now, magnesium 2 g IV, ABG, alert anaesthesia/ICU`,2,'c',`No wheeze + no air entry = near-fatal asthma.`),
C(`The wheeze has gone — he’s responding; continue nebulisers every 20 minutes`,0,'c',`Wheeze needs airflow. Its absence here is a bad sign.`),
C(`IV aminophylline as the next step`,1,'c',`A later option after senior review. Magnesium and escalation come first.`)],
c:[C(`A normal CO₂ here means he is tiring — escalate`,2,'d',`During an attack the CO₂ should be low.`),
C(`CO₂ is normal — continue treatment and repeat the gas in an hour`,0,'d',`A rising CO₂ is a pre-arrest sign in asthma.`),
C(`pH 7.33 is only mildly acidotic — start BiPAP`,1,'d',`NIV isn’t routine in asthma. Exhaustion needs anaesthetic assessment for intubation.`)]},
'Weakness since yesterday':{
a:[C(`Sepsis: senior, two IVs, lactate, cultures, antibiotics within the hour, fluids`,2,'b',`New confusion + RR 24 + SBP 94 = qSOFA 3.`),
C(`Two IVs, bloods and urine culture; start antibiotics once the dip confirms a UTI`,0,'b',`A dip doesn’t change the plan for a septic patient.`),
C(`Two IVs and bloods, then CT head first — new confusion in the elderly can be a stroke`,0,'b',`Fever, urinary symptoms and shock point to sepsis. Don’t delay antibiotics for CT.`)],
b:[C(`About 1,800 mL (30 mL/kg) as boluses, reassessing after each`,2,'c',`Correct. Listen for crackles between boluses.`),
C(`500 mL, then wait — she is elderly and may have heart failure`,1,'c',`Caution is reasonable, but lactate 4.6 needs the full 30 mL/kg unless she shows overload.`),
C(`1 L over 8 hours as maintenance`,0,'c',`Too little, too slow for septic shock.`)],
c:[C(`Septic shock — senior starts noradrenaline, plan ICU`,2,'d',`Don’t keep pouring fluid into a patient who isn’t responding.`),
C(`Another 2 L of crystalloid before considering vasopressors`,0,'d',`After 30 mL/kg, more fluid mainly causes oedema.`),
C(`Hydrocortisone 200 mg IV for possible adrenal insufficiency`,1,'d',`Steroids are for refractory shock already on vasopressors.`)]},
'“The fever finally went down”':{
a:[C(`Warning signs: CBC + haematocrit, senior, plan admission`,2,'b',`The fever settling is when leakage starts.`),
C(`The fever has gone — he’s recovering. Discharge with paracetamol and a CBC tomorrow`,0,'b',`Abdominal pain and bleeding gums are warning signs.`),
C(`IM diclofenac for the pain, and decide after the CBC`,0,'b',`NSAIDs and IM injections are both avoided in dengue.`)],
b:[C(`Leaking: senior, IV crystalloid per dengue protocol, close monitoring`,2,'c',`Rising HCT + falling platelets + narrow pulse pressure = leaking.`),
C(`Tell your senior and transfuse platelets — 38 is low and his gums are bleeding`,0,'c',`Prophylactic platelets aren’t recommended without significant bleeding. The problem is leakage.`),
C(`Admit, restrict IV fluids to avoid overload, and encourage oral intake`,1,'c',`Overload is a recovery-phase risk. Right now he is leaking and needs careful IV fluid.`)]},
'“His mouth turned”':{
a:[C(`Last known well 13:00 — glucose, stroke code, straight to CT`,2,'b',`Within the window. Glucose excludes the most common mimic.`),
C(`Check glucose and lower the BP with IV labetalol first, then arrange CT`,0,'b',`BP matters later if thrombolysis is planned. It doesn’t come before the code and the CT.`),
C(`Request an MRI — it is more sensitive for early ischaemic stroke`,0,'b',`MRI takes longer. The decision needs a CT now.`)],
b:[C(`Get it below 185/110 before lysis — IV labetalol per protocol`,2,'c',`Lower it carefully to just below the threshold.`),
C(`Sublingual nifedipine to bring the BP under 185/110 quickly`,0,'c',`Sudden large drops can extend the stroke.`),

'Rollover on Madinah Road':{

<script>/* ===== First Shift engine ===== */
(function(){
const APP=document.getElementById('app');
const KEY='firstshift.cmc.v3';
let S=load();
const BLK={};      // key -> block
const TMP={};      // transient selections
let VIEW={v:'home'};

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.ans)return s;}catch(e){}return{name:'',pos:{},ans:{},done:{}};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,seed){const r=rng(seed);const a=arr.map((x,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  if(a.every((x,i)=>x===i)&&a.length>1){[a[0],a[1]]=[a[1],a[0]];}return a;}
const M=()=>window.MODULES.find(m=>m.id===VIEW.m);
const drName=()=>S.name?('Dr. '+S.name):'Doctor';
function fill(h){return String(h).replace(/\{DR\}/g,esc(drName())).replace(/\{([^{}|]*)\|([^{}|]*)\}/g,(m,a,b)=>S.g==='f'?b:a);}

/* ---------- ECG generation ---------- */
function ecgPath(type,W,H,opt){
  opt=opt||{};const mid=H*0.58;const pts=[];const r=rng(hash(type+(opt.seed||'')));
  const beat=(x0,bw,amp,st,wide)=>{ // returns list of [x,y]
    const p=[];const f=(t)=>{ // t in 0..1 across beat
      let y=0;
      if(!wide){
        if(t>.10&&t<.20)y-=Math.sin((t-.10)/.10*Math.PI)*amp*.12; // P
        if(t>.26&&t<.28)y+=(t-.26)/.02*amp*.10; // Q
        if(t>=.28&&t<.31)y-=amp*(1-(Math.abs(t-.295)/.015))*1.0; // R
        if(t>=.31&&t<.34)y+=amp*.22*(1-Math.abs(t-.325)/.015); // S
        if(t>=.34&&t<.46)y-=st*amp; // ST
        if(t>=.46&&t<.62)y-=(Math.sin((t-.46)/.16*Math.PI)*amp*.24)+st*amp*(1-(t-.46)/.16);
      }else{
        if(t<.55)y-=Math.sin(t/.55*Math.PI)*amp*.95;
        else y+=Math.sin((t-.55)/.45*Math.PI)*amp*.55;
      }
      return y;};
    for(let i=0;i<=40;i++){const t=i/40;p.push([x0+t*bw,mid+f(t)]);}
    return p;};
  const amp=H*0.5;
  if(type==='asystole'){for(let x=0;x<=W;x+=4)pts.push([x,mid+Math.sin(x/37)*1.5+(r()-.5)*1.2]);}
  else if(type==='vf'){let a=amp*.5;for(let x=0;x<=W;x+=3){a+= (r()-.5)*2;a=Math.max(amp*.15,Math.min(amp*.6,a));pts.push([x,mid+Math.sin(x/7+Math.sin(x/23)*2)*a*.8+(r()-.5)*4]);}}
  else if(type==='vt'){const bw=W/(opt.beats||9);for(let x0=0;x0<W;x0+=bw)pts.push(...beat(x0,bw,amp*.9,0,true));}
  else if(type==='af'){let x0=0;while(x0<W){const bw=W/12*(0.6+r()*0.9);const b=beat(x0,bw,amp*.85,0,false).map(([x,y],i)=>{const t=i/40;let yy=y;if(t>.08&&t<.24)yy=mid; return [x,yy+Math.sin(x*1.3)*1.6+(r()-.5)*1.5];});pts.push(...b);x0+=bw;}}
  else { // sinus, stemi, brady, tachy

const STRIPS={sinus:'Sinus rhythm',vf:'Ventricular fibrillation',vt:'Ventricular tachycardia (wide, regular)',asystole:'Asystole',af:'Atrial fibrillation (irregularly irregular)',stemi:'ST elevation',brady:'Sinus bradycardia',tachy:'Sinus tachycardia',pea:'Organised rhythm on the monitor'};
function strip(type,label){
  const t=type==='pea'?'sinus':type;const d=ecgPath(t,600,90,{beats:type==='pea'?6:undefined});
  return `<div class="strip"><svg viewBox="0 0 600 90" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#2b1a14" stroke-width="1.6" stroke-linejoin="round"/></svg><div class="sl">${esc(label||'Rhythm strip — what is it?')}</div></div>`;
}
function monTrace(hr,rhythm){
  let type=rhythm||'sinus';if(hr===0||hr==='--')type=rhythm||'asystole';
  const beats=Math.max(1,Math.round((Number(hr)||60)*4/60));
  const d=ecgPath(type==='sinus'||type==='stemi'?type:type,400,46,{beats:beats,seed:'m'});
  return `<svg viewBox="0 0 800 46" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#3BE37A" stroke-width="1.6"/><path d="${d}" transform="translate(400 0)" fill="none" stroke="#3BE37A" stroke-width="1.6"/></svg>`;
}
function monitor(v,prev){
  v=v||{};prev=prev||{};
  const cell=(k,cls,lab,val)=>val===undefined?'':`<div class="v ${cls}${prev[k]!==undefined&&prev[k]!==val?' chg':''}"><small>${lab}</small><b>${esc(val)}</b></div>`;
  return `<div class="mon"><div class="trace">${monTrace(v.hr,v.r)}</div><div class="vit">${cell('hr','hr','HR',v.hr)}${cell('bp','bp','BP',v.bp)}${cell('sp','sp','SpO₂',v.sp)}${cell('rr','rr','RR',v.rr)}${cell('t','t','TEMP',v.t)}${cell('g','g','GLUC',v.g)}${cell('gcs','gcs','GCS',v.gcs)}</div></div>`;
}

/* ---------- block renderers ---------- */
function rb(b,k){
  BLK[k]=b;let h='';
  switch(b.t){
    case 'h':h=`<h3 class="h">${fill(b.x)}</h3>`;break;
    case 'h4':h=`<h4 class="h">${fill(b.x)}</h4>`;break;
    case 'p':h=`<div class="p"><p>${fill(b.x)}</p></div>`;break;
    case 'list':{const tag=b.o?'ol':'ul';h=(b.title?`<p style="margin-bottom:6px"><b>${b.title}</b></p>`:'')+`<${tag} class="l">${b.i.map(x=>`<li>${fill(x)}</li>`).join('')}</${tag}>`;break;}
    case 'mentor':{const who=b.who||'Dr. Hanan Al-Harbi · Consultant, Emergency Medicine';const av=b.av||'HH';h=`<div class="mentor"><div class="av ${b.c||''}">${av}</div><div class="bub"><div class="who">${who}</div>${fill(b.x)}</div></div>`;break;}
    case 'say':h=`<div class="say"><div class="who">${b.who}</div><div class="ar" lang="ar">${fill(b.ar)}</div>${b.en?`<div class="en">“${fill(b.en)}”</div>`:''}</div>`;break;
    case 'call':{const T={rule:'Rule',pearl:'Pearl',danger:'Never',saudi:'Saudi context',local:'CMC policy',idea:'The intuition'};h=`<div class="call ${b.k}"><div class="ct">${b.title||T[b.k]}</div>${fill(b.x)}</div>`;break;}
    case 'table':h=`<div class="tbl"><table><thead><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;break;
    case 'nums':h=`<div class="nums">${b.i.map(x=>`<div class="num"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`;break;
    case 'cards':h=`<div class="cards">${b.i.map((c,j)=>`<button class="flip" data-act="flip"><div class="in"><div class="f">${c[0]}<small>Tap to flip</small></div><div class="bk">${c[1]}</div></div></button>`).join('')}</div>`;break;
    case 'reveal':h=`<button class="reveal" data-act="reveal"><div class="rq">${b.q}</div><div class="ra">${fill(b.a)}</div></button>`;break;
    case 'strip':h=strip(b.r,b.label);break;
    case 'check':h=`${b.title?`<p style="margin-bottom:8px"><b>${b.title}</b></p>`:''}<div class="check">${b.i.map(x=>`<label><input type="checkbox"><span>${x}</span></label>`).join('')}</div>`;break;
    case 'mcq':h=rMcq(b,k);break;
    case 'multi':h=rMulti(b,k);break;
    case 'order':h=rOrder(b,k);break;
    case 'sort':h=rSort(b,k);break;
    case 'case':h=rCase(b,k);break;
    case 'tool':h=TOOLS[b.name]?splitTool(TOOLS[b.name].r(k,b)):'';break;

}
function splitTool(h){if(h.indexOf('<!--SPLIT-->')<0)return h;const a=h.indexOf('<div class="ts">');const tsEnd=h.indexOf('</div>',a)+6;const last=h.lastIndexOf('</div>');
  return h.slice(0,tsEnd)+'<div class="tgrid"><div class="tc">'+h.slice(tsEnd,last).replace('<!--SPLIT-->','</div><div class="to">')+'</div></div>'+h.slice(last);}
function sayH(s){return `<div class="say"><div class="who">${s.who}</div><div class="ar" lang="ar">${fill(s.ar)}</div>${s.en?`<div class="en">“${fill(s.en)}”</div>`:''}</div>`;}
function fbBox(ok,e,label){return `<div class="fb ${ok?'ok':'no'}"><b class="v">${label||(ok?'Correct':'Not quite')}</b>${fill(e||'')}</div>`;}
const OT=o=>Array.isArray(o)?o[0]:o, OW=o=>Array.isArray(o)?o[1]:'';
function hintBtn(b,k){return b.h?`<button class="hintb" data-act="hint" data-k="${k}">Need a hint?</button><div class="hintx" id="h-${k}">💡 ${fill(b.h)}</div>`:'';}
function rMcq(b,k){
  const a=S.ans[k];const tr=(S.tr&&S.tr[k])||[];const order=b.noshuffle?b.o.map((x,i)=>i):shuffle(b.o,hash(k+'o'));
  let h=`<div class="q"><div class="q-tag">${b.tag||'Check'}</div><div class="q-q">${fill(b.q)}</div><div class="opts">`;
  order.forEach((i,p)=>{const o=b.o[i];let c='opt';let dis=!!a;
    if(a){if(i===b.a)c+=' right';else if(i===a.v||tr.includes(i))c+=' wrong';else c+=' dim';}
    else if(tr.includes(i)){c+=' wrong';dis=true;}
    h+=`<button class="${c}" data-act="mcq" data-k="${k}" data-i="${i}" ${dis?'disabled':''}><span class="ol">${String.fromCharCode(65+p)}</span><span>${OT(o)}</span></button>`;});
  h+='</div>';

const GLOSS={'CTAS':'Canadian Triage and Acuity Scale — 5 levels of urgency used at triage.','ECG':'Electrocardiogram — a recording of the heart’s electrical activity (12 leads).','STEMI':'ST-elevation myocardial infarction — a fully blocked coronary artery. Needs the cath lab now.','NSTEMI':'Heart attack without ST elevation — troponin raised, artery not fully blocked.','ACS':'Acute coronary syndrome — unstable angina, NSTEMI or STEMI.','ABG':'Arterial blood gas — pH, oxygen, CO₂ and bicarbonate from an artery.','GCS':'Glasgow Coma Scale — consciousness score from 3 (none) to 15 (fully alert).','DKA':'Diabetic ketoacidosis — high sugar + ketones + acidosis, from lack of insulin.','ROSC':'Return of spontaneous circulation — the heart beats with a pulse again after arrest.','PEA':'Pulseless electrical activity — the monitor shows a rhythm, but there is no pulse.','TXA':'Tranexamic acid — a drug that helps blood clots hold. Given early in major bleeding.','FAST':'Focused Assessment with Sonography in Trauma — bedside ultrasound looking for free blood.','eFAST':'Extended FAST — adds the chest, to look for pneumothorax.','MAP':'Mean arterial pressure — the average pressure pushing blood into organs. Target ≥65.','qSOFA':'Quick sepsis screen: RR ≥22, new confusion, systolic BP ≤100.','DAMA':'Discharge against medical advice — a patient leaving before the team advises.','MLC':'Medico-legal case — has a legal side (accident, assault, poisoning…). Police are informed.','SBAR':'Situation, Background, Assessment, Recommendation — a structure for calling for help.','I-PASS':'Handover structure: Illness severity, Patient, Action list, Situation awareness, Synthesis.','DNR':'Do not resuscitate — no CPR if the heart stops. Decided by three physicians in Saudi policy.','TBSA':'Total body surface area — the % of skin burned.','CPR':'Cardiopulmonary resuscitation — chest compressions and breaths.','RSI':'Rapid sequence intubation — drugs to sedate and paralyse for putting in a breathing tube.','IO':'Intraosseous — a needle into the bone marrow, used when veins can’t be found.','BVM':'Bag-valve-mask — hand-squeezed bag to breathe for a patient.','PPE':'Personal protective equipment — gloves, gown, mask, eye protection.','SAH':'Subarachnoid haemorrhage — bleeding around the brain, often from a burst aneurysm.','AAA':'Abdominal aortic aneurysm — a ballooned aorta that can rupture.','CSF':'Cerebrospinal fluid — the fluid around the brain and spinal cord, taken by lumbar puncture.','LP':'Lumbar puncture — a needle into the lower back to take CSF.','β-hCG':'Pregnancy hormone — a positive test means pregnancy.','SpO₂':'Oxygen saturation measured by a finger probe.','NIV':'Non-invasive ventilation (BiPAP/CPAP) — breathing support through a tight mask.','Seha':'The Saudi health platform used to issue sick leaves electronically.','SCFHS':'Saudi Commission for Health Specialties — licenses health practitioners.','MERS-CoV':'Middle East respiratory syndrome coronavirus — screened for at triage.'};
const GRX=new RegExp('(^|[^A-Za-z0-9-])('+Object.keys(GLOSS).sort((a,b)=>b.length-a.length).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![A-Za-z0-9])');
function gloss(root){if(!root)return;const seen=new Set();const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest('button,svg,.ar,.gl,h3,h4,.tt,.case-h,.mon,.strip,label,select,.lgrid,.q-q,.who'))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{let txt=n.nodeValue;const m=txt.match(GRX);if(!m)return;const term=m[2];if(seen.has(term))return;seen.add(term);const i=m.index+m[1].length;
    const span=document.createElement('span');span.className='gl';span.dataset.t=term;span.textContent=term;const after=n.splitText(i);after.nodeValue=after.nodeValue.slice(term.length);n.parentNode.insertBefore(span,after);});}

APP.addEventListener('input',e=>{const el=e.target;const act=el.dataset&&el.dataset.act;if(!act)return;const k=el.dataset.k;
  if(act==='rng'){const v=+el.value;TMP[k][el.dataset.f]=v;setV(k,el.dataset.f,(el.dataset.f==='t'?v.toFixed(1):v)+el.dataset.u);const T=TOOLS[BLK[k].name];if(T&&T.u)T.u(k);return;}
  if(act==='abgin'){TMP[k][el.dataset.f]=el.value;const o=document.getElementById('abgout-'+k);if(o)o.innerHTML=TOOLS.abg.calc(TMP[k]);}
  if(act==='pedin'){let v=parseInt(el.value,10);if(isNaN(v))return;TMP[k][el.dataset.f]=Math.max(0,Math.min(el.dataset.f==='y'?12:11,v));rerenderKeepFocus(k,el);}
  if(act==='burnw'){const v=parseFloat(el.value);if(!v)return;TMP[k].w=v;rerenderKeepFocus(k,el);}
});
APP.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.act==='burnf'){TMP[el.dataset.k].f=+el.value;rerender(el.dataset.k);}});
function rerenderKeepFocus(k,el){const f=el.dataset.f||el.dataset.act;rerender(k);const n=document.querySelector(`#b-${CSS.escape(k)} input[data-act="${el.dataset.act}"]${el.dataset.f?`[data-f="${f}"]`:''}`);if(n){n.focus();const v=n.value;try{n.setSelectionRange(v.length,v.length);}catch(_){}}}


document.addEventListener('keydown',ev=>{if(VIEW.v!=='mod')return;const t=ev.target;if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'))return;if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
  const key=ev.key;
  if(key==='ArrowRight'||key==='Enter'){const nb=document.getElementById('nextb');if(nb&&!nb.disabled){ev.preventDefault();nb.click();}else if(!nb&&key==='Enter'){const b=document.querySelector('.end .btn');if(b)b.click();}return;}
  if(key==='ArrowLeft'){const pb=document.querySelector('.navbar [data-act=prev]');if(pb&&!pb.disabled){ev.preventDefault();pb.click();}return;}
  const idx='abcdefg'.indexOf(key.toLowerCase())>-1?'abcdefg'.indexOf(key.toLowerCase()):('1234567'.indexOf(key));if(idx<0)return;
  const qs=[...document.querySelectorAll('#scr .q, #scr .case')];
  for(const q of qs){const btns=[...q.querySelectorAll('button[data-act=mcq]:not([disabled]), button[data-act=multi]:not([disabled]), .chs button[data-act=case]')];if(!btns.length)continue;
    const all=[...q.querySelectorAll('button[data-act=mcq], button[data-act=multi], .chs button[data-act=case]')];const b=all[idx];if(b&&!b.disabled){ev.preventDefault();b.click();}break;}
});
home();
})();
</script>
