MODULES.push({id:'m02',n:2,part:'Part A · Arrive',title:'Triage with CTAS',sub:'How the ED decides who is seen first — and how to spot the patient who was under-triaged',mins:25,
take:[
`CTAS 1 immediately · 2 within 15 min · 3 within 30 · 4 within 60 · 5 within 120.`,
`Triage is a snapshot. Every patient can be <b>re-triaged</b> — and you should ask for it when someone looks worse.`,
`Abnormal vital signs, severe pain and a high-risk mechanism all push the level up.`,
`The elderly, diabetics, the immunocompromised, pregnant women and small children hide how sick they are.`,
`Status, wasta and volume of complaint never change the CTAS level. Only clinical findings do.`],
s:[
[
{t:'mentor',x:`<p>Most Saudi hospitals, including ours, use the <b>Canadian Triage and Acuity Scale — CTAS</b>. Triage nurses do it, but you must understand it: you will read it on every patient, and you will be the one who notices when it was wrong.</p>`},
{t:'table',head:['Level','Name','See doctor within','Typical examples'],rows:[
['<span class="ctas c1">1</span>','Resuscitation','Immediately','Cardiac arrest, major trauma in shock, severe respiratory distress, GCS 3–9'],
['<span class="ctas c2">2</span>','Emergent','15 minutes','Chest pain that could be cardiac, stroke symptoms, GCS 10–13, severe pain 8–10/10, suspected sepsis, overdose'],
['<span class="ctas c3">3</span>','Urgent','30 minutes','Moderate breathlessness, moderate pain 4–7/10, vomiting with mild dehydration, mild head injury awake'],
['<span class="ctas c4">4</span>','Less urgent','60 minutes','Minor laceration, sprain, UTI symptoms, chronic back pain without red flags'],
['<span class="ctas c5">5</span>','Non-urgent','120 minutes','Sore throat without distress, dressing change, medication refill']]},
{t:'call',k:'pearl',x:`The colours are not decoration. At CMC the triage band and the board use them: <span class="ctas c1">1</span> blue, <span class="ctas c2">2</span> red, <span class="ctas c3">3</span> yellow, <span class="ctas c4">4</span> green, <span class="ctas c5">5</span> white. Learn to read the board at a glance.`},
],
[
{t:'h',x:`How a level is decided`},
{t:'p',x:`The nurse starts with the <b>complaint</b> (e.g. “chest pain”), then applies <b>modifiers</b> that can push the level up:`},
{t:'list',i:[`<b>Vital signs</b> — shock, hypoxia, fever with signs of sepsis, altered consciousness.`,`<b>Pain</b> — severe acute central pain (chest, abdomen, head) goes higher than peripheral pain.`,`<b>Mechanism of injury</b> — high-speed RTA, ejection, fall from height, pedestrian hit.`,`<b>Specific risks</b> — immunocompromised with fever, anticoagulated with head injury, pregnant with abdominal pain.`]},
{t:'call',k:'idea',x:`Triage doesn’t ask <i>“what is wrong with this patient?”</i> It asks <b>“who can safely wait — and for how long?”</b> That’s why one bad vital sign can move someone to the front, even with a “minor” complaint.`},
{t:'tool',name:'ctas'},
{t:'call',k:'danger',title:'Under-triage traps',x:`These patients look better than they are:<ul><li><b>Elderly</b> — sepsis without fever, MI without pain, fractures from a “simple fall”.</li><li><b>Diabetics</b> — silent MI presenting as “tiredness” or “indigestion”. Very common in our population.</li><li><b>Young women</b> — abdominal pain + late period = ectopic until proven otherwise.</li><li><b>Children</b> — compensate until they suddenly crash.</li><li><b>Patients on beta-blockers</b> — no tachycardia even when bleeding.</li></ul>`},
{t:'mcq',q:`A 74-year-old woman is triaged CTAS 4 for “generally unwell”. Temperature 36.4 °C, HR 96, BP 104/60, RR 24, confused according to her daughter. What do you do?`,o:[`Nothing — the CTAS level is the nurse’s decision`,`Ask for re-triage: new confusion with RR 24 and soft BP suggests sepsis — CTAS 2`,`Wait for her turn, then order a urine test`,`Ask the daughter if the confusion is normal for her, and if so, leave her as CTAS 4`],a:1,e:`New confusion + fast breathing + soft BP = qSOFA 3 even without fever. Elderly septic patients are often afebrile. Speak up politely: “I’m worried she may be septic — could we re-triage?”`},
],
[
{t:'h',x:`Triage challenge — you are the triage doctor`},
{t:'p',x:`It is a Thursday evening in late summer. Ten patients are in the waiting area. Assign each a CTAS level.`},
{t:'sort',tag:'Triage 10 patients',q:`Assign a CTAS level to each patient.`,bins:CT,i:[
{x:`58M, central chest tightness for 40 min, sweaty. HR 98, BP 150/90, SpO₂ 97%.`,b:1,w:`Chest pain with cardiac features = CTAS 2, ECG within 10 minutes. If unstable, it becomes CTAS 1.`},
{x:`24M brought by friends, collapsed at the Corniche after jogging in 44 °C heat, confused, hot dry skin. Temp 41.2 °C.`,b:0,w:`Heat stroke: core temp >40 °C with altered mental state. Life-threatening — CTAS 1, cool immediately.`},
{x:`31F, sore throat for 2 days, eating and drinking, normal vitals.`,b:4,w:`CTAS 5. Still check for drooling, stridor or trismus.`},
{x:`45M, left-sided weakness and slurred speech that started 50 minutes ago.`,b:1,w:`Possible stroke inside the treatment window. CTAS 2 at minimum; most hospitals activate a stroke code from triage.`},
{x:`19M, 2 cm cut on his finger from a kitchen knife, bleeding controlled.`,b:3,w:`Minor laceration, controlled — CTAS 4.`},
{x:`3-year-old, fever 39.5 °C for 1 day, playful, drinking well, normal work of breathing.`,b:2,w:`Febrile child who looks well — CTAS 3. (A febrile infant under 3 months would be CTAS 2.)`},
{x:`66F, cannot finish a sentence, RR 34, SpO₂ 84% on air, known COPD.`,b:0,w:`Severe respiratory distress with hypoxia — CTAS 1.`},
{x:`37M, lower back pain for 3 weeks, no trauma, no fever, no numbness, walking.`,b:3,w:`Chronic, no red flags — CTAS 4. Red flags (saddle numbness, urinary retention, fever, cancer history) would push it up.`},
{x:`28F, lower abdominal pain, period “a week late”, HR 112, BP 98/62.`,b:1,w:`Possible ruptured ectopic with early shock. CTAS 2 — and a pregnancy test now.`},
{x:`52M, needs a refill of his blood pressure tablets, ran out yesterday, BP 142/88.`,b:4,w:`CTAS 5. Still check his BP is not dangerously high and he has no symptoms.`}]},
],
[
{t:'h',x:`Re-triage and the waiting room`},
{t:'p',x:`A CTAS level describes the patient <b>at the moment of triage</b>. Waiting times at a busy Jeddah ED can be long, especially on weekend nights and in Ramadan after iftar. People change.`},
{t:'list',i:[`Vitals should be repeated at intervals set by the CTAS level (CMC policy: at least every 30 min for CTAS 3 who are still waiting).`,`Any patient or relative who says “he is getting worse” gets a nurse looking at them — not a promise.`,`If you walk through the waiting area and someone looks grey, sweaty, confused or breathless: <b>tell the triage nurse and stay until they are reassessed</b>.`]},
{t:'case',title:'The waiting room',pt:'Thursday · 22:15',start:'a',mon:{hr:88,bp:'128/76',sp:'98%',rr:18,t:'37.0'},n:{
a:{x:`<p>A 33-year-old man was triaged CTAS 4 an hour ago: “headache since this afternoon, took paracetamol”. His wife comes to the triage desk.</p>`,say:{who:'His wife',ar:`لو سمحتوا، زوجي يقول الصداع مرة قوي وصار يرجّع، وقال إنه جاه فجأة كأن أحد ضربه على راسه.`,en:`Excuse me, my husband says the headache is really bad and he’s started vomiting. He said it came suddenly, like someone hit him on the head.`},
ch:[{x:`Tell her headaches often cause vomiting and he will be seen soon`,s:0,go:'b',f:`“Sudden, like being hit on the head” is a thunderclap headache — subarachnoid haemorrhage until proven otherwise.`},
{x:`Go and see him now, ask about the onset, and ask the nurse to re-triage`,s:2,go:'c',f:`The history the wife just gave changes everything. A <b>sudden, worst-ever headache</b> is CTAS 2.`}]},
b:{x:`<p>Ten minutes later he vomits again in the waiting area and seems drowsy.</p>`,mon:{hr:62,bp:'168/96',gcs:13},ch:[{x:`Now get him re-triaged and call your senior`,s:1,go:'c',f:`Better late than never — but drowsiness means bleeding may be worsening. The earlier signal was enough.`}]},
c:{x:`<p>He describes the headache as “the worst of my life”, maximum within a minute. Neck slightly stiff. GCS 15 but photophobic.</p>`,mon:{hr:70,bp:'158/94',gcs:15},ch:[{x:`CTAS 2, tell your senior, urgent non-contrast CT head`,s:2,go:'d',f:`Right. A CT within 6 hours of onset is very sensitive for SAH. Keep him lying quietly, control pain and nausea.`},
{x:`Give metoclopramide and paracetamol and see if it settles`,s:0,go:'d',f:`Response to painkillers does <b>not</b> rule out SAH. A “sentinel bleed” can improve before it rebleeds.`}]},
d:{x:`<p>CT shows subarachnoid blood. Neurosurgery is called. Your senior thanks the wife — and you.</p>`}},
debrief:`Relatives give you history the triage note does not have. <b>Onset</b> is the key word in headache: sudden = dangerous.`},
],
[
{t:'h',x:`Status, wasta and the queue`},
{t:'say',who:'A visitor on the phone, handing it to you',ar:`الدكتور فلان يبغى يكلمك، هذا قريبنا، يبغاكم تشوفون أمي دحين {لو سمحت|لو سمحتي}.`,en:`Dr. so-and-so wants to talk to you — he’s our relative. He’d like you to see my mother now, please.`},
{t:'p',x:`This will happen. Someone knows someone. The answer is always the same, and always polite: <b>the order is decided by how sick the patient is</b>. If the mother is sicker than triage thinks, she will be moved up — for clinical reasons.`},
{t:'call',k:'pearl',title:'A script that works',x:`“I understand you’re worried. Everyone here is seen in order of how urgent their condition is — that’s what protects your mother if she becomes sicker. Let me ask the nurse to check her again now.”<br>Then actually ask for her vitals. You have helped, and nobody jumped the queue.`},
{t:'mcq',q:`A well-known businessman with a CTAS 4 wrist sprain asks to be seen before a CTAS 3 elderly man. The hospital director’s office calls asking you to “take care of him”. What is right?`,o:[`See the businessman first — the call came from the director’s office`,`Explain politely that patients are seen by clinical priority, inform your senior, and see the CTAS 3 patient first`,`Ask the elderly man if he minds waiting`,`Discharge the businessman with a sling without examining him`],a:1,e:`Clinical priority protects everyone, including you. Let your senior deal with the administrative side — that is their job. Never skip an examination to “get rid of” someone.`},
]]});

/* ================= MODULE 3 ================= */
MODULES.push({id:'m03',n:3,part:'Part B · The rules',partSub:'What protects your patient — and your licence',title:'Safety, communication & documentation',sub:'When to call your senior, SBAR, verbal orders, patient ID, notes, handover and infection control',mins:25,
take:[
`Call your senior for: any CTAS 1–2, abnormal vitals, an abnormal ECG, every discharge, every medico-legal case, anyone who wants to leave — and whenever you are worried.`,
`Present with <b>SBAR</b>. Hand over with <b>I-PASS</b>. Every pending result has a name next to it.`,
`Two identifiers every time — name and MRN. Never the bed number.`,
`Read back every verbal order. Never change a note after the fact; write a timed addendum.`,
`Needlestick: wash, report immediately, occupational health the same shift. HIV prophylaxis works best within hours.`],
s:[
[
{t:'mentor',x:`<p>Almost every serious incident I have reviewed in twelve years had the same root cause: <b>someone knew something and did not say it</b>, or said it and was not heard. This module is about saying it clearly.</p>`},
{t:'h',x:`When to call your senior`},
{t:'p',x:`At CMC, interns <b>must</b> inform their senior immediately about:`},
{t:'check',i:[`Any CTAS 1 or 2 patient`,`Any abnormal vital sign that does not settle quickly (HR >120 or <50, SBP <90, SpO₂ <92%, RR >24, GCS drop, temp >39 °C or <36 °C with symptoms)`,`Any abnormal ECG`,`Before <b>every</b> discharge`,`Any patient who wants to leave against advice or has disappeared`,`Any medico-legal case, suspected abuse or police involvement`,`Any complaint, threat or aggression`,`Any death, or any patient who may die`,`Any time you feel uncomfortable — <b>“I’m worried” is enough</b>`]},
{t:'call',k:'rule',x:`There is no such thing as calling your senior too often in your first week. There is such a thing as calling too late.`},
],
[
{t:'h',x:`Present like a senior: SBAR`},
{t:'p',x:`When you call, your senior is usually busy with something else. Give them what they need in 30 seconds.`},
{t:'table',head:['','What to say','Example'],rows:[
['<b>S</b>ituation','Who, where, the one-line problem','“Dr. Fahad, it’s {DR}, intern. Bed 12, Mr. Saleh, 64, I’m worried he’s septic.”'],
['<b>B</b>ackground','Relevant history only','“Diabetic on dialysis, two days of fever and cough.”'],
['<b>A</b>ssessment','Vitals and what you think','“HR 124, BP 86/50, RR 28, SpO₂ 90%. I think pneumonia with septic shock.”'],
['<b>R</b>ecommendation','What you want and by when','“Can you see him now? I’ve sent cultures and a lactate. Should I start antibiotics and fluids?”']]},
{t:'call',k:'idea',x:`Write it like a news headline: the most important thing first. If your senior hangs up after one sentence, they should already know <b>who</b>, <b>what</b> and <b>how worried to be</b>.`},
{t:'order',q:`Put this call to your senior in SBAR order.`,i:[`“Bed 5, Mrs. Nora, 45 — she has new left-sided weakness.”`,`“She came in two hours ago with a migraine; she has hypertension.”`,`“Weakness started 20 minutes ago, glucose 6.2, BP 190/104. I think this is a stroke.”`,`“Can you come now? Should I call a stroke code?”`],e:`Situation → Background → Assessment → Recommendation. Notice the <b>time of onset</b> in the assessment — for a stroke, it decides the treatment.`},
],
[
{t:'h',x:`Orders, patient ID and high-alert drugs`},
{t:'list',i:[
`<b>Two identifiers</b> before any drug, blood, procedure or result: full name and medical record number (MRN). Never “the patient in bed 4” — patients move.`,
`<b>Verbal orders</b> only in emergencies. The nurse reads it back, you confirm — then you write it as soon as the emergency is over.`,
`<b>Allergies</b> — ask yourself, even if the triage note says “NKDA”.`,
`<b>High-alert medications</b> are double-checked: insulin, potassium, heparin, opioids, sedatives, inotropes, magnesium, chemotherapy.`,
`<b>Never write “U” for units</b> — it has been misread as a zero (10U → 100). Write “units” in full.`]},
{t:'mcq',q:`During a resuscitation your senior says “give 1 of adrenaline”. What should happen?`,o:[`The nurse gives 1 mL of whatever adrenaline is on the trolley`,`The nurse says “1 milligram of adrenaline IV, 1 in 10,000, giving now” and your senior confirms`,`You write the order first, then it is given`,`The nurse waits for the pharmacist`],a:1,e:`Closed-loop communication: the drug, dose, route and strength are said out loud and confirmed. In an arrest the order is written straight after.`},
],
[
{t:'h',x:`Documentation: if it isn’t written, it didn’t happen`},
{t:'p',x:`Your note is a clinical tool, a legal document and a message to the next doctor. In Saudi medico-legal reviews, the notes are often the only evidence of what you did.`},
{t:'list',i:[`Write the <b>time</b> of every entry, and the time you saw the patient.`,`Record vitals, positives <b>and important negatives</b> (“no neck stiffness”, “no saddle anaesthesia”).`,`Write what you discussed with the patient and family, and who was present.`,`Write your name, “intern”, and the name of the senior you discussed with.`,`<b>Never edit or delete</b> an earlier entry. Add a timed addendum: “Addendum 14:20 — …”.`,`Facts, not opinions. “Patient states he was hit with a stick” — not “patient was assaulted”.`]},
{t:'reveal',q:`What is wrong with this note? “Pt ok. Chest pain better. D/C.”`,a:`Almost everything. No time, no vitals, no ECG, no troponin, no senior named, “ok” means nothing, interns cannot discharge, and there is no safety-netting. A better version: <i>“15:40. Pain-free after GTN. HR 76, BP 132/80. ECGs at 0 and 2 h unchanged, hs-troponin 0 and 2 h below cut-off (values). Discussed with Dr. Fahad (registrar) — discharge with cardiology clinic in 1 week. Return precautions explained in Arabic to patient and son: return if pain recurs, breathlessness or fainting. — {DR}, intern.”</i>`},
],
[
{t:'h',x:`Handover with I-PASS`},
{t:'p',x:`Handover is the most dangerous moment of the shift. Use the same structure every time:`},
{t:'table',head:['','Meaning','Example'],rows:[
['<b>I</b>','Illness severity — stable, watcher, unstable','“Watcher.”'],
['<b>P</b>','Patient summary — one-liner, what was done','“Bed 9, 70M, CAP, had cultures and ceftriaxone at 17:00.”'],
['<b>A</b>','Action list — what is still to do, and by whom','“Lactate repeat due at 21:00 — I have asked the nurse.”'],
['<b>S</b>','Situation awareness / contingency — what if?','“If his BP drops below 90, start a second bolus and call the senior.”'],
['<b>S</b>','Synthesis by receiver — they repeat it back','“So: watcher, repeat lactate at 9, escalate if hypotensive.”']]},
{t:'mcq',q:`What is the most dangerous phrase in an ED handover?`,o:[`“He’s stable.”`,`“Bloods are pending.”`,`“Family is at the bedside.”`,`“The plan is admission under medicine.”`],a:1,e:`“Pending” with no name, no time and no action is how abnormal potassium levels get found at 6 a.m. Say who will check it and what to do if it is abnormal.`},
],
[
{t:'h',x:`Infection control and protecting yourself`},
{t:'call',k:'saudi',title:'MERS-CoV — a Saudi priority',x:`Saudi triage screens every patient with fever or respiratory symptoms for MERS-CoV with a few standard questions: <b>contact with a confirmed case</b>, recent work in or visit to a healthcare facility with MERS cases, or direct contact with camels. A positive screen means a surgical mask on the patient, an isolation room, and <b>N95 + gown + gloves + eye protection</b> for you. Infection control is notified. Follow the current MOH case definition posted at triage.`},
{t:'list',i:[`Hand hygiene at the <b>5 moments</b>: before touching a patient, before a clean procedure, after body-fluid exposure, after touching a patient, after touching their surroundings.`,`PPE <b>before</b> you enter an isolation room, not after you realise what it is.`,`Sharps go straight into the sharps bin, by the person who used them. Never re-cap.`]},
{t:'case',title:'Needlestick at 3 a.m.',pt:'Night shift',nomon:1,start:'a',n:{
a:{x:`<p>While taking blood from a confused patient, he pulls his arm and the needle goes into your finger. The patient has hepatitis C and an unknown HIV status. It’s 3 a.m. and the department is busy.</p>`,
ch:[{x:`Squeeze the finger hard to make it bleed, then carry on — you will report it in the morning`,s:0,go:'b',f:`Squeezing is not recommended and delaying the report delays HIV prophylaxis, which works best when started within hours.`},
{x:`Wash it under running water with soap, tell your senior and the charge nurse, and go to occupational health / the ED doctor on duty now`,s:2,go:'c',f:`Correct. Let it bleed freely, wash, don’t scrub or squeeze, and report immediately.`}]},
b:{x:`<p>By morning, nine hours have passed.</p>`,ch:[{x:`Report now`,s:0,go:'c',f:`Still worth doing — prophylaxis can be started up to 72 hours — but the earlier, the better.`}]},
c:{x:`<p>The ED doctor on duty assesses the exposure, the source patient’s bloods (HIV, HBV, HCV) are sent with consent, and you get baseline bloods. An incident report is filed. You are offered HIV prophylaxis while the source result comes back.</p><p>Your senior covers your patients. Nobody is upset with you.</p>`}},
debrief:`Every hospital has a needlestick pathway — find out where it is in your first week. Reporting protects you; it is never a mark against you.`},
]]});

/* ================= MODULE 4 ================= */
MODULES.push({id:'m04',n:4,part:'Part B · The rules',title:'Law, ethics & the Saudi context',sub:'Consent, refusal, confidentiality, medico-legal cases, abuse, DNR, death in the ED and pressure from outside',mins:30,
take:[
`A competent adult — man or woman — gives their own consent. A guardian consents for a minor. In a life-threatening emergency, treat without delay.`,
`A patient leaving against advice: check capacity, explain risks in their language, involve your senior, document, and tell them they can come back any time.`,
`Accidents, assaults, burns, poisonings, firearm injuries and unknown patients are medico-legal: inform the senior and the hospital police office. Describe — don’t interpret.`,
`Suspected abuse must be reported (Child Protection team / 1919). You don’t need proof — you need a reasonable suspicion.`,
`DNR is decided by three physicians, not by interns and not by the family. If there is no valid DNR, the patient is full code.`],
s:[
[
{t:'mentor',x:`<p>You will not be sued for not knowing a rare disease. You can get into real trouble for taking a history from the wrong person, sharing results on WhatsApp, or letting a confused patient walk out. This module is the part of medicine nobody taught you in lectures.</p>`},
{t:'h',x:`Consent — who signs?`},
{t:'list',i:[`A <b>competent adult</b> (18 and over) consents for themselves — <b>whether man or woman</b>. A Saudi MOH directive states that a guardian’s approval is not required for an adult woman to receive health services.`,`For a <b>minor</b> (under 18), consent comes from the parent or legal guardian.`,`Consent must be <b>informed</b> (risks, benefits, alternatives explained in a language they understand), <b>voluntary</b>, and given by someone with <b>capacity</b>.`,`In a <b>life-threatening emergency</b> where the patient cannot consent and delay would cause harm, treat. Document why.`,`Consent for a procedure is taken by the doctor performing it, or a licensed doctor — not by an intern on their behalf.`]},
{t:'call',k:'saudi',x:`Families are central in Saudi care, and patients often want relatives involved. Include them <b>when the patient wants it</b>. But the decision belongs to the competent patient. If a husband insists he must sign for his adult, competent wife, explain politely that the hospital takes her own consent — and involve your senior if it becomes a conflict.`},
{t:'mcq',q:`A 26-year-old married woman needs a CT with contrast. She agrees. Her husband is at work and unreachable. The radiographer asks whose signature is needed.`,o:[`Her husband’s — she is married`,`Her father’s`,`Her own — she is a competent adult`,`Nobody’s — CT doesn’t need consent`],a:2,e:`She is a competent adult and consents for herself. Contrast scans do need consent at most hospitals because of allergy and kidney risks.`},
],
[
{t:'h',x:`Capacity and leaving against medical advice (DAMA)`},
{t:'p',x:`A patient with capacity can refuse anything — even treatment that would save their life. To have capacity they must be able to <b>understand</b> the information, <b>retain</b> it, <b>weigh</b> it, and <b>communicate</b> a decision.`},
{t:'tool',name:'capacity'},
{t:'case',title:'“I want to go home”',pt:'Acute · bed 14',mon:{hr:92,bp:'148/90',sp:'97%',rr:18},start:'a',n:{
a:{x:`<p>A 52-year-old man with chest pain for 2 hours. First ECG shows subtle ST depression, troponin is pending. He takes off his monitor leads.</p>`,say:{who:'Patient, bed 14',ar:`خلاص يا {دكتور|دكتورة}، أنا أحسن دحين. عندي شغل بكرة الصبح، أبغى أطلع، {اكتبلي|اكتبيلي} ورقة وخلّصنا.`,en:`That’s it, doctor, I feel better now. I have work tomorrow morning. I want to leave — write me a paper and let’s finish this.`},
ch:[{x:`Tell him he can’t leave and ask security to stop him`,s:0,go:'b',f:`A competent adult cannot be detained. Force without legal grounds is assault. Security is for violence, not disagreement.`},
{x:`Sit down, ask what’s worrying him, explain in plain Arabic what the ECG may mean and what could happen, and call your senior`,s:2,go:'c',f:`Most DAMA patients stay once someone listens. Fear of cost, work, family or a long wait is common.`},
{x:`Give him the DAMA form to sign so he can go`,s:0,go:'b',f:`Too fast. The form doesn’t protect anyone if nobody assessed capacity and explained the risks.`}]},
b:{x:`<p>He is now angry and heading for the exit. Your senior arrives.</p>`,ch:[{x:`Let your senior lead while you listen`,s:1,go:'c',f:`OK — but you could have started that conversation.`}]},
c:{x:`<p>It turns out he is worried about missing a meeting where his contract is renewed. Your senior explains that this could be a heart attack and that it can cause sudden death. He understands and repeats the risks back correctly. He still wants to leave.</p>`,
ch:[{x:`Accept that he has capacity: document the discussion, he signs DAMA, give aspirin if he agrees, written advice, and tell him he can return any time`,s:2,go:'d',f:`That is a safe DAMA. You keep the door open — “you are welcome back at any hour, no need to wait from the start”.`},
{x:`Refuse to give him anything since he is leaving against advice`,s:0,go:'d',f:`Leaving against advice doesn’t mean losing all care. Offer whatever he will accept.`}]},
d:{x:`<p>He comes back the next morning at 06:00 with ongoing pain. Troponin is raised. Because the door was left open, he came back.</p>`}},
debrief:`A good DAMA note includes: capacity assessed, risks explained (specifically, e.g. “death”), in which language, who was present, senior’s name, what was offered, and that he was told he can return.`},
],
[
{t:'h',x:`Confidentiality`},
{t:'list',i:[`Information belongs to the patient. Relatives — including spouses and parents of adults — get details <b>only with the patient’s permission</b>.`,`Employers, schools, sponsors and the police receive information through <b>official hospital channels</b> (medical reports, the police office), not from you in the corridor.`,`<b>No photos of patients</b> on your phone, ever — not even “for learning”. No patient details in WhatsApp groups.`,`Watch your voice at the board. Curtains are not walls.`]},
{t:'mcq',q:`A caller says he is the brother of a patient admitted after an RTA and asks whether he was drunk. What do you say?`,o:[`Tell him the toxicology result`,`Say “I can’t share any information on the phone. Please come to the department, and with the patient’s permission the team will update you.”`,`Confirm the patient is here but say nothing else`,`Transfer him to the police office`],a:1,e:`You cannot verify a caller’s identity. Even confirming someone is a patient can be a breach. Keep it general and polite.`},
],
[
{t:'h',x:`Medico-legal cases (MLC)`},
{t:'p',x:`Some patients come with a legal side as well as a medical one. In Saudi hospitals, these are notified to the police through the hospital’s process — at CMC, the <b>hospital police office</b> next to the ED.`},
{t:'sort',q:`Medico-legal case or not?`,bins:[{l:'Medico-legal'},{l:'Not usually'}],i:[
{x:`Road traffic accident`,b:0,w:`Always an MLC, even if minor.`},
{x:`Assault or injury from a fight`,b:0},
{x:`Child with a fracture and a story that doesn’t fit`,b:0,w:`Suspected abuse — MLC and Child Protection.`},
{x:`Poisoning or overdose, accidental or intentional`,b:0},
{x:`Burns, firearm or stab wounds`,b:0},
{x:`Unidentified or unconscious patient with no companion`,b:0},
{x:`Work injury at a construction site`,b:0,w:`Workplace injuries are treated as medico-legal at most hospitals because of liability and insurance.`},
{x:`Elderly woman with pneumonia`,b:1},
{x:`Renal colic`,b:1},
{x:`Death on arrival or unexpected death in the ED`,b:0}]},
{t:'call',k:'rule',title:'Your role in an MLC',x:`<ul><li><b>Treat first.</b> The legal side never delays care.</li><li>Inform your senior; they inform the police office per policy.</li><li>Document injuries precisely: site, size (cm), shape, colour, type (abrasion, laceration, bruise, burn). Use a body diagram.</li><li>Write what the patient says in quotation marks. Do not write conclusions (“was beaten by husband”).</li><li>Preserve evidence: bag clothes in paper, don’t wash wounds more than needed, keep bullets and blades.</li><li>Medical reports for the police are written by a licensed doctor — not you.</li></ul>`},
],
[
{t:'h',x:`Abuse — children, women, the elderly`},
{t:'p',x:`Saudi law (the Child Protection Law and the Protection from Abuse Law) requires health practitioners to report suspected abuse or neglect. Hospitals have <b>Child Protection teams</b> linked to the National Family Safety Program, and the Ministry of Human Resources runs the <b>1919</b> reporting line.`},
{t:'list',title:'Red flags',i:[`A story that changes, or doesn’t match the injury or the child’s age`,`Delay in seeking care`,`Bruises in babies who aren’t yet mobile; bruises on the ears, neck or torso of young children`,`Patterned injuries: belt, hand, cigarette burn, immersion burn with clear lines`,`A partner who answers every question for the patient and won’t leave the room`]},
{t:'call',k:'pearl',x:`You need a <b>reasonable suspicion</b>, not proof. Your job is to notice, keep the patient safe, document, and escalate to your senior, the social worker and the Child Protection team. Do not confront the suspected abuser yourself.`},
{t:'mcq',q:`A 30-year-old woman has bruises of different ages on her arms. Her husband answers all your questions. What is your best next step?`,o:[`Ask her directly about abuse in front of her husband`,`Find a reason to examine her alone (e.g. “we examine all patients privately”), with a female nurse, and ask open, safe questions`,`Call the police from the bedside`,`Ignore it — it’s a family matter`],a:1,e:`Safety first: separate them without accusation. If she discloses, involve your senior and the social worker; they know the reporting pathway and safe options for her.`},
],
[
{t:'h',x:`DNR and code status`},
{t:'p',x:`Saudi policy (based on Fatwa 12086 and the 2017 national DNR policy of the Saudi Health Council) makes DNR a <b>medical decision by three physicians</b>, led by the consultant responsible for the patient. The family is informed and supported, but does not decide.`},
{t:'list',i:[`Before you start CPR, there is no time to research: <b>if there is no valid DNR form, the patient is full code.</b>`,`As an intern, you <b>never</b> write, change or discuss a DNR on your own.`,`A DNR is not “do not treat”. Pain relief, oxygen, antibiotics and dignity continue.`,`Check code status on handover for every frail, elderly or palliative patient.`]},
{t:'mcq',q:`An 88-year-old with metastatic cancer arrests in the ED. His son shouts “do everything!”. A nurse says she thinks there is a DNR from his last admission, but the form can’t be found.`,o:[`Don’t start CPR — the nurse remembers a DNR`,`Start CPR and call your senior; look for the valid form in parallel`,`Ask the son to decide`,`Do “slow code” — gentle compressions`],a:1,e:`No valid form in front of you means full resuscitation until a senior confirms otherwise. A “slow code” is dishonest and never acceptable.`},
],
[
{t:'h',x:`When a patient dies in the ED`},
{t:'list',i:[`Death is confirmed by a <b>licensed physician</b>. You may be present and learn the examination: no central pulse, heart sounds or breath sounds over several minutes of observation (commonly 5), fixed dilated pupils, no response to pain.`,`Note the time of death, who confirmed it, and who was told.`,`In a medico-legal or unexpected death, <b>leave all lines and tubes in place</b> and inform the police office.`]},
{t:'call',k:'saudi',title:'Caring for a Muslim patient after death',x:`Gently close the eyes and mouth, straighten the limbs, and if possible turn the body to face the qibla. Cover the body completely. Allow the family to be present and to pray. Families often want the body released quickly for washing and burial, ideally the same day — tell your senior early so paperwork isn’t the delay. Autopsy is uncommon and is mainly done when the law requires it.`},
{t:'say',who:'A daughter, after her father has died',ar:`الله يرحمه... يا {دكتور|دكتورة} متى نقدر ناخذه؟ نبغى ندفنه اليوم إن شاء الله.`,en:`May God have mercy on him… Doctor, when can we take him? We want to bury him today, God willing.`},
{t:'reveal',q:`What could you say?`,a:`Something simple and honest, after expressing condolence: <i>“عظم الله أجركم. الطبيب المسؤول بيكمل الأوراق دحين، وبنحاول نخلّصها بأسرع وقت عشان تقدرون تدفنونه اليوم.”</i> — “May God magnify your reward. The responsible doctor will complete the paperwork now, and we’ll try to finish it as quickly as possible so you can bury him today.” Then make sure it happens.`},
],
[
{t:'h',x:`Pressure from outside the bedside`},
{t:'table',head:['Situation','What you do'],rows:[
['A patient asks you for <b>sick leave</b> (إجازة مرضية)','Interns can’t issue it. Sick leaves are issued electronically through the Seha platform by a licensed physician. Refer to your senior — and never promise one.'],
['Someone asks for a <b>medical report</b> for court, police, school or work','Through the hospital’s medical reports process, by a licensed doctor.'],
['A relative becomes <b>aggressive</b>','Keep distance, don’t argue, keep the exit behind you, call security. Saudi law penalises assault on healthcare workers — you don’t have to tolerate it.'],
['A patient offers you a <b>gift or money</b>','Politely decline. A sincere “جزاك الله خير” is enough.'],
['<b>Social media</b>: a viral clip, a funny case','Never post about patients, even anonymised. Jeddah is a small city — people recognise each other.']]},
{t:'mcq',q:`A young man with a mild cold asks you for three days of sick leave “because the manager wants a paper”. What do you do?`,o:[`Write it on a hospital note paper`,`Tell him sick leaves go through Seha and are issued by a licensed doctor; ask your senior to assess whether it is medically justified`,`Tell him colds don’t get sick leave`,`Give him the senior’s mobile number`],a:1,e:`You don’t issue it and you don’t decide it alone. Your senior will assess and, if justified, issue it through Seha.`},
]]});

/* ================= MODULE 5 ================= */
MODULES.push({id:'m05',n:5,part:'Part C · Think & act',partSub:'The habits that keep patients alive',title:'The ED approach to any patient',sub:'Sick or not sick, ABCDE, worst-first thinking, presenting, disposition and safe discharge',mins:20,
take:[
`Decide <b>sick or not sick</b> from the doorway: work of breathing, skin colour, mental state.`,
`Unstable? Go <b>ABCDE</b> and fix as you find. History can wait two minutes.`,
`For every complaint, name the <b>can’t-miss diagnoses</b> before the likely one.`,
`Present with a one-liner: age, sex, key background, complaint, duration, vitals, your leading concern, your plan.`,
`A safe discharge has a diagnosis or a plan, a follow-up, medications explained and <b>clear return precautions</b> in the patient’s language.`],
s:[
[
{t:'mentor',x:`<p>Watch an experienced emergency physician walk into a cubicle. Within ten seconds they have decided something. They are not guessing — they are reading three things.</p>`},
{t:'h',x:`Sick or not sick — the 10-second look`},
{t:'table',head:['Look at','Sick','Not sick'],rows:[['Breathing','Working hard, tripoding, can’t finish sentences, silent','Talking comfortably'],['Skin','Grey, mottled, pale, sweaty','Normal colour, warm'],['Mental state','Confused, drowsy, agitated, “not himself”','Alert, engaged, annoyed about the wait']]},
{t:'sort',q:`Sick or not sick — from the doorway?`,bins:[{l:'Sick'},{l:'Not sick (yet)'}],i:[
{x:`60M sitting upright, gripping the bed rail, sweating, short sentences`,b:0},
{x:`25F on her phone, complaining loudly about the wait, pain 9/10 in her ankle`,b:1,w:`Severe pain matters, but she is not physiologically unwell. Treat her pain early.`},
{x:`80F lying quietly, eyes closed, doesn’t open them when you say her name`,b:0,w:`Quiet patients are often the sickest. A drop in consciousness is an emergency.`},
{x:`9-year-old crying, holding his forearm, pink and alert`,b:1},
{x:`45M with mottled knees and cold hands, says he feels “fine, just tired”`,b:0,w:`Mottling = poor perfusion. This is shock until proven otherwise.`}]},
],
[
{t:'h',x:`ABCDE — find and fix as you go`},
{t:'p',x:`If the patient is sick, don’t start with the history. Work through ABCDE and <b>treat each problem before moving on</b>.`},
{t:'table',head:['','Look for','Do'],rows:[
['<b>A</b>irway','Talking? Stridor, gurgling, snoring, swelling','Head tilt–chin lift / jaw thrust, suction, adjuncts, call for help early'],
['<b>B</b>reathing','RR, SpO₂, work of breathing, chest movement, breath sounds','Oxygen, sit up, nebulisers, decompress a tension pneumothorax'],
['<b>C</b>irculation','HR, BP, cap refill, skin, bleeding, ECG','Two large IV cannulas, bloods, fluids, stop bleeding'],
['<b>D</b>isability','GCS / AVPU, pupils, glucose, seizure activity','<b>Check glucose</b> in every unwell patient. Treat seizures.'],
['<b>E</b>xposure','Rash, injuries, temperature, bleeding, the back','Undress fully (with dignity and a chaperone), keep warm']]},
{t:'order',q:`A patient becomes unresponsive and is gurgling. Put your actions in order.`,i:[`Call for help`,`Open the airway: jaw thrust and suction`,`Check breathing and give high-flow oxygen`,`Check pulse, BP and get IV access`,`Check GCS, pupils and glucose`,`Expose and look for a cause`],e:`A before B before C. You fix the gurgling airway before counting the respiratory rate.`},
{t:'call',k:'pearl',title:'Shock index',x:`HR ÷ systolic BP. Above <b>1.0</b> (e.g. HR 110, BP 100) suggests significant shock even when the BP still looks “normal”. Young patients keep their BP up until they suddenly can’t.`},
],
[
{t:'h',x:`Worst-first thinking`},
{t:'p',x:`For every complaint, list the diagnoses that can kill or disable in hours <b>before</b> the common ones. Then decide what you need to rule each one out.`},
{t:'call',k:'idea',x:`A smoke alarm is built to go off for burnt toast, because missing a real fire is unacceptable. Emergency thinking works the same way: you will investigate many patients who turn out to be fine. That is the price of not missing the one who isn’t.`},
{t:'table',head:['Complaint','Can’t-miss diagnoses'],rows:[
['Chest pain','ACS, aortic dissection, PE, tension pneumothorax, tamponade, oesophageal rupture'],
['Headache','Subarachnoid haemorrhage, meningitis, venous sinus thrombosis, raised ICP, CO poisoning'],
['Abdominal pain','Ruptured AAA, ectopic, mesenteric ischaemia, perforation, MI presenting as epigastric pain'],
['Shortness of breath','PE, tension pneumothorax, anaphylaxis, pulmonary oedema, severe asthma'],
['Back pain','AAA, dissection, cauda equina, spinal abscess, malignancy'],
['Collapse / syncope','Arrhythmia, PE, GI bleed, ectopic, aortic stenosis, dissection'],
['Fever','Sepsis, meningitis, dengue with warning signs, neutropenic sepsis, malaria in travellers']]},
{t:'multi',q:`A 30-year-old man with sudden pleuritic chest pain and mild breathlessness after a long flight from Jakarta. Which diagnoses must you actively consider?`,o:[`Pulmonary embolism`,`Pneumothorax`,`Musculoskeletal pain`,`Acute coronary syndrome`,`Aortic dissection`,`Gastro-oesophageal reflux`],a:[0,1,3,4],e:`PE and pneumothorax lead the list (flight, sudden, pleuritic). ACS and dissection remain must-not-miss even in young men. MSK and reflux are diagnoses you reach <b>after</b> ruling those out.`},
],
[
{t:'h',x:`Presenting to your senior`},
{t:'p',x:`Your senior has five other patients. Start with a <b>one-liner</b> that tells them how worried to be.`},
{t:'call',k:'pearl',title:'The one-liner formula',x:`<b>Age + sex + key background + complaint + duration + key finding + your concern + your plan.</b><br><br>“Bed 6 is a 58-year-old diabetic smoker with 2 hours of central chest pressure. He’s sweaty, HR 98, BP 150/90, and his ECG has 1 mm ST depression in V4–V6. I’m worried about NSTEMI. I’ve given aspirin and sent a troponin; I’d like to start heparin and repeat the ECG.”`},
{t:'mcq',q:`Which is the best opening to a presentation?`,o:[`“So, this patient came today, he has a long history, he’s been to many hospitals, and…”`,`“Bed 3, 72F, on warfarin, fell at home 1 hour ago, hit her head, GCS 15, no focal signs. I’m concerned about a bleed — I’d like a CT head and INR.”`,`“I don’t know what’s wrong with bed 3, can you see her?”`,`“Bed 3 has a headache.”`],a:1,e:`It gives age, the risk factor that matters (anticoagulation), mechanism, findings, the concern and a plan. Your senior can say “yes” in five seconds. (Option C is fine as an emergency call — but not as a presentation.)`},
],
[
{t:'h',x:`Disposition and safe discharge`},
{t:'p',x:`Every patient ends in one of three places: <b>admit</b>, <b>observe</b>, or <b>discharge</b>. The decision is always made with your senior.`},
{t:'check',title:'Before any discharge, check:',i:[`Vital signs normal (or explained) at the time of discharge — not just at triage`,`Can-miss diagnoses addressed and documented`,`The patient can walk, eat, drink and manage at home (especially the elderly)`,`They understand the diagnosis or the plan`,`Prescriptions explained: what, how often, for how long`,`Follow-up booked or clearly explained (clinic, primary care centre)`,`<b>Return precautions</b> given in their language — specific, not “come back if worse”`,`Senior agreed, and documented`]},
{t:'say',who:'Good return precautions, explained to a patient with abdominal pain',ar:`إذا زاد الوجع، أو صار عندك حرارة، أو ترجّع وما تقدر تشرب، أو صار الوجع في الجهة اليمين تحت، ارجع للطوارئ على طول — في أي وقت، حتى بالليل.`,en:`If the pain gets worse, or you get a fever, or you keep vomiting and can’t drink, or the pain moves to the lower right side, come back to the ER straight away — any time, even at night.`},
],
[
{t:'case',title:'The patient who looked fine',pt:'Urgent care · 23:40',mon:{hr:64,bp:'118/74',sp:'98%',rr:16,t:'36.8'},start:'a',n:{
a:{x:`<p>A 47-year-old man in Urgent care, CTAS 4: “epigastric pain and nausea after a heavy kabsa dinner”. He smokes, and he is sitting on the bed looking only mildly uncomfortable. He has had diabetes for 10 years.</p>`,say:{who:'Patient',ar:`يا {دكتور|دكتورة} هي حموضة بس، كلت كبسة على العشا. {أعطني|أعطيني} إبرة للمعدة وأمشي.`,en:`Doctor, it’s just heartburn — I had kabsa for dinner. Give me an injection for the stomach and I’ll go.`},
ch:[{x:`Give a PPI injection and antacid, reassess in 30 minutes`,s:0,go:'b',f:`You’ve anchored on his diagnosis. A diabetic man with epigastric pain needs an ECG first.`},
{x:`Ask about exertion, radiation, sweating; get a 12-lead ECG now`,s:2,go:'c',f:`Epigastric pain is an MI equivalent until an ECG says otherwise — especially in diabetics.`}]},
b:{x:`<p>Twenty minutes later the nurse calls you: he is sweaty and his HR has dropped.</p>`,mon:{hr:46,bp:'92/60'},ch:[{x:`Get the ECG now and call your senior`,s:1,go:'c',f:`Recovered — but bradycardia and hypotension with epigastric pain is a classic inferior MI.`}]},
c:{x:`<p>The ECG:</p>`,strip:'stemi',stripl:'Lead II — ST elevation (also III and aVF on the 12-lead)',
ch:[{x:`Inferior STEMI: call your senior, activate the cath lab, aspirin 300 mg chewed, move to Resus`,s:2,go:'d',f:`Correct. Door-to-balloon target ≤90 minutes from first contact. Ask your senior to request a right-sided ECG (V4R).`},
{x:`Repeat the ECG in 1 hour to see if it changes`,s:0,go:'d',f:`Time is muscle. A STEMI gets the cath lab now.`}]},
d:{x:`<p>He goes to the cath lab: right coronary artery occlusion, stented. Your senior asks you to present the case at Thursday teaching — as an example of <b>not trusting the triage label</b>.</p>`}},
debrief:`Inferior MIs often present with epigastric pain, nausea and bradycardia. Ask for a right-sided ECG and be careful with nitrates (right ventricular involvement → preload-dependent).`},
]]});

/* ================= MODULE 6 ================= */
MODULES.push({id:'m06',n:6,part:'Part C · Think & act',title:'Resuscitation essentials',sub:'High-quality CPR, the ACLS algorithm, roles in a code, Hs & Ts, shock, oxygen and post-ROSC care',mins:25,
take:[
`Compress at 100–120/min, 5–6 cm deep, full recoil, pauses under 10 seconds. Swap compressors every 2 minutes.`,
`Shockable (VF / pulseless VT): shock → CPR 2 min. Adrenaline 1 mg after the 2nd shock, then every 3–5 min. Amiodarone 300 mg after the 3rd shock, 150 mg after the 5th.`,
`Non-shockable (asystole / PEA): CPR and adrenaline 1 mg <b>as soon as possible</b>, then every 3–5 min.`,
`Look for reversible causes — the 5 Hs and 5 Ts — throughout.`,
`After ROSC: ABCDE, SpO₂ 92–98%, MAP ≥65, 12-lead ECG, glucose, avoid fever, find the cause.`],
s:[
[
{t:'mentor',x:`<p>In your first code, your job is not to lead — it’s to be <b>excellent at one task</b>. Most often that task is compressions. Good compressions are the single biggest thing you can do for survival.</p>`},
{t:'nums',i:[['100–120','compressions per minute'],['5–6 cm','depth in adults'],['< 10 s','maximum pause for rhythm check or shock'],['30 : 2','without an advanced airway'],['2 min','then swap compressor and check rhythm'],['1 / 6 s','breaths once intubated (10/min), compressions continuous']]},
{t:'tool',name:'cpr'},
{t:'call',k:'pearl',x:`Full recoil matters as much as depth: the heart fills while the chest comes back up. Don’t lean on the chest.`},
],
[
{t:'h',x:`Roles in a code`},
{t:'table',head:['Role','Job'],rows:[['Team leader (senior)','Hands off. Runs the algorithm, decides, thinks about causes.'],['Compressor ×2','Swap every 2 minutes on the leader’s count.'],['Airway','Bag-mask, adjuncts, suction; prepares for intubation.'],['Defibrillator','Pads on, charges during compressions, shocks safely.'],['Drugs / IV','IV or IO access, draws and gives drugs, says them out loud.'],['Recorder','Times: arrest, each shock, each drug, each rhythm check.']]},
{t:'call',k:'rule',title:'Closed loop, every time',x:`Leader: “Give 1 milligram of adrenaline IV.” → Nurse: “1 milligram adrenaline IV — given.” → Recorder: “Adrenaline at 04:16.”`},
{t:'mcq',q:`You arrive at a code. Everyone has a job except you. What is the most useful thing to say?`,o:[`“What happened?”`,`“I’m {DR}, intern — I can take over compressions at the next swap.”`,`Nothing — stand at the back and watch`,`“Should we give atropine?”`],a:1,e:`Introduce yourself to the leader and offer a specific task. Too many voices make a code worse.`},
],
[
{t:'h',x:`Read the rhythm`},
{t:'p',x:`At each rhythm check you need one decision: <b>shockable or not?</b>`},
{t:'call',k:'idea',x:`Think of the heart as a pump with its own electrical wiring.<ul><li><b>VF</b>: the wiring is short-circuiting chaotically → a shock resets it.</li><li><b>Asystole</b>: no electricity at all → a shock has nothing to reset.</li><li><b>PEA</b>: the wiring works but the pump isn’t pumping → find out why (empty tank, squeezed heart, blocked outflow).</li></ul>`},
{t:'strip',r:'vf',label:'Strip A'},
{t:'mcq',q:`Pulseless patient, strip A. Shockable?`,o:[`Yes — ventricular fibrillation`,`No — asystole`,`No — this is artefact, check the leads`],a:0,e:`Chaotic, irregular waves with no QRS complexes = VF. Shock.`},
{t:'strip',r:'asystole',label:'Strip B'},
{t:'mcq',q:`Pulseless patient, strip B. What do you do?`,o:[`Shock at 200 J`,`Continue CPR, give adrenaline 1 mg as soon as possible, check the leads and gain`,`Give atropine 3 mg`],a:1,e:`Asystole is not shockable. Confirm it’s real (leads connected, gain up), then CPR + adrenaline ASAP. Atropine is no longer used in arrest.`},
{t:'strip',r:'pea',label:'Strip C — but no pulse'},
{t:'mcq',q:`The monitor shows an organised rhythm (strip C), but there is no pulse.`,o:[`This is PEA — non-shockable. CPR, adrenaline, and look hard for Hs and Ts`,`Shock — it’s VT`,`Stop CPR — the rhythm is normal`],a:0,e:`Pulseless electrical activity. The electricity is there, the pump isn’t. Reversible causes are common: bleeding, tension pneumothorax, tamponade, hyperkalaemia, PE.`},
],
[
{t:'h',x:`The Hs and Ts`},
{t:'cards',i:[['Hypoxia','Oxygen, airway, check tube position.'],['Hypovolaemia','Bleeding (trauma, GI, ectopic, AAA) — fluids and blood.'],['Hydrogen ions (acidosis)','DKA, sepsis, toxins. Treat the cause.'],['Hypo-/Hyperkalaemia','Renal patients, missed dialysis. Calcium for high K.'],['Hypothermia','Rare in Jeddah — but think of drowning.'],['Tension pneumothorax','Trauma, ventilated patients. Decompress.'],['Tamponade','Penetrating trauma, post-cardiac surgery. Bedside echo.'],['Toxins','Overdose, organophosphates. Antidotes.'],['Thrombosis — pulmonary','Massive PE. Consider thrombolysis.'],['Thrombosis — coronary','STEMI. Cath lab after ROSC.']]},
{t:'multi',q:`A 45-year-old dialysis patient who missed two sessions arrests in the waiting area. Which reversible causes are most likely?`,o:[`Hyperkalaemia`,`Hypothermia`,`Fluid overload / hypoxia`,`Tension pneumothorax`,`Acidosis`],a:[0,2,4],e:`Missed dialysis → high potassium, fluid overload with hypoxia, and metabolic acidosis. Give IV calcium early.`},
],
[
{t:'case',title:'Megacode: collapse in the corridor',pt:'Resus · 04:10',mon:{hr:'--',bp:'--',sp:'--',rr:0,r:'asystole'},start:'a',n:{
a:{x:`<p>A 61-year-old man waiting for his wife collapses in the corridor. He is unresponsive, not breathing normally. You can’t feel a carotid pulse. No monitor is attached yet.</p>`,
ch:[{x:`Shout for help, start chest compressions immediately`,s:2,go:'b',f:`Recognise → call → compress. Every minute without CPR reduces survival.`},
{x:`Look for a BP cuff to confirm he has no blood pressure`,s:0,go:'b2',f:`No pulse and not breathing normally = cardiac arrest. Don’t waste time on a BP.`},
{x:`Run to find the senior`,s:0,go:'b2',f:`Shout for help — don’t leave the patient.`}]},
b2:{x:`<p>Nearly a minute has passed. A nurse arrives and starts compressions.</p>`,ch:[{x:`Take over compressions and ask for the defibrillator`,s:1,go:'b',f:`Back on track.`}]},
b:{x:`<p>The team arrives. Pads are on. Your senior pauses for a rhythm check.</p>`,mon:{r:'vf'},strip:'vf',stripl:'Rhythm check 1',
ch:[{x:`Shockable — charge and shock (200 J biphasic), then resume CPR immediately`,s:2,go:'c',f:`Shock, and back on the chest straight away. Don’t check the pulse after the shock.`},
{x:`Give adrenaline 1 mg before shocking`,s:0,go:'c',f:`In VF, the first priority is defibrillation. Adrenaline comes after the 2nd shock (AHA).`},
{x:`Check the pulse again for 30 seconds`,s:0,go:'c',f:`Pause under 10 seconds. Long pauses kill.`}]},
c:{x:`<p>CPR continues for 2 minutes. A nurse has IV access. Rhythm check:</p>`,strip:'vf',stripl:'Rhythm check 2',
ch:[{x:`Shock, resume CPR, adrenaline 1 mg IV now`,s:2,go:'d',f:`AHA: adrenaline after the 2nd shock, then every 3–5 minutes. (ERC gives it after the 3rd — follow your hospital’s protocol.)`},
{x:`Shock and give amiodarone 300 mg`,s:1,go:'d',f:`Amiodarone comes after the 3rd shock.`},
{x:`Stop — he has been down too long`,s:0,go:'d',f:`Witnessed VF arrest with CPR started quickly has one of the best survival rates. Keep going.`}]},
d:{x:`<p>Another 2 minutes. Rhythm check:</p>`,strip:'vf',stripl:'Rhythm check 3',
ch:[{x:`Shock, resume CPR, amiodarone 300 mg IV`,s:2,go:'e',f:`Correct. The next amiodarone dose, 150 mg, comes after the 5th shock if needed.`},
{x:`Give atropine`,s:0,go:'e',f:`Atropine has no role in cardiac arrest.`}]},
e:{x:`<p>Two minutes later the monitor shows an organised rhythm. Your senior asks you to check for a pulse.</p>`,mon:{r:'sinus'},strip:'sinus',stripl:'Rhythm check 4',
ch:[{x:`Check the carotid pulse for no more than 10 seconds`,s:2,go:'f',f:`Organised rhythm → pulse check. If there’s no pulse, it’s PEA — back to CPR.`},
{x:`Assume ROSC and stop compressions without checking`,s:0,go:'f',f:`A rhythm is not a pulse.`}]},
f:{x:`<p>There is a strong carotid pulse. <b>ROSC.</b></p>`,mon:{hr:104,bp:'96/58',sp:'91%',rr:'BVM',r:'sinus'},
ch:[{x:`ABCDE, titrate oxygen to SpO₂ 92–98%, 12-lead ECG, glucose, BP target MAP ≥65, and look for the cause`,s:2,go:'g',f:`That’s post-ROSC care. The 12-lead often shows the cause — a STEMI needs the cath lab.`},
{x:`Give 100% oxygen for as long as possible`,s:1,go:'g',f:`High oxygen at first is fine, but too much oxygen after ROSC causes harm. Titrate once you can measure SpO₂ reliably.`}]},
g:{x:`<p>The 12-lead shows an anterior STEMI. He goes to the cath lab with your senior. His wife is with the social worker; your senior will speak to her.</p>`,mon:{hr:96,bp:'112/70',sp:'96%',rr:14}}},
debrief:`Shockable arrest rhythm: <b>shock → CPR 2 min → shock → CPR + adrenaline → shock → CPR + amiodarone</b>. Always look for the cause.`},
],
[
{t:'h',x:`Shock — before the arrest`},
{t:'p',x:`Most in-hospital arrests are preceded by hours of warning signs. Shock = inadequate tissue perfusion. Recognise the type and you know the treatment.`},
{t:'tool',name:'shock'},
{t:'call',k:'danger',title:'Anaphylaxis',x:`Airway, breathing or circulation problem after a trigger (food, drug, sting) → <b>adrenaline 0.5 mg IM</b> (0.5 mL of 1 mg/mL) into the outer thigh. Repeat every 5 minutes if needed. Antihistamines and steroids are not first-line.`},
{t:'mcq',q:`A 25-year-old develops lip swelling, wheeze and BP 80/50 after IV ceftriaxone. First drug?`,o:[`Chlorphenamine IV`,`Hydrocortisone IV`,`Adrenaline 0.5 mg IM`,`Salbutamol nebuliser`],a:2,e:`Adrenaline IM first, every time. Stop the infusion, lie them flat (or sitting if breathless), high-flow oxygen, IV fluids.`},
],
[
{t:'h',x:`Oxygen and the airway — your basic toolkit`},
{t:'table',head:['Device','Flow','Delivers approx.'],rows:[['Nasal cannula','1–4 L/min','24–40%'],['Simple face mask','5–10 L/min','40–60%'],['Non-rebreather (reservoir)','15 L/min','60–90%'],['Venturi mask','Per colour','24–60% (controlled — COPD)'],['Bag-valve-mask','15 L/min','Up to 100% with a good seal']]},
{t:'list',i:[`Targets: SpO₂ <b>94–98%</b> for most patients, <b>88–92%</b> for patients at risk of CO₂ retention (COPD).`,`Bag-mask ventilation is a two-person job when it’s hard: one holds the mask with both hands, one squeezes.`,`Give each breath over 1 second, just enough to see the chest rise.`,`Oropharyngeal airway: measure from the incisors to the angle of the jaw. Only in unconscious patients without a gag reflex.`]},
]]});

/* ================= MODULE 7 ================= */
MODULES.push({id:'m07',n:7,part:'Part D · Core presentations',partSub:'What will come through the doors this month',title:'Chest pain & breathlessness',sub:'ACS and STEMI, dissection, PE, pneumothorax, asthma, COPD, pulmonary oedema and ABGs',mins:25,
take:[
`Every adult with chest pain (or an “equivalent”: epigastric pain, breathlessness, sweating, collapse) gets a 12-lead ECG <b>within 10 minutes</b>.`,
`STEMI → senior + cath lab now. Aspirin 300 mg chewed unless contraindicated. Door-to-balloon ≤90 min.`,
`One normal troponin early on does not rule out ACS. Use the CMC serial troponin pathway.`,
`Tearing pain to the back, pulse or BP difference between arms → think dissection. <b>No heparin, no thrombolysis</b> until it’s excluded.`,
`Severe asthma: can’t finish sentences, PEF <50%. Life-threatening: silent chest, SpO₂ <92%, exhaustion, a “normal” CO₂.`],
s:[
[
{t:'mentor',x:`<p>Chest pain is the presentation that will teach you the most about emergency medicine — because most of it is harmless, and the rest can kill within an hour. Your job is not to diagnose every chest pain. It is to <b>not miss the dangerous ones</b>.</p>`},
{t:'nums',i:[['10 min','door to first ECG'],['300 mg','aspirin, chewed'],['≤ 90 min','door to balloon in STEMI'],['0 / 1–3 h','serial hs-troponin per CMC pathway']]},
{t:'h',x:`STEMI — know it when you see it`},
{t:'list',i:[`New ST elevation at the J-point in <b>two contiguous leads</b>: ≥1 mm in most leads; in V2–V3 ≥2 mm in men ≥40, ≥2.5 mm in men <40, ≥1.5 mm in women.`,`Territories: II, III, aVF = inferior · V1–V4 = anterior · I, aVL, V5–V6 = lateral.`,`<b>Equivalents</b> your senior will want to see immediately: new LBBB with symptoms, ST depression in V1–V3 (posterior MI), hyperacute T waves, ST elevation in aVR with widespread depression.`,`If the first ECG is normal but the story is good: <b>repeat it every 15–30 minutes</b> while there is pain.`]},
{t:'tool',name:'leads'},
{t:'mcq',q:`ST elevation in V1–V4 with reciprocal depression in II, III and aVF. Which artery is most likely blocked?`,o:[`Right coronary artery`,`Left anterior descending`,`Circumflex`,`It is pericarditis`],a:1,e:`Anterior STEMI = LAD. Pericarditis gives widespread, concave ST elevation with PR depression and no reciprocal changes.`},
],
[
{t:'h',x:`ACS doesn’t always look like ACS`},
{t:'call',k:'saudi',x:`Saudi Arabia has one of the highest rates of diabetes in the world, and many patients have it for years before diagnosis. Diabetics, women and the elderly often present with <b>tiredness, breathlessness, nausea, “indigestion” or collapse</b> — not crushing chest pain.`},
{t:'case',title:'“Just tired and a bit of heartburn”',pt:'Acute · bed 3',mon:{hr:96,bp:'138/84',sp:'96%',rr:20,t:'36.9'},start:'a',n:{
a:{x:`<p>A 63-year-old woman, diabetic for 15 years, hypertensive. Triage: CTAS 3, “fatigue”.</p>`,say:{who:'Patient',ar:`والله {يا ولدي|يا بنتي} من أمس وأنا تعبانة، ونفَسي ضايق شوية، وعندي حموضة هنا. قلت يمكن من الأكل.`,en:`Honestly, {my son|my daughter}, since yesterday I’ve been tired, a bit short of breath, and I have heartburn here. I thought maybe it was the food.`},
ch:[{x:`12-lead ECG and hs-troponin now`,s:2,go:'b',f:`Exactly. Fatigue + breathlessness + “heartburn” in an elderly diabetic is ACS until proven otherwise.`},
{x:`Give an antacid and see if it works`,s:0,go:'b',f:`Response to antacids doesn’t exclude ACS. ECG first, always.`}]},
b:{x:`<p>ECG: 1.5 mm ST depression in V4–V6, no ST elevation. hs-troponin: raised above the 99th percentile.</p>`,
ch:[{x:`Present as possible NSTEMI: aspirin 300 mg, discuss anticoagulation and cardiology with your senior, repeat ECG, keep monitored`,s:2,go:'c',f:`Right. NSTEMI isn’t a cath lab emergency unless she is unstable, but she needs treatment and admission.`},
{x:`Activate the cath lab for STEMI`,s:0,go:'c',f:`No ST elevation. Know the difference — a false activation pulls a team from another patient.`},
{x:`Discharge with cardiology follow-up as she now feels better`,s:0,go:'c',f:`Raised troponin + ischaemic ECG = admission.`}]},
c:{x:`<p>She is admitted to cardiology and has a coronary angiogram the next day showing a tight circumflex stenosis.</p>`}},
debrief:`Elderly patients often call a young doctor “my son” (يا ولدي) or “my daughter” (يا بنتي) — they speak to you like family. Let it build trust; it doesn’t replace introducing yourself properly.`},
],
[
{t:'h',x:`The other killers`},
{t:'table',head:['','Clues','First steps','Avoid'],rows:[
['Aortic dissection','Sudden tearing pain radiating to the back; BP or pulse difference between arms; new aortic regurgitation; neuro deficit','Senior now, CT aortogram, pain relief, lower HR (<60) then BP (systolic 100–120) with IV beta-blocker','Heparin, thrombolysis'],
['Pulmonary embolism','Pleuritic pain, breathlessness, tachycardia, recent surgery/immobility/long flight, pregnancy, cancer','Wells score; D-dimer only if low probability; CTPA if high; anticoagulate; thrombolysis if massive','D-dimer in high-probability patients'],
['Tension pneumothorax','Severe breathlessness, absent breath sounds one side, hypotension, distended neck veins','Clinical diagnosis — decompress immediately (adults: 4th/5th intercostal space, mid-axillary line), then chest drain','Waiting for an X-ray'],
['Cardiac tamponade','Hypotension, raised JVP, muffled heart sounds; trauma, malignancy, renal failure','Bedside echo, senior, pericardiocentesis','Large fluid boluses alone']]},
{t:'mcq',q:`A 49-year-old hypertensive man has sudden severe pain between his shoulder blades. BP right arm 182/100, left arm 140/86. Which treatment must you avoid until imaging?`,o:[`Morphine`,`IV labetalol`,`Heparin`,`Oxygen`],a:2,e:`This looks like aortic dissection. Anticoagulation or thrombolysis can be fatal. Pain control and controlling HR and BP are correct.`},
],
[
{t:'h',x:`Breathlessness: asthma, COPD and pulmonary oedema`},
{t:'table',head:['Asthma severity','Features'],rows:[
['Moderate','Increasing symptoms, PEF 50–75% of best/predicted, talking in sentences'],
['Acute severe','Any of: PEF 33–50%, RR ≥25, HR ≥110, <b>can’t complete sentences</b>'],
['Life-threatening','Any of: PEF <33%, SpO₂ <92%, <b>silent chest</b>, cyanosis, poor effort, exhaustion, confusion, hypotension, arrhythmia, a “normal” PaCO₂']]},
{t:'list',title:'Acute severe asthma — what you start while calling your senior',i:[`Oxygen to SpO₂ 94–98%`,`Salbutamol 5 mg nebulised, back-to-back if needed (oxygen-driven)`,`Ipratropium 0.5 mg nebulised`,`Prednisolone 40–50 mg orally or hydrocortisone 100 mg IV`,`If not improving: magnesium sulphate 2 g IV over 20 minutes, ABG, senior/ICU`]},
{t:'call',k:'saudi',x:`Jeddah has frequent <b>dust storms</b> (غبار) in spring and summer. On those days expect a wave of asthma and COPD exacerbations — and keep nebulisers stocked.`},
{t:'cards',i:[['COPD exacerbation','Target SpO₂ <b>88–92%</b> with a Venturi mask. Nebulisers (air-driven if CO₂ retainer), steroids, antibiotics if sputum is purulent. ABG — consider BiPAP if pH <7.35 and PaCO₂ high.'],['Acute pulmonary oedema','Sit upright, oxygen, CPAP/BiPAP early. Nitrates if systolic BP >100 (sublingual, then infusion). Furosemide IV if fluid overloaded. Find the cause: ACS, arrhythmia, valve, missed dialysis.'],['Pneumonia','CURB-65 helps (Confusion, Urea >7, RR ≥30, BP <90/≤60, age ≥65). Antibiotics per CMC guide. Think MERS, TB and COVID in the right context.'],['Silent chest','Not improvement. It means almost no air is moving. Senior and anaesthesia immediately.']]},
],
[
{t:'h',x:`Blood gases without fear`},
{t:'tool',name:'seesaw'},
{t:'p',x:`Four steps: <b>1.</b> pH — acidaemia or alkalaemia? <b>2.</b> Which explains it — CO₂ (respiratory) or HCO₃⁻ (metabolic)? <b>3.</b> Is there compensation? <b>4.</b> If metabolic acidosis, calculate the anion gap.`},
{t:'tool',name:'abg'},
{t:'mcq',q:`pH 7.31, PaCO₂ 62 mmHg, HCO₃⁻ 30 in a breathless COPD patient. Best description?`,o:[`Metabolic acidosis`,`Respiratory acidosis with metabolic compensation (chronic)`,`Respiratory alkalosis`,`Normal`],a:1,e:`High CO₂ explains the low pH, and the raised HCO₃⁻ shows the kidneys have been compensating for some time — an acute-on-chronic picture is common in COPD.`},
],
[
{t:'case',title:'Dust storm Thursday',pt:'Resus · 16:30',mon:{hr:124,bp:'132/80',sp:'90%',rr:32,t:'37.1'},start:'a',n:{
a:{x:`<p>A 19-year-old known asthmatic is brought in by his brother during a dust storm. He is sitting forward, using his neck muscles.</p>`,say:{who:'Patient (between breaths)',ar:`مو قادر... أتنفس... البخاخ... ما نفع`,en:`Can’t… breathe… the inhaler… didn’t work`},
ch:[{x:`Oxygen, salbutamol + ipratropium nebulisers now, call your senior, steroids`,s:2,go:'b',f:`He can’t finish sentences and SpO₂ is 90% — this is acute severe, possibly life-threatening. Treat first, then history.`},
{x:`Take a full history first, including triggers and medication`,s:0,go:'b',f:`The history can wait. ABCDE.`},
{x:`Get a chest X-ray before treatment`,s:0,go:'b',f:`X-ray only after initial treatment, unless you suspect pneumothorax.`}]},
b:{x:`<p>After two back-to-back nebulisers he is still struggling. You listen to his chest: very little air entry on either side, no wheeze.</p>`,mon:{hr:136,sp:'88%',rr:34},
ch:[{x:`Recognise a silent chest: senior to bedside now, magnesium 2 g IV, ABG, alert anaesthesia/ICU`,s:2,go:'c',f:`A silent chest is life-threatening. The lack of wheeze is a bad sign, not a good one.`},
{x:`Good — the wheeze has gone, he’s improving`,s:0,go:'c',f:`Dangerous misread. Wheeze needs airflow. No wheeze + no air entry = near-fatal asthma.`}]},
c:{x:`<p>ABG: pH 7.33, PaCO₂ 46 mmHg.</p>`,
ch:[{x:`A normal-to-rising CO₂ in an asthmatic this tachypnoeic is a sign of exhaustion — escalate`,s:2,go:'d',f:`Correct. During an attack the CO₂ should be <b>low</b>. A “normal” CO₂ means he is tiring.`},
{x:`CO₂ is near normal, so he is safe`,s:0,go:'d',f:`Exactly the trap. Rising CO₂ is a pre-arrest sign in asthma.`}]},
d:{x:`<p>Your senior and the anaesthetist manage him in Resus. After magnesium and continuous nebulisers he improves slowly and goes to the ICU for observation.</p>`,mon:{hr:112,sp:'95%',rr:24}}},
debrief:`In acute asthma, three findings mean <b>“get help now”</b>: silent chest, SpO₂ under 92%, and a normal or high PaCO₂.`},
]]});

/* ================= MODULE 8 ================= */
MODULES.push({id:'m08',n:8,part:'Part D · Core presentations',title:'Sepsis, fever & the Jeddah specials',sub:'The sepsis hour-1 bundle, dengue, MERS-CoV, Hajj and Umrah, meningococcal disease and heat stroke',mins:25,
take:[
`Sepsis hour-1 bundle: lactate, blood cultures before antibiotics, broad-spectrum antibiotics, 30 mL/kg crystalloid for hypotension or lactate ≥4, vasopressors for MAP <65.`,
`Dengue: paracetamol only — <b>no NSAIDs, no aspirin, no IM injections</b>. The danger comes as the fever settles (days 3–7). Know the warning signs.`,
`Fever + non-blanching rash = meningococcal disease until proven otherwise. Ceftriaxone now; don’t wait for the LP.`,
`Heat stroke = core temperature >40 °C + altered mental state. <b>Cool first</b>, everything else second.`,
`Fever and cough after contact with a MERS case or a hospital stay: screen and isolate. Fever in a returning traveller: think malaria.`],
s:[
[
{t:'mentor',x:`<p>Sepsis kills more of our patients than heart attacks do — and it is far easier to miss. The septic patient often walks in, talks to you, and just says he feels weak.</p>`},
{t:'h',x:`Recognising sepsis`},
{t:'list',i:[`<b>Sepsis</b> is life-threatening organ dysfunction caused by the body’s response to infection.`,`<b>Septic shock</b>: needs vasopressors to keep MAP ≥65 and lactate >2 mmol/L despite adequate fluids.`,`Screening clue — <b>qSOFA</b> (any 2): RR ≥22, new confusion, systolic BP ≤100. qSOFA misses many cases; use it as a red flag, not a rule-out.`,`Other clues: lactate ≥2, mottled skin, low urine output, low platelets, hypothermia, new confusion in the elderly.`]},
{t:'call',k:'idea',x:`In sepsis the bacteria are rarely what kills. It’s the body’s overreaction: vessels widen and leak, blood pressure falls, and organs starve of oxygen. That is why fluids and pressure support matter as much as the antibiotic — and why the clock matters.`},
{t:'nums',i:[['1 hour','to start the bundle'],['30 mL/kg','crystalloid for hypotension or lactate ≥4'],['MAP ≥ 65','target — noradrenaline if fluids don’t work'],['≥ 2','lactate (mmol/L) that should be repeated']]},
{t:'multi',q:`Which belong in the hour-1 sepsis bundle?`,o:[`Measure lactate`,`Blood cultures before antibiotics`,`Broad-spectrum antibiotics`,`Wait for the CT result before antibiotics`,`30 mL/kg crystalloid if hypotensive or lactate ≥4`,`Vasopressors if MAP stays <65`],a:[0,1,2,4,5],e:`Never delay antibiotics for imaging. If cultures will take more than a few minutes, give antibiotics first.`},
{t:'call',k:'local',x:`Use the CMC empirical antibiotic guide (posted in Resus) — it is built from our local resistance data. When in doubt, ask the pharmacist. Neutropenic patients (on chemotherapy) get antibiotics <b>within an hour, before</b> the blood count comes back.`},
],
[
{t:'case',title:'Weakness since yesterday',pt:'Acute · bed 8',mon:{hr:118,bp:'94/56',sp:'94%',rr:24,t:'38.6'},start:'a',n:{
a:{x:`<p>A 76-year-old woman brought by her son. She has had burning on passing urine for three days and is now “not herself”.</p>`,say:{who:'Her son',ar:`أمي من أمس مو طبيعية، ما تعرفني كويس، وتتكلم كلام مو مفهوم. هي عادي تكون صاحية ومرة واعية.`,en:`My mother hasn’t been normal since yesterday — she doesn’t recognise me properly and she’s saying things that don’t make sense. Normally she’s very alert and sharp.`},
ch:[{x:`Recognise sepsis: tell your senior, two IV cannulas, lactate, blood and urine cultures, start antibiotics within the hour, fluids`,s:2,go:'b',f:`New confusion + RR 24 + SBP 94 = qSOFA 3, likely urosepsis. The clock started at triage.`},
{x:`Send a urine dipstick and wait for the result`,s:0,go:'b',f:`A dipstick doesn’t change the plan for a patient with sepsis. Bundle first.`}]},
b:{x:`<p>Lactate is 4.6 mmol/L. She weighs about 60 kg.</p>`,
ch:[{x:`30 mL/kg = about 1,800 mL crystalloid, given in boluses with reassessment after each`,s:2,go:'c',f:`Correct. Reassess for crackles and breathing after each bolus, especially in elderly patients with heart disease.`},
{x:`One litre over 8 hours`,s:0,go:'c',f:`Too little, too slow for septic shock with lactate >4.`}]},
c:{x:`<p>After 2 litres her BP is 84/50, MAP about 61.</p>`,mon:{hr:112,bp:'84/50'},
ch:[{x:`Septic shock — senior starts noradrenaline (peripherally is acceptable initially), plan for ICU`,s:2,go:'d',f:`Don’t keep pouring fluid into a patient who isn’t responding. Vasopressors are next.`},
{x:`Give another 3 litres`,s:0,go:'d',f:`Excess fluid causes pulmonary oedema. After 30 mL/kg, vasopressors come in.`}]},
d:{x:`<p>Her MAP rises to 68 on noradrenaline. She is admitted to the ICU. Her son asks if she will recover; your senior speaks to him.</p>`,mon:{hr:98,bp:'102/60'}}},
debrief:`The son told you the most important fact: <b>this is new confusion</b>. Always ask “is this normal for her?”`},
],
[
{t:'h',x:`Dengue — Jeddah’s seasonal guest`},
{t:'call',k:'saudi',x:`Dengue is endemic in Jeddah and the western region, spread by the <i>Aedes aegypti</i> mosquito, with peaks in the hot, humid months and after rain. It is a notifiable disease — tell your senior so it is reported to the MOH.`},
{t:'tool',name:'dengue'},
{t:'list',title:'Warning signs (WHO) — admit and tell your senior',i:[`Abdominal pain or tenderness`,`Persistent vomiting`,`Fluid accumulation (ascites, pleural effusion)`,`Mucosal bleeding (gums, nose)`,`Lethargy or restlessness`,`Liver enlargement >2 cm`,`Rising haematocrit <b>with</b> a rapid fall in platelets`]},
{t:'call',k:'danger',x:`Paracetamol only for fever and pain. <b>No ibuprofen, diclofenac or aspirin</b> (bleeding risk) and <b>no IM injections</b> (haematomas).`},
{t:'case',title:'“The fever finally went down”',pt:'Urgent care · 20:10',mon:{hr:108,bp:'102/84',sp:'98%',rr:20,t:'37.2'},start:'a',n:{
a:{x:`<p>A 28-year-old man from Al-Safa district. Fever for four days.</p>`,say:{who:'Patient',ar:`لي أربعة أيام حرارة وجسمي كله مكسّر. أمس الحرارة نزلت الحمد لله، بس اليوم بطني يوجعني ومرة تعبان، ولثّتي نزّلت دم وأنا أفرّش.`,en:`I’ve had a fever for four days and my whole body aches. Yesterday the fever went down, thank God, but today my stomach hurts, I’m really tired, and my gums bled when I brushed.`},
ch:[{x:`Recognise warning signs in the critical phase: CBC with haematocrit, dengue NS1/serology, tell your senior, plan admission`,s:2,go:'b',f:`Fever settling + abdominal pain + mucosal bleeding = critical phase with warning signs. This is when patients deteriorate.`},
{x:`He’s improving — the fever is gone. Discharge with ibuprofen for the aches`,s:0,go:'b',f:`Two errors: the end of the fever is the most dangerous time in dengue, and NSAIDs increase bleeding.`}]},
b:{x:`<p>Results: haematocrit 49% (it was 41% at his clinic visit two days ago), platelets 38 ×10⁹/L. Notice the narrow pulse pressure: 102/84.</p>`,
ch:[{x:`Plasma leakage with compensated shock: senior review, start IV crystalloid per the dengue protocol, monitor haematocrit, urine output and vitals closely`,s:2,go:'c',f:`Rising HCT + falling platelets + narrowing pulse pressure (≤20 mmHg) = leaking. Careful, monitored fluids.`},
{x:`Transfuse platelets because they are below 50`,s:0,go:'c',f:`Prophylactic platelet transfusion isn’t recommended in dengue without significant bleeding. The problem is leakage, not platelets.`}]},
c:{x:`<p>He is admitted to the medical ward with strict monitoring and recovers over three days.</p>`,mon:{hr:92,bp:'112/76'}}},
debrief:`A narrow pulse pressure (systolic minus diastolic ≤20 mmHg) is an early sign of dengue shock — the BP can look “normal”.`},
],
[
{t:'h',x:`Hajj, Umrah and the gateway city`},
{t:'p',x:`King Abdulaziz International Airport and Jeddah Islamic Port receive millions of pilgrims. Our ED sees the effects all year, and especially in Hajj season: crowds, heat, chronic illness away from home, and infections from every continent.`},
{t:'cards',i:[['Meningococcal disease','Fever + non-blanching petechial/purpuric rash, headache, neck stiffness, shock. <b>Ceftriaxone 2 g IV immediately</b>, droplet precautions, notify infection control. Close contacts need prophylaxis.'],['Heat stroke','Core temp >40 °C + confusion, seizures or coma. Elderly pilgrims (classic) and young labourers or runners (exertional). <b>Cool first</b>.'],['Imported malaria','Fever in someone who arrived from sub-Saharan Africa or South Asia in the past months. Blood film and rapid test — even if they feel “just like flu”.'],['Respiratory infections','Influenza, COVID-19 and bacterial pneumonia spread fast in crowds. Screen for MERS-CoV by the standard questions.'],['Language barriers','Indonesian, Urdu, Bengali, Turkish, Hausa, Persian… Use the hospital interpreter or phone line, not a fellow pilgrim, for anything important.'],['Chronic disease off routine','Diabetics with hypo- or hyperglycaemia, heart failure from salty food and walking, missed dialysis.']]},
{t:'mcq',q:`A 22-year-old Umrah pilgrim has fever, headache and a few dark-purple spots on his legs that don’t fade when you press a glass on them. BP 94/60. What first?`,o:[`Lumbar puncture, then antibiotics`,`CT head, then antibiotics`,`Ceftriaxone 2 g IV now, droplet precautions, call your senior`,`Paracetamol and observe`],a:2,e:`Suspected meningococcal sepsis kills within hours. Antibiotics first — cultures if quick, but never delay. LP comes later if safe.`},
],
[
{t:'h',x:`Heat stroke — cool first`},
{t:'table',head:['','Heat exhaustion','Heat stroke'],rows:[['Core temp','Usually <40 °C','<b>>40 °C</b>'],['Mental state','Normal (may feel faint)','<b>Confused, agitated, seizing, comatose</b>'],['Skin','Sweaty','Often hot and dry (but can be sweaty in exertional)'],['Treatment','Shade, fluids, rest','<b>Immediate rapid cooling</b>, ABCDE, ICU']]},
{t:'list',title:'Cooling',i:[`Best for exertional heat stroke: <b>cold-water or ice-water immersion</b>.`,`Otherwise: remove clothes, spray lukewarm water + strong fans (evaporative cooling), ice packs to the neck, armpits and groin.`,`Measure <b>core</b> (rectal) temperature. Stop active cooling at about 38.5–39 °C to avoid overshoot.`,`Paracetamol does not work for heat stroke.`,`Check glucose, electrolytes, CK (rhabdomyolysis), kidney and liver function, clotting (DIC).`]},
{t:'mcq',q:`A 30-year-old construction worker collapsed on a site at 14:00 in August. Temp 41.6 °C, GCS 10. What is the priority?`,o:[`CT head for the reduced GCS`,`Paracetamol 1 g IV`,`Immediate aggressive cooling while managing the airway`,`Start fluids and recheck the temperature in an hour`],a:2,e:`The longer the core temperature stays above 40 °C, the more organ damage. Cooling is the treatment — “cool first, transport second”.`},
]]});
