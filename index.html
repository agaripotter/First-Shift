<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="First Shift">
<title>First Shift — ER Intern Induction Program · Corniche Medical City</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  --ink:#0E1A2B;--ink2:#334155;--mute:#687386;--paper:#F4F1EA;--paper2:#ECE7DC;--card:#FFFFFF;--line:#E1DACB;--line2:#EEE8DC;
  --red:#D6293E;--red-soft:#FBE6E8;--teal:#0E7A6D;--teal-soft:#DFF1EC;--amber:#A86400;--amber-soft:#FBEFD6;--blue:#1E5BD8;--blue-soft:#E4ECFC;--violet:#5B3FD0;--violet-soft:#ECE8FD;
  --c1:#1E5BD8;--c2:#D6293E;--c3:#E2AC00;--c4:#1E9E5A;--c5:#E9E9E9;
  --r:16px;--shadow:0 1px 0 rgba(14,26,43,.04),0 10px 30px -16px rgba(14,26,43,.25);
  --fd:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --fb:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --fa:'IBM Plex Sans Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.62 var(--fb);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit}
b,strong{font-weight:650}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.ar{font-family:var(--fa);direction:rtl;text-align:right;unicode-bidi:isolate}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font:800 18px/1 var(--fd);letter-spacing:-.02em;background:none;border:0;padding:0}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--red);display:grid;place-items:center}
.brand i svg{width:16px;height:16px}
.top .sp{flex:1}
.pill{font:600 12px/1 var(--fb);padding:7px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600}

/* ---------- home ---------- */
.hero{position:relative;padding:34px 0 26px;overflow:hidden}
.hero .kick{font:600 12px/1.3 var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.hero h1{font:800 clamp(40px,10vw,64px)/.95 var(--fd);letter-spacing:-.035em;margin:10px 0 12px}
.hero h1 span{color:var(--red)}
.hero p.lead{font-size:17px;color:var(--ink2);max-width:560px;margin:0 0 6px}
.hero .ecg{display:block;width:100%;height:56px;margin:16px 0 4px}
.hero .ecg path{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.meta span{font:600 12.5px/1 var(--fb);padding:8px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.namecard{background:var(--ink);color:#fff;border-radius:var(--r);padding:18px;margin:22px 0 8px;display:grid;gap:12px}
.namecard label{font:600 12px/1 var(--fb);letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.namecard .row{display:flex;gap:10px;align-items:center}
.namecard .dr{font:700 20px var(--fd);opacity:.8}
.namecard input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:11px 12px;font-size:17px}
.namecard input::placeholder{color:rgba(255,255,255,.45)}
.overall{display:flex;align-items:center;gap:14px}
.bar{height:8px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .4s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font-weight:650;font-size:15.5px;background:var(--red);color:#fff;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--ink)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.wide{width:100%}
.part{margin:30px 0 10px;display:flex;flex-direction:column;gap:5px}
.part b{font:800 13px/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.part span{font-size:14px;color:var(--mute)}
.mods{display:grid;gap:10px}
.mod{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);transition:transform .15s}
.mod:active{transform:scale(.99)}
.mod .num{width:48px;height:48px;border-radius:12px;background:var(--paper);display:grid;place-items:center;font:800 19px var(--fd);color:var(--ink)}
.mod.done .num{background:var(--teal);color:#fff}
.mod.prog .num{background:var(--ink);color:#fff}
.mod.final{background:var(--ink);color:#fff;border-color:var(--ink)}
.mod.final .num{background:var(--red);color:#fff}
.mod.final .ms{color:rgba(255,255,255,.7)}
.mod h3{margin:0;font:700 17px/1.25 var(--fd);letter-spacing:-.01em}
.mod .ms{font-size:13.5px;color:var(--mute);margin-top:3px;line-height:1.4}
.mod .st{font:600 12px/1.2 var(--fb);text-align:right;color:var(--mute);white-space:nowrap}
.mod .st em{display:block;font-style:normal;font:700 15px var(--fm);color:var(--ink)}
.mod.final .st,.mod.final .st em{color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left}
.tile h4{margin:0 0 4px;font:700 16px var(--fd)}
.tile p{margin:0;font-size:13.5px;color:var(--mute);line-height:1.45}
.foot{font-size:12.5px;color:var(--mute);padding:20px 0 60px;border-top:1px solid var(--line);margin-top:20px;line-height:1.55}

/* ---------- module ---------- */
.mhead{padding:22px 0 6px}
.mhead .k{font:600 12px/1 var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.mhead h2{font:800 30px/1.08 var(--fd);letter-spacing:-.025em;margin:8px 0 0}
.steps{display:flex;gap:4px;margin:16px 0 4px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--ink)}
.steps i.cur{background:var(--red)}
.scr{padding:10px 0 130px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(244,241,234,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.navbar .wrap{display:flex;gap:10px;align-items:center}
.navbar .hint{flex:1;font-size:13px;color:var(--mute);line-height:1.3}
.navbar .btn{padding:12px 16px}

.blk{margin:16px 0}
.scr h3.h{font:800 24px/1.15 var(--fd);letter-spacing:-.02em;margin:22px 0 4px}
.scr h4.h{font:700 18px/1.25 var(--fd);margin:22px 0 2px}
.scr p{margin:0}
.scr .p p+p{margin-top:10px}
.scr ul.l,.scr ol.l{margin:0;padding-left:22px}
.scr ul.l li,.scr ol.l li{margin:6px 0}
.scr ul.l li::marker{color:var(--red)}

.mentor{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 14px var(--fd);letter-spacing:.02em}
.av.n{background:var(--teal)}
.av.s{background:var(--violet)}
.bub{background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 14px;box-shadow:var(--shadow)}
.bub .who{font:700 12px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}

.say{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;border-right:4px solid var(--amber)}
.say .who{font:700 12px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.say .ar{font-size:18.5px;line-height:1.75;font-weight:500}
.say .en{font-size:14px;color:var(--mute);margin-top:6px;font-style:italic;border-top:1px dashed var(--line);padding-top:6px}

.call{border-radius:14px;padding:14px 16px;border:1px solid}
.call .ct{font:700 12.5px/1 var(--fb);letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.call .ct:before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.call.rule{background:var(--blue-soft);border-color:#C9D7F7}.call.rule .ct{color:var(--blue)}
.call.pearl{background:var(--teal-soft);border-color:#BFE3D9}.call.pearl .ct{color:var(--teal)}
.call.danger{background:var(--red-soft);border-color:#F3C3C9}.call.danger .ct{color:var(--red)}
.call.saudi{background:var(--amber-soft);border-color:#F0D9A8}.call.saudi .ct{color:var(--amber)}
.call.local{background:var(--violet-soft);border-color:#D6CCFA}.call.local .ct{color:var(--violet)}
.call ul{margin:6px 0 0;padding-left:20px}.call li{margin:4px 0}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:440px}
.tbl th{text-align:left;font:700 12px/1.2 var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);background:var(--paper);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.45}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:600}

.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.num{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.num b{display:block;font:800 28px/1 var(--fd);letter-spacing:-.02em;color:var(--red)}
.num span{display:block;font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.35}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.flip{position:relative;min-height:128px;border:0;padding:0;background:none;text-align:left;perspective:900px}
.flip .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .bk{position:absolute;inset:0;border-radius:14px;padding:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);overflow:auto}
.flip .f{background:var(--card);font:700 16.5px/1.3 var(--fd)}
.flip .f small{font:500 11.5px var(--fb);color:var(--mute);margin-top:8px;letter-spacing:.06em;text-transform:uppercase}
.flip .bk{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:14px;line-height:1.45}

.reveal{border:1px dashed var(--ink2);border-radius:14px;background:transparent;width:100%;text-align:left;padding:14px 16px}
.reveal .rq{font-weight:650;display:flex;justify-content:space-between;gap:10px}
.reveal .rq:after{content:"Tap to reveal";font:600 11.5px var(--fb);color:var(--red);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.reveal.on{border-style:solid;background:var(--card)}
.reveal.on .rq:after{content:""}
.reveal .ra{display:none;margin-top:10px;color:var(--ink2);font-size:15px}
.reveal.on .ra{display:block}

/* questions */
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.q-tag{display:inline-block;font:700 11px/1 var(--fb);letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--ink);padding:5px 8px;border-radius:6px;margin-bottom:10px}
.q-q{font:650 17px/1.4 var(--fb);margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;background:var(--paper);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;font-size:15px;line-height:1.4;transition:background .15s,border-color .15s}
.opt .ol{width:28px;height:28px;border-radius:8px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font:700 13px var(--fm)}
.opt.sel{border-color:var(--ink);background:#fff}
.opt.sel .ol{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.right{background:var(--teal-soft);border-color:var(--teal)}
.opt.right .ol{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.opt.wrong .ol{background:var(--red);color:#fff;border-color:var(--red)}
.opt.miss{border-color:var(--teal);border-style:dashed}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.fb.ok{background:var(--teal-soft)}.fb.no{background:var(--amber-soft)}
.fb b.v{display:block;font:700 13px var(--fb);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.fb.ok b.v{color:var(--teal)}.fb.no b.v{color:var(--amber)}
.qact{margin-top:12px;display:flex;gap:8px}
.qact .btn{padding:10px 16px;font-size:14.5px}

.ord-seq,.ord-pool{display:grid;gap:7px}
.ord-seq{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;margin-bottom:10px}
.ord-seq:empty:before{content:"Tap the steps below in the right order";color:var(--mute);font-size:14px;padding:6px}
.ord-it{display:flex;gap:10px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.35}
.ord-it .on{font:700 13px var(--fm);min-width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center}
.ord-it.ok{background:var(--teal-soft);border-color:var(--teal)}
.ord-it.bad{background:var(--red-soft);border-color:var(--red)}

.srt-row{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;background:var(--paper)}
.srt-row .sx{font-size:14.5px;line-height:1.4;margin-bottom:8px}
.srt-row .sb{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 11px;font:650 13px/1.1 var(--fb);display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.chip.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.srt-row.ok{background:var(--teal-soft);border-color:#9fd3c6}
.srt-row.bad{background:var(--red-soft);border-color:#efb3ba}
.srt-row .why{font-size:13.5px;color:var(--ink2);margin-top:8px;line-height:1.45}
.ctas{display:inline-grid;place-items:center;min-width:26px;height:22px;border-radius:6px;font:700 12px var(--fm);padding:0 6px;color:#fff}
.ctas.c1{background:var(--c1)}.ctas.c2{background:var(--c2)}.ctas.c3{background:var(--c3);color:#2a2100}.ctas.c4{background:var(--c4)}.ctas.c5{background:#fff;color:#111;border:1px solid #bbb}

/* case */
.case{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.case-h{padding:14px 16px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;gap:10px;align-items:center}
.case-h b{font:700 16px/1.25 var(--fd)}
.case-h span{font:600 11.5px/1.2 var(--fb);letter-spacing:.08em;text-transform:uppercase;opacity:.7;white-space:nowrap}
.mon{background:#04080D;color:#fff;padding:10px 12px 12px;font-family:var(--fm)}
.mon .trace{height:46px;overflow:hidden;position:relative;border-bottom:1px solid #12202c;margin-bottom:8px}
.mon .trace svg{position:absolute;left:0;top:0;height:46px;width:200%;animation:sweep 4s linear infinite}
@keyframes sweep{to{transform:translateX(-50%)}}
.mon .vit{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px 10px}
.mon .v{line-height:1}
.mon .v small{display:block;font:600 10px var(--fb);letter-spacing:.1em;opacity:.7;margin-bottom:3px}
.mon .v b{font:700 21px var(--fm)}
.mon .v.hr{color:#3BE37A}.mon .v.sp{color:#3CCBF4}.mon .v.bp{color:#FF7373}.mon .v.rr{color:#FFD54A}.mon .v.t{color:#E8E8E8}.mon .v.g{color:#C9A6FF}.mon .v.gcs{color:#FFFFFF}
.mon .v.chg b{animation:blink 1s 2}
@keyframes blink{50%{opacity:.25}}
.case-b{padding:6px 16px 16px}
.node{padding:12px 0;border-bottom:1px dashed var(--line)}
.node:last-child{border-bottom:0}
.node .nx{font-size:15.5px}
.node .nx p+p{margin-top:8px}
.node.past .nx{color:var(--ink2);font-size:14.5px}
.picked{margin-top:10px;display:flex;gap:8px;align-items:flex-start;font-size:14.5px;font-weight:600}
.picked:before{content:"→";color:var(--red);font-weight:800}
.score-chip{font:700 11px/1 var(--fm);padding:4px 6px;border-radius:5px;margin-left:auto;white-space:nowrap}
.score-chip.s2{background:var(--teal);color:#fff}.score-chip.s1{background:var(--amber);color:#fff}.score-chip.s0{background:var(--red);color:#fff}
.chs{display:grid;gap:8px;margin-top:12px}
.ch{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;line-height:1.4}
.ch:hover{border-color:var(--ink)}
.outcome{margin-top:10px;background:var(--paper);border-radius:14px;padding:14px}
.outcome .os{font:800 26px var(--fd);color:var(--ink)}
.outcome .os small{font:600 13px var(--fb);color:var(--mute);margin-left:6px}
.case .say{margin-top:10px}

.strip{background:#FFF7F4;border:1px solid #F2D5CC;border-radius:12px;padding:8px 8px 6px;background-image:linear-gradient(#f7d9d0 1px,transparent 1px),linear-gradient(90deg,#f7d9d0 1px,transparent 1px);background-size:12px 12px}
.strip svg{display:block;width:100%;height:90px}
.strip .sl{font:600 11.5px var(--fm);color:#8a4a3a;margin-top:2px}
.node .strip{margin-top:10px}

/* tools */
.tool{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.tool .tt{font:800 18px var(--fd);margin-bottom:2px}
.tool .ts{font-size:13.5px;color:var(--mute);margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.seg button{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.25;text-align:left}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg button b{font-family:var(--fm);margin-right:4px}
.lbl{font:700 12px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.fld{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:8px 0 12px}
.fld label{display:grid;gap:4px;font:600 12.5px var(--fb);color:var(--ink2)}
.fld input,.fld select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);font-size:16px}
.out{background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px}
.out .big{font:800 34px/1 var(--fd)}
.out .big small{font:600 14px var(--fb);opacity:.7;margin-left:6px}

<script>window.MODULES=window.MODULES||[];
const CT=[{l:'CTAS 1',c:'#1E5BD8'},{l:'CTAS 2',c:'#D6293E'},{l:'CTAS 3',c:'#E2AC00'},{l:'CTAS 4',c:'#1E9E5A'},{l:'CTAS 5',c:'#FFFFFF'}];

/* ================= MODULE 1 ================= */
MODULES.push({id:'m01',n:1,part:'Part A · Arrive',partSub:'Know the place before you touch a patient',title:'Welcome to the ED',sub:'What the ER really is, the map, the team, and what you can and cannot do as an intern',mins:20,
take:[
`The ED does not ask “what is the diagnosis?” first. It asks <b>“what could kill this patient in the next hour?”</b>`,
`Interns are not licensed by SCFHS. Every order, discharge, report and certificate goes through a licensed doctor. Know your limits and say them out loud.`,
`Take the next patient on the board by acuity and time. <b>Never cherry-pick.</b>`,
`The charge nurse runs the floor. Make them your ally on day one.`,
`If you are worried, your senior wants to know — now, not at handover.`],
s:[
[
{t:'mentor',x:`<p>Welcome to the Emergency Department, {DR}. I’m Hanan — I run the intern program here at Corniche Medical City. I have trained interns for twelve years, and every group asks me the same thing on day one: <i>“What will you actually expect from me?”</i></p><p style="margin-top:8px">This program is my answer. Over the next few hours I’ll show you the floor, the rules that protect you and your patients, and the cases that will walk through our doors this month. You will make decisions, some will be wrong, and that is exactly the point — better here than in Resus at 3 a.m.</p>`},
{t:'nums',i:[['≈ 300','patients a day through our ED'],['12 h','shift length — days and nights'],['4–8 wk','your ER rotation'],['24/7','senior EM cover on the floor']]},
{t:'call',k:'local',x:`Corniche Medical City (CMC) is a fictional 600-bed tertiary hospital in Jeddah used for this program. Where you see <b>CMC policy</b>, check what your own hospital does — the principle stays the same, the details may not.`},
],
[
{t:'h',x:`What the ER actually is`},
{t:'p',x:`On the wards, a patient arrives with a diagnosis and a plan. In the ED, they arrive with a <b>complaint</b> — “chest pain”, “dizzy”, “my son is not himself” — and nobody has thought about them yet. You are the first.`},
{t:'p',x:`That changes how you think. Emergency medicine runs on three questions, in this order:`},
{t:'list',o:1,i:[`<b>Is this patient sick or not sick?</b> (decided in seconds, from the doorway)`,`<b>What is the worst thing this could be</b> — and have I ruled it out?`,`<b>Where does this patient go next?</b> Admit, observe, or home safely — this is called <i>disposition</i>.`]},
{t:'p',x:`Notice what is missing: “What is the exact diagnosis?” Often you won’t know. That is acceptable. Sending home a missed heart attack is not.`},
{t:'cards',i:[
[`Myth: The ER is a fast clinic.`,`Reality: It is a risk-sorting machine. Speed matters only after safety. A slow, safe intern is worth more than a fast, careless one.`],
[`Myth: Interns just do cannulas and paperwork.`,`Reality: You will clerk, examine, present, plan and reassess real patients. Your history is often the one the whole team relies on.`],
[`Myth: If the tests are normal, the patient is fine.`,`Reality: Normal tests in a patient who looks unwell mean you haven’t found it yet. Treat the patient, not the paper.`],
[`Myth: Asking for help looks weak.`,`Reality: Interns who never call are the ones who worry us. Calling early is a skill we grade you on.`]]},
],
[
{t:'h',x:`The map of the department`},
{t:'p',x:`Learn the zones on your first shift. Patients are placed by how sick they are, not by what they have.`},
{t:'tool',name:'edmap'},
{t:'sort',q:`Where does each patient belong?`,bins:[{l:'Resus'},{l:'Acute'},{l:'Urgent care'},{l:'Isolation'}],i:[
{x:`67-year-old, unresponsive after collapsing at home, BP 70/40`,b:0,w:`Shocked and unresponsive = Resus, whatever the cause.`},
{x:`31-year-old nurse from another hospital, fever and cough for 4 days. A patient on her ward was confirmed with MERS last week.`,b:3,w:`Fever + cough + contact with a confirmed MERS case (and healthcare work) meets the MERS-CoV screening definition. Isolate first, then assess.`},
{x:`22-year-old with a sprained ankle, walking with a limp`,b:2,w:`Stable, walking, single minor injury — Urgent care.`},
{x:`55-year-old diabetic with abdominal pain and vomiting, vitals stable`,b:1,w:`Needs a bed, bloods and observation. Not unstable, but not minor either.`},
{x:`35-year-old with a 3 cm forearm laceration, bleeding controlled`,b:2,w:`Minor procedure — Urgent care.`},
{x:`40-year-old, chest pain and sweating, HR 110`,b:0,w:`Possible ACS with tachycardia and diaphoresis. Resus or a monitored acute bed with immediate ECG — at CMC, Resus.`}]},
],
[
{t:'h',x:`The team — who is who`},
{t:'table',head:['Role','What they do','Call them when'],rows:[
['Attending consultant','Final responsibility for every patient on shift','Your senior escalates; you join the conversation'],
['Senior registrar / resident','Runs the floor with the consultant; your direct supervisor','<b>Any time you are worried.</b> Before every discharge. Every abnormal ECG.'],
['Charge nurse','Runs the beds, the staff, the flow','Bed allocation, a nurse for a procedure, a patient who disappeared'],
['Bedside / triage nurses','Vitals, meds, monitoring — they see the patient more than you do','Listen when a nurse says “I’m worried about bed 7”'],
['Respiratory therapist (RT)','Oxygen, NIV, ventilators, ABGs in many hospitals','Patient on BiPAP, intubation setup'],
['Clinical pharmacist','Doses, interactions, antidotes, infusions','Any infusion, any paediatric dose, any doubt'],
['Patient relations','Complaints, requests, family conflict','A family wants to complain or escalate'],
['Social worker','Abuse, homelessness, no family, unsafe discharge','Suspected abuse; elderly patient with nobody at home'],
['Security','Safety of staff and patients','Aggression, threats, a patient trying to leave while confused']]},
{t:'mentor',x:`<p>A secret every senior knows: our nurses have seen ten thousand patients. When Maricel, our charge nurse, says a patient “doesn’t look right”, I walk over. So should you.</p>`},
{t:'say',who:'Maricel · Charge nurse (to you, on day one)',ar:`{دكتور، أهلاً فيك|دكتورة، أهلاً فيكي}. أي مريض {تحس|تحسّي} إنه مو مزبوط، {قول|قولي} لي على طول. {لا تستنى|لا تستنّي}.`,en:`Doctor, welcome. Any patient you feel isn’t right, tell me straight away. Don’t wait.`},
{t:'sort',q:`Who do you call first?`,bins:[{l:'My senior'},{l:'Charge nurse'},{l:'Pharmacist'},{l:'Social worker'},{l:'Security'}],i:[
{x:`Your patient’s new ECG shows ST elevation in II, III, aVF`,b:0,w:`STEMI. Senior immediately — this is a cath lab activation.`},
{x:`You need a nurse to stay with a confused patient while you do a procedure in another bed`,b:1,w:`Staffing and beds belong to the charge nurse.`},
{x:`You are unsure of the gentamicin dose for a 48 kg patient with a creatinine of 160`,b:2,w:`Renally adjusted doses — pharmacist (and your senior signs the order).`},
{x:`A 78-year-old woman is medically fit to go home but says nobody is at home to look after her`,b:3,w:`Unsafe discharge — social work, with your senior aware.`},
{x:`A relative is shouting and has pushed a nurse`,b:4,w:`Staff safety first. Step back, call security, then your senior.`}]},
],
[
{t:'h',x:`Your role as an intern`},
{t:'p',x:`In Saudi Arabia, an intern has finished medical school but is <b>not yet licensed by the Saudi Commission for Health Specialties (SCFHS)</b>. You work under supervision. That is not a formality — it decides what you may sign.`},
{t:'table',head:['You CAN (under supervision)','You CANNOT do alone'],rows:[
['Take histories, examine, present, suggest a plan','Discharge a patient'],
['Write notes and suggest orders for countersignature','Sign a death certificate or pronounce death alone'],
['Do basic procedures you are signed off for: cannula, bloods, ABG, ECG, catheter, simple suturing','Issue sick leave or a medical report'],
['Talk to patients and families about the plan your senior agreed','Break bad news or discuss DNR / code status'],
['Do CPR, bag-mask ventilate, help in Resus','Take consent as the doctor performing a procedure'],
['Call consultations when your senior asks you to','Prescribe controlled drugs (opioids, benzodiazepines) alone']]},
{t:'call',k:'rule',title:'The golden rule',x:`If you are about to do something you have never done, or never done here — stop and ask. “I haven’t done this before, can you supervise me?” is a sentence I want to hear every day.`},
{t:'multi',q:`Which of these can an intern do <b>without</b> a senior countersigning or being present?`,o:[`Take a history and examine a CTAS 3 patient`,`Discharge a patient with a sprained ankle`,`Do a 12-lead ECG and show it to the senior`,`Write a sick leave for a patient who asks`,`Start chest compressions on a patient in arrest`,`Tell a family their father has died`],a:[0,2,4],e:`Assessing, getting ECGs and starting CPR are your job. Discharges, sick leave and breaking news of a death need a licensed doctor — you may be beside them, and that is how you learn.`},
],
[
{t:'h',x:`A 12-hour shift, hour by hour`},
{t:'list',i:[
`<b>06:45 — Arrive early.</b> Change, find your senior, check the board.`,
`<b>07:00 — Handover.</b> The night team hands over every patient still in the department. Write it down.`,
`<b>07:30 — Board round.</b> Senior assigns or you pick patients. Highest acuity and longest waiting first.`,
`<b>All shift — the cycle:</b> see → present → plan → order → <b>reassess</b> → disposition. Then the next patient.`,
`<b>Breaks.</b> Eat, drink, pray. Tell your senior and the charge nurse before you go. Never leave a sick patient mid-plan.`,
`<b>18:30 — Prepare handover.</b> Results chased, plans written, nothing “pending” without a name next to it.`,
`<b>19:00 — Hand over</b> in person, at the board. Then go home.`]},
{t:'order',q:`Put your workflow for one new patient in the right order.`,i:[`Look at the triage note and vitals`,`See and examine the patient`,`Present to your senior with a plan`,`Write the orders for countersignature`,`Reassess after treatment and results`,`Agree disposition with your senior`],e:`The step interns skip most is <b>reassess</b>. A patient who got morphine and fluids is a different patient 40 minutes later.`},
{t:'mcq',q:`The board has four waiting patients. Which do you pick up first?`,o:[`A CTAS 4 ankle injury — quick, you can clear it in 10 minutes`,`A CTAS 3 abdominal pain waiting 50 minutes`,`A CTAS 3 headache waiting 20 minutes`,`A CTAS 5 prescription refill waiting 2 hours`],a:1,e:`Pick by <b>acuity first, then waiting time</b>. Choosing the quick ones (“cherry-picking”) leaves sick patients waiting and is the fastest way to lose your senior’s trust.`},
],
[
{t:'case',title:'Your first hour',pt:'Day 1 · 07:40',nomon:1,start:'a',n:{
a:{x:`<p>You have just finished handover. As you walk to the board, a man in his forties stops you in the corridor. He looks exhausted and angry.</p>`,say:{who:'Relative in the corridor',ar:`يا {دكتور|دكتورة} الله {يخليك|يخليكي}، أبويا له ساعتين قاعد هنا وما في أحد شافه! إيش الحكاية؟`,en:`Doctor, please — my father has been sitting here for two hours and nobody has seen him! What is going on?`},
ch:[{x:`Tell him the ER is busy and he has to wait like everyone else`,s:0,go:'b',f:`True, but it shuts him down and you learned nothing about his father, who may be getting worse.`},
{x:`Introduce yourself, ask his father’s name and what he came in with, and say you will check where he is on the list`,s:2,go:'c',f:`Name, empathy, action. Most anger in the ED is fear plus waiting. A two-minute conversation prevents a complaint.`},
{x:`Take the father straight into a bed and see him now`,s:0,go:'b',f:`You just skipped every patient triaged as sicker. Triage protects the sickest — including from you.`}]},
b:{x:`<p>The son raises his voice. Maricel looks over. You take a breath and start again: you introduce yourself and ask about his father.</p>`,ch:[{x:`Continue`,s:1,go:'c',f:`Recovering is fine. Next time, lead with the name and the question.`}]},
c:{x:`<p>His father is 71, diabetic, triaged CTAS 3 for “weakness since yesterday”. The triage vitals two hours ago were normal. You look over at him in the waiting area: he is pale and leaning against the wall.</p>`,
ch:[{x:`Ask the triage nurse to repeat his vitals now and tell her he looks worse`,s:2,go:'d',f:`Exactly. Triage is a snapshot. When a waiting patient looks different, re-triage.`},
{x:`Reassure the son that CTAS 3 means he is stable`,s:0,go:'d',f:`CTAS was right two hours ago. “Weakness” in an elderly diabetic can be sepsis, hypoglycaemia, a silent MI or a stroke.`}]},
d:{x:`<p>Repeat vitals: HR 118, BP 92/58, glucose 3.1 mmol/L (56 mg/dL). He is moved to Acute and you tell your senior. He is treated within minutes.</p><p>The son comes to find you later and says <i>“{الله يجزاك خير يا دكتور|الله يجزاكي خير يا دكتورة}”</i> — may God reward you.</p>`}},
debrief:`Two lessons from your first hour: <b>treat anger as information</b>, and <b>the waiting room is part of your department</b>. Patients deteriorate there.`},
]]});
