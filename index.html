MODULES.push({id:'m09',n:9,part:'Part D · Core presentations',title:'Neuro emergencies',sub:'Stroke codes, seizures, the confused patient, dangerous headaches, syncope and the GCS',mins:20,
take:[
`Stroke: <b>time last known well</b> is the most important fact. Check glucose, activate the stroke code, CT within minutes. Thrombolysis up to 4.5 h; thrombectomy for large-vessel occlusion in selected patients up to 24 h.`,
`A seizure lasting ≥5 minutes is status epilepticus: benzodiazepine now, repeat once, then a second-line drug by 20 minutes.`,
`In every confused or unconscious patient: <b>glucose first</b>.`,
`Sudden “worst ever” headache, fever with neck stiffness, a focal deficit, pregnancy, anticoagulation, age >50 with a new headache → investigate.`,
`Report GCS as E–V–M. GCS ≤8 = the airway is at risk.`],
s:[
[
{t:'mentor',x:`<p>In a stroke, about 1.9 million neurons die every minute. Your job is not to read the CT. It is to get an accurate <b>time of onset</b>, a glucose, and the patient through the scanner door fast.</p>`},
{t:'h',x:`Recognise it: BE-FAST`},
{t:'table',head:['','Look for'],rows:[['<b>B</b>alance','Sudden loss of balance or coordination'],['<b>E</b>yes','Sudden loss of vision or double vision'],['<b>F</b>ace','Facial droop — ask them to smile'],['<b>A</b>rm','Arm drift — arms out, eyes closed'],['<b>S</b>peech','Slurred, wrong words, can’t understand'],['<b>T</b>ime','When were they last known to be normal? Call the code.']]},
{t:'nums',i:[['≤ 60 min','door-to-needle for thrombolysis'],['4.5 h','thrombolysis window from last known well'],['185/110','BP must be below this before thrombolysis'],['24 h','thrombectomy window in selected patients']]},
{t:'tool',name:'stroke'},
{t:'call',k:'pearl',title:'Last known well ≠ when they were found',x:`If he went to sleep at midnight and woke at 06:00 with weakness, his last known well is <b>midnight</b>. Ask the family exact questions: “When did you last see him completely normal?”`},
],
[
{t:'case',title:'“His mouth turned”',pt:'Triage · 14:10',mon:{hr:84,bp:'196/108',sp:'97%',rr:16,t:'36.8',gcs:15},start:'a',n:{
a:{x:`<p>A 66-year-old man is brought by his wife. He has slurred speech and a weak right arm.</p>`,say:{who:'His wife',ar:`كنا نتغدى الساعة وحدة، وفجأة فمه مال وكلامه صار ثقيل، وما قدر يمسك الملعقة بيده اليمين.`,en:`We were having lunch at one o’clock, and suddenly his mouth drooped, his speech became heavy, and he couldn’t hold the spoon in his right hand.`},
ch:[{x:`Last known well 13:00. Check glucose, call the stroke code, straight to CT`,s:2,go:'b',f:`One hour and ten minutes since onset — well within the window. Glucose takes 30 seconds and rules out the most common mimic.`},
{x:`Admit under medicine for an MRI tomorrow`,s:0,go:'b',f:`An MRI tomorrow means the window is gone. This is an emergency.`}]},
b:{x:`<p>Glucose 7.8 mmol/L (140 mg/dL). CT head shows no bleeding. The neurologist is on the way. His BP is still 196/108.</p>`,
ch:[{x:`Tell your senior: BP must be below 185/110 before thrombolysis — IV labetalol per protocol`,s:2,go:'c',f:`Correct. Lower it carefully to just under the threshold. If it can’t be controlled, thrombolysis can’t be given.`},
{x:`Give sublingual nifedipine to drop it quickly`,s:0,go:'c',f:`Sudden large drops in BP can extend the stroke. Use titratable IV drugs per protocol.`},
{x:`Leave the BP — it’s protective in stroke`,s:1,go:'c',f:`True for patients <b>not</b> getting thrombolysis (we usually tolerate up to 220/120). This one may get it.`}]},
c:{x:`<p>After labetalol, BP 176/98. The neurologist confirms an ischaemic stroke and gives thrombolysis at 14:48. CT angiography shows a left middle cerebral artery occlusion and he goes for thrombectomy.</p>`,mon:{bp:'176/98'}}},
debrief:`Door-to-needle: 38 minutes. That only happened because the wife was asked an exact question and the glucose was checked at triage.`},
{t:'order',q:`Put the stroke code steps in order.`,i:[`Recognise BE-FAST signs and establish last known well`,`Check capillary glucose`,`Activate the stroke code`,`Non-contrast CT head (± CT angiography)`,`Neurology decision on thrombolysis / thrombectomy`],e:`Glucose comes before the code because hypoglycaemia can look exactly like a stroke.`},
],
[
{t:'h',x:`Seizures and status epilepticus`},
{t:'p',x:`Most seizures stop on their own within 2–3 minutes. Your first job is safety: lay them on their side, protect the head, nothing in the mouth, oxygen, <b>check glucose</b>, time it.`},
{t:'table',head:['Time','Action (adult)'],rows:[['0–5 min','ABC, oxygen, glucose, IV access, time the seizure'],['5 min — status','<b>Benzodiazepine</b>: IV lorazepam 4 mg (0.1 mg/kg), or IM midazolam 10 mg, or buccal midazolam 10 mg'],['10 min','Repeat the benzodiazepine <b>once</b>'],['20 min','<b>Second-line</b>: levetiracetam 60 mg/kg (max 4.5 g) or valproate 40 mg/kg (max 3 g) or fosphenytoin — per CMC protocol'],['40 min+','Refractory: anaesthesia, intubation, ICU']]},
{t:'call',k:'danger',x:`A pregnant woman (or up to 6 weeks after delivery) who seizes has <b>eclampsia</b> until proven otherwise: <b>magnesium sulphate</b> is the drug, and obstetrics must be called immediately.`},
{t:'mcq',q:`A 34-year-old has been seizing for 6 minutes. No IV access yet. Glucose 5.4 mmol/L. What next?`,o:[`Wait for IV access, then lorazepam`,`IM or buccal midazolam 10 mg now`,`Phenytoin IV`,`Put a tongue depressor in her mouth`],a:1,e:`Don’t lose minutes hunting for a vein. IM midazolam works as well as IV lorazepam.`},
],
[
{t:'h',x:`The confused or unconscious patient`},
{t:'list',i:[`<b>Glucose</b> — always, first.`,`Oxygen and airway — GCS ≤8 means the airway is at risk.`,`<b>Naloxone</b> if opioid toxicity is possible (small pupils, slow breathing).`,`<b>Thiamine</b> in malnourished patients or those with alcohol use — but never delay glucose for it.`,`Then the causes: infection (sepsis, meningitis), stroke/bleed, seizure, toxins, metabolic (Na, Ca, uraemia, liver), hypoxia/CO₂, temperature (heat stroke).`]},
{t:'tool',name:'gcs'},
{t:'mcq',q:`A man opens his eyes to pain, makes groaning sounds, and withdraws his hand from a painful stimulus. GCS?`,o:[`E2 V2 M4 = 8`,`E2 V3 M5 = 10`,`E1 V2 M4 = 7`,`E3 V2 M4 = 9`],a:0,e:`Eyes to pain = 2, sounds only = 2, withdraws = 4. Total 8 — the airway is at risk. Call your senior.`},
],
[
{t:'h',x:`Headache and syncope — the red flags`},
{t:'table',head:['Headache red flag','Think of'],rows:[['Sudden, maximal within a minute (“thunderclap”)','Subarachnoid haemorrhage'],['Fever, neck stiffness, rash','Meningitis'],['New focal deficit, seizure, confusion','Bleed, tumour, abscess, venous thrombosis'],['New headache over 50, jaw pain, scalp tenderness','Giant cell arteritis'],['Pregnancy or postpartum','Pre-eclampsia, venous sinus thrombosis'],['On anticoagulants, or after trauma','Intracranial bleeding'],['Several people at home with headache, winter, heater','Carbon monoxide']]},
{t:'table',head:['High-risk syncope','Why'],rows:[['Fainting during exertion','Aortic stenosis, HCM, arrhythmia'],['Palpitations before it, or no warning at all','Arrhythmia'],['Family history of sudden death under 40','Inherited channelopathy'],['Abnormal ECG (long QT, Brugada, heart block, WPW)','Arrhythmia'],['Chest pain, breathlessness, or shock','MI, PE, dissection, GI bleed, ectopic']]},
{t:'mcq',q:`A 17-year-old footballer collapsed during a match at a Jeddah academy and recovered in a minute. His uncle died suddenly at 35. ECG shows a QTc of 520 ms. What now?`,o:[`Reassure — it was a simple faint from the heat`,`High-risk syncope: monitor, tell your senior, cardiology review, no sport until cleared`,`Discharge with advice to drink more water`,`Order an EEG`],a:1,e:`Exertional syncope + family history of sudden death + long QT. This is a potentially fatal arrhythmia syndrome.`},
]]});

MODULES.push({id:'m10',n:10,part:'Part D · Core presentations',title:'Trauma',sub:'The primary survey, road traffic accidents, bleeding, chest injuries, head and C-spine rules, and burns',mins:25,
take:[
`<b>&lt;C&gt;ABCDE</b>: catastrophic bleeding first, then airway with C-spine protection, breathing, circulation, disability, exposure.`,
`Look for bleeding in five places: on the floor, chest, abdomen, pelvis, long bones.`,
`Tranexamic acid within 3 hours of injury in significant bleeding: 1 g over 10 min, then 1 g over 8 h.`,
`Head injury on anticoagulants → CT. Use the Canadian CT head and C-spine rules.`,
`Burns: cool running water for 20 minutes, cover with cling film, count only partial- and full-thickness burns, think of the airway.`],
s:[
[
{t:'mentor',x:`<p>Road traffic accidents are a leading cause of death among young people in Saudi Arabia. On a Thursday night you will see several. The trauma team leader is your senior — your job is to do your part of the primary survey well and to <b>say out loud what you find</b>.</p>`},
{t:'h',x:`The primary survey`},
{t:'table',head:['','Find','Fix'],rows:[
['<b>&lt;C&gt;</b> Catastrophic haemorrhage','Spurting, pooling blood from a limb or junction','Direct pressure, tourniquet, wound packing'],
['<b>A</b> Airway + C-spine','Talking? Obstruction, facial trauma, burns','Jaw thrust (not head tilt), suction, collar/manual stabilisation'],
['<b>B</b> Breathing','RR, SpO₂, chest movement, breath sounds, trachea','Oxygen; decompress tension pneumothorax; seal open wounds'],
['<b>C</b> Circulation','HR, BP, cap refill, FAST, pelvis','Two large-bore IVs, bloods + crossmatch, blood not saline, pelvic binder'],
['<b>D</b> Disability','GCS, pupils, glucose, limb movement','Prevent hypoxia and hypotension (they worsen brain injury)'],
['<b>E</b> Exposure','Full undress, log roll, the back, perineum','Keep warm — hypothermia worsens bleeding']]},
{t:'call',k:'idea',x:`The order is simply <b>what kills fastest</b>. Someone can bleed to death from a leg artery in about 3 minutes, die from a blocked airway in about 4, and from failed breathing soon after. Fix the fastest killer first, then move down the list.`},
{t:'order',q:`A motorcyclist arrives with a spurting thigh wound, gurgling breathing and a GCS of 9. Order your priorities.`,i:[`Tourniquet on the thigh`,`Jaw thrust and suction with C-spine control`,`Oxygen and check breath sounds`,`IV access, bloods, blood products`,`Check GCS and pupils`,`Expose fully and log roll`],e:`&lt;C&gt; first — someone can die from limb bleeding in 3 minutes.`},
],
[
{t:'h',x:`Haemorrhagic shock`},
{t:'tool',name:'bleed'},
{t:'call',k:'danger',x:`By the time a young trauma patient’s BP falls, they have lost <b>30–40%</b> of their blood volume. Tachycardia and anxiety come first. A normal BP does not mean “stable”.`},
{t:'list',i:[`Give <b>blood</b>, not litres of saline. Activate the <b>massive transfusion protocol</b> early (balanced red cells : plasma : platelets).`,`<b>Tranexamic acid</b> within 3 hours: 1 g IV over 10 min, then 1 g over 8 h.`,`Permissive hypotension (systolic ~80–90) until bleeding is controlled — <b>but not</b> in head injury, where we keep the BP higher.`,`The answer to haemorrhage is to stop the bleeding: theatre, interventional radiology, pelvic binder.`]},
{t:'mcq',q:`A 28-year-old after an RTA: HR 132, BP 86/58, confused, FAST positive in the right upper quadrant. Best plan?`,o:[`2 L of saline and repeat FAST in an hour`,`CT abdomen to define the injury`,`Blood products (massive transfusion), TXA, and straight to theatre with the surgeons`,`Wait for the haemoglobin result`],a:2,e:`An unstable patient with a positive FAST goes to theatre, not to the CT scanner. The haemoglobin can be normal early in bleeding.`},
],
[
{t:'case',title:'Rollover on Madinah Road',pt:'Resus · Thursday 23:50',mon:{hr:128,bp:'92/60',sp:'90%',rr:30,gcs:14},start:'a',n:{
a:{x:`<p>Red Crescent brings a 23-year-old driver, unrestrained, car rolled at high speed. He is collared, on a board. Your senior leads. You are assigned to <b>Breathing</b>.</p>`,
ch:[{x:`Expose the chest, look, feel, listen: RR, chest movement, trachea, breath sounds on both sides, percussion`,s:2,go:'b',f:`Systematic. Say what you find out loud to the team leader.`},
{x:`Order a chest X-ray and wait`,s:0,go:'b',f:`Clinical examination first. Life-threatening chest injuries are diagnosed at the bedside.`}]},
b:{x:`<p>Right side: reduced movement, absent breath sounds, hyper-resonant. Trachea deviated to the left. Neck veins distended. BP falling.</p>`,mon:{bp:'78/50',sp:'86%'},
ch:[{x:`Call out “tension pneumothorax, right” — your senior decompresses immediately (4th/5th intercostal space, mid-axillary line), then a chest drain`,s:2,go:'c',f:`Tension pneumothorax is a clinical diagnosis. Don’t wait for imaging.`},
{x:`Increase the oxygen and wait for the X-ray`,s:0,go:'c',f:`This patient will arrest before the X-ray is developed.`}]},
c:{x:`<p>There is a rush of air on decompression. SpO₂ rises. But HR is still 130 and BP 88/56. FAST: free fluid around the spleen. The pelvis is stable.</p>`,mon:{hr:130,bp:'88/56',sp:'95%',rr:24},
ch:[{x:`Suggest massive transfusion protocol, TXA 1 g, warm products, and call general surgery for theatre`,s:2,go:'d',f:`Ongoing haemorrhage from the spleen. Blood, TXA, and surgical control.`},
{x:`Suggest 3 litres of normal saline first`,s:0,go:'d',f:`Large volumes of saline dilute clotting factors, cause acidosis and worsen bleeding.`}]},
d:{x:`<p>He goes to theatre for a splenectomy. Afterwards, the police office calls asking for “the doctor who treated him” to give details.</p>`,mon:{hr:110,bp:'104/68'},
ch:[{x:`Refer them to your senior and the medical reports process; make sure your notes are complete and timed`,s:2,go:'e',f:`RTAs are medico-legal. You document facts; the licensed doctor provides official reports.`},
{x:`Tell the police officer he smelled of alcohol`,s:0,go:'e',f:`Not your role, not through the corridor, and not without a documented clinical finding. Write facts in the notes.`}]},
e:{x:`<p>He survives. Your senior asks you to present the case at morning teaching.</p>`}},
debrief:`Primary survey roles: when you are given a letter (A, B, C…), own it completely and report out loud. The team leader needs your findings, not your silence.`},
],
[
{t:'h',x:`Head and C-spine — who needs imaging?`},
{t:'cards',i:[['Canadian CT head rule — high risk','GCS <15 at 2 h after injury · suspected open/depressed skull fracture · signs of base-of-skull fracture (panda eyes, Battle’s sign, CSF leak, haemotympanum) · vomiting ≥2 times · age ≥65'],['Canadian CT head rule — medium risk','Amnesia for events ≥30 min before impact · dangerous mechanism (pedestrian hit, ejected, fall >1 m or 5 stairs)'],['Anticoagulants','Any head injury on warfarin, a DOAC or antiplatelets with any symptoms → CT. Many protocols scan all of them.'],['Canadian C-spine rule','High risk (age ≥65, dangerous mechanism, limb paraesthesia) → image. If low-risk features allow it and they can rotate the neck 45° left and right → no imaging needed.'],['NEXUS — image unless all absent','Midline tenderness · focal neuro deficit · reduced alertness · intoxication · painful distracting injury']]},
{t:'mcq',q:`A 72-year-old on apixaban slipped in the bathroom, hit her head, GCS 15, no vomiting. Best plan?`,o:[`Discharge — GCS 15`,`CT head`,`Observe for 1 hour then discharge`,`Skull X-ray`],a:1,e:`Age ≥65 and anticoagulation: both point to CT.`},
],
[
{t:'h',x:`Burns`},
{t:'list',i:[`<b>First aid</b>: cool running water for 20 minutes (useful up to 3 hours after the burn). No ice. Then cover with cling film.`,`<b>Airway</b>: burns to the face, singed nasal hair, soot in the mouth, hoarse voice or stridor → senior and anaesthesia early. Airways swell fast.`,`Think <b>carbon monoxide</b> in enclosed-space fires.`,`<b>Circumferential</b> burns of the chest or limbs may need escharotomy.`,`Burns that don’t fit the story — especially in children — need a safeguarding review.`]},
{t:'tool',name:'burns'},
{t:'mcq',q:`A 70 kg man has partial-thickness burns to his whole back and both arms. Using 2 mL/kg/%TBSA, how much fluid in the first 8 hours?`,o:[`1,008 mL`,`2,520 mL`,`5,040 mL`,`10,080 mL`],a:1,e:`Back 18% + arms 9% + 9% = 36%. 2 × 70 × 36 = 5,040 mL in 24 h; half — <b>2,520 mL</b> — in the first 8 h from the time of the burn. Then titrate to urine output.`},
]]});

MODULES.push({id:'m11',n:11,part:'Part D · Core presentations',title:'Abdomen, pregnancy & the groin',sub:'Abdominal pain at the extremes of age, ectopic pregnancy, pre-eclampsia, GI bleeding, torsion and renal colic',mins:20,
take:[
`Every woman of reproductive age with abdominal pain, bleeding or collapse gets a <b>pregnancy test</b>. No exceptions for “she says she can’t be pregnant”.`,
`Elderly + abdominal pain = high risk: ruptured AAA, mesenteric ischaemia, perforation, MI.`,
`Pain out of proportion to the examination → think mesenteric ischaemia.`,
`Testicular torsion is a 6-hour emergency: urology now, don’t wait for an ultrasound.`,
`Pregnant after 20 weeks with BP ≥140/90 and headache, visual symptoms or RUQ pain = pre-eclampsia. Seizure = eclampsia → magnesium.`],
s:[
[
{t:'mentor',x:`<p>Abdominal pain is one of the most common reasons people come to our ED. Most go home with gastritis, constipation or a urine infection. Your job is to find the few who would die if you sent them home.</p>`},
{t:'h',x:`The can’t-miss list depends on who is in front of you`},
{t:'sort',q:`Match each patient to the diagnosis you must rule out first.`,bins:[{l:'Ruptured AAA'},{l:'Ectopic pregnancy'},{l:'Mesenteric ischaemia'},{l:'Inferior MI'},{l:'Testicular torsion'}],i:[
{x:`71-year-old male smoker, sudden back and flank pain, BP 90/60, “renal colic”`,b:0,w:`“First-ever renal colic” in an older man is an AAA until proven otherwise. Bedside ultrasound of the aorta.`},
{x:`24-year-old woman, left iliac fossa pain, light-headed, last period 7 weeks ago`,b:1},
{x:`78-year-old with atrial fibrillation, severe pain but a soft, barely tender abdomen`,b:2,w:`Pain out of proportion to the examination + AF = embolus to the gut. Lactate may be normal early.`},
{x:`62-year-old diabetic, epigastric pain and vomiting, HR 52`,b:3},
{x:`14-year-old boy, sudden left lower abdominal pain and vomiting`,b:4,w:`Teenage boys with abdominal pain: always examine the testes. They are often too embarrassed to mention them.`}]},
{t:'call',k:'saudi',title:'Chaperones and modesty',x:`Abdominal, breast, genital and rectal examinations need a chaperone — a female nurse for female patients. Explain what you will do before you do it, expose only what you need, and offer a female doctor if one is available <b>and it won’t delay emergency care</b>.`},
],
[
{t:'case',title:'Pain, dizziness and a late period',pt:'Acute · 09:20',mon:{hr:112,bp:'100/66',sp:'99%',rr:20,t:'36.7'},start:'a',n:{
a:{x:`<p>A 27-year-old married woman, triaged CTAS 3 for lower abdominal pain. Her husband is with her.</p>`,say:{who:'Patient',ar:`تحت بطني يوجعني من الصبح، خصوصًا الجهة اليسار، وحاسة بدوخة. الدورة متأخرة شوية، بس عادي هي دايمًا تتأخر.`,en:`My lower belly has been hurting since the morning, especially on the left, and I feel dizzy. My period is a little late, but that’s normal — it’s always late.`},
ch:[{x:`Urine or serum β-hCG now, two IV cannulas, bloods including group and crossmatch, tell your senior`,s:2,go:'b',f:`Pain + dizziness + late period + tachycardia = ectopic until proven otherwise.`},
{x:`Treat as a urine infection and wait for the urine culture`,s:0,go:'b',f:`“It’s always late” is not a pregnancy test.`}]},
b:{x:`<p>The pregnancy test is positive. While you are writing, the nurse calls: the patient fainted on the way to the bathroom.</p>`,mon:{hr:132,bp:'78/48'},
ch:[{x:`To Resus: senior now, bedside FAST, O-negative or crossmatched blood, call gynaecology for theatre`,s:2,go:'c',f:`Haemodynamically unstable ectopic = surgical emergency. Gynaecology to the bedside; she goes to theatre.`},
{x:`Book a formal pelvic ultrasound for the morning list`,s:0,go:'c',f:`She is bleeding into her abdomen now.`}]},
c:{x:`<p>FAST shows free fluid. Gynaecology takes her to theatre for a ruptured left tubal ectopic. Her husband is shaken.</p>`,say:{who:'Her husband',ar:`يا {دكتور|دكتورة} هي بخير؟ ما كنا ندري إنها حامل أصلاً.`,en:`Doctor, is she okay? We didn’t even know she was pregnant.`},
ch:[{x:`Tell him briefly what is happening and that the gynaecology team will update him after surgery; ask your senior to speak to him`,s:2,go:'d',f:`Honest, brief, and you bring in the person who can answer the hard questions.`},
{x:`Explain all the details of ectopic pregnancy and future fertility`,s:1,go:'d',f:`Kind intention, but that conversation belongs to the gynaecology team, and to her first.`}]},
d:{x:`<p>She recovers well. Her blood group is Rh-negative, so the team gives anti-D.</p>`}},
debrief:`Check Rh status in every woman with bleeding in pregnancy — Rh-negative mothers need anti-D to protect future pregnancies.`},
],
[
{t:'h',x:`Pregnancy in the ED`},
{t:'table',head:['Situation','What to do'],rows:[
['Bleeding in early pregnancy','β-hCG, Hb, blood group/Rh, ultrasound. Stable → early pregnancy service. Unstable → Resus.'],
['Pre-eclampsia (>20 weeks, up to 6 weeks postpartum)','BP ≥140/90 with protein in urine or symptoms. Severe: ≥160/110, headache, visual disturbance, RUQ pain. Call obstetrics; antihypertensive (e.g. labetalol) per protocol.'],
['Eclampsia','Magnesium sulphate 4 g IV over 5–15 min, then 1 g/h. Obstetrics now. Monitor reflexes, breathing, urine output.'],
['Trauma or arrest after ~20 weeks','Manual left displacement of the uterus (or left tilt) to relieve pressure on the IVC. Obstetrics to the bedside immediately.'],
['Imaging','Never withhold a necessary scan because of pregnancy. Discuss with your senior and radiology.']]},
{t:'mcq',q:`A woman 10 days after delivery has a severe headache and BP 168/112. What should you think about?`,o:[`Postnatal tension headache`,`Postpartum pre-eclampsia`,`Migraine — she has a history`,`Caffeine withdrawal`],a:1,e:`Pre-eclampsia can appear up to 6 weeks after delivery. Venous sinus thrombosis is the other big one in the postpartum period.`},
],
[
{t:'h',x:`GI bleeding, torsion and renal colic`},
{t:'cards',i:[['Upper GI bleed','Haematemesis or melaena. Two large IVs, Hb, crossmatch, urea. Transfuse if Hb <70 g/L (80 if cardiac disease). PPI after endoscopy decision. Suspected varices (liver disease): terlipressin + IV antibiotics. Glasgow-Blatchford score 0–1 may go home with follow-up.'],['Testicular torsion','Sudden severe testicular pain, high-riding testis, absent cremasteric reflex, vomiting. Salvage drops sharply after 6 hours. <b>Urology to the bedside — don’t delay for ultrasound.</b>'],['Renal colic','Loin-to-groin colicky pain, restless patient, haematuria. NSAID first-line for pain (if kidneys OK). CT KUB. Fever + stone = infected obstructed kidney → urology emergency.'],['Appendicitis','Pain starting around the umbilicus and moving to the right iliac fossa, anorexia, fever, tenderness. Atypical in pregnancy, the elderly and children.']]},
{t:'mcq',q:`A 16-year-old boy has had sudden severe right testicular pain for 2 hours and is vomiting. The ultrasound department says they can scan him in 3 hours. What do you do?`,o:[`Wait for the ultrasound`,`Give analgesia and reassess in the morning`,`Urgent urology review now — surgical exploration shouldn’t wait for imaging`,`Treat as epididymitis with antibiotics`],a:2,e:`Clinical suspicion of torsion = surgical exploration. Every hour of delay costs testicular viability.`},
]]});

/* ================= MODULE 12 ================= */
MODULES.push({id:'m12',n:12,part:'Part D · Core presentations',title:'Children in the ED',sub:'The paediatric assessment triangle, normal vitals, weight and doses, the febrile infant, breathing problems and safeguarding',mins:20,
take:[
`Start with the <b>Paediatric Assessment Triangle</b>: appearance, work of breathing, circulation to the skin.`,
`Know normal vitals by age. A tachycardic, quiet child is sicker than a crying one.`,
`Weigh the child, or estimate with APLS formulas. Every dose is checked by two people.`,
`Fever in an infant under 3 months is serious; under 28 days → full septic workup and IV antibiotics.`,
`Injuries that don’t match the story or the child’s development → safeguarding, with your senior.`],
s:[
[
{t:'mentor',x:`<p>Children compensate brilliantly — until they don’t. A child can keep a normal blood pressure while losing a quarter of their blood volume, then crash in minutes. Learn what “sick” looks like in a child.</p>`},
{t:'h',x:`The Paediatric Assessment Triangle`},
{t:'table',head:['Side','Look for (from the door, without touching)'],rows:[['<b>Appearance</b> (TICLS)','Tone, Interactiveness, Consolability, Look/gaze, Speech/cry'],['<b>Work of breathing</b>','Recessions, nasal flaring, head bobbing, grunting, stridor, wheeze, tripod position'],['<b>Circulation to skin</b>','Pallor, mottling, cyanosis']]},
{t:'call',k:'pearl',x:`A child who is <b>quiet, floppy and not interested</b> in you, their parent, or a phone is far more worrying than one who screams when you approach. Abnormal appearance = sick, whatever the vitals say.`},
{t:'call',k:'idea',x:`Children are like a stretched spring. They hold their blood pressure and keep going until the spring snaps — and then they crash fast. Watch for the early signs (a fast heart rate, quietness, mottled skin) instead of waiting for a low BP.`},
{t:'mcq',q:`A 2-year-old with fever lies still on his mother’s lap, doesn’t look at you, doesn’t cry when you examine him, and his legs are mottled. What does the triangle tell you?`,o:[`He’s tired from the fever — give paracetamol and reassess`,`Abnormal appearance and circulation — he is sick: possible septic shock. Resus and senior now.`,`He is calm, which is reassuring`,`Only work of breathing matters in children`],a:1,e:`Poor interaction + mottled skin = compensated (or decompensating) shock. Treat now.`},
],
[
{t:'h',x:`Weight, doses and normal vitals`},
{t:'p',x:`Weight decides nearly every paediatric drug and fluid. Measure it whenever you can. In an emergency, estimate it (APLS: under 1 year (0.5 × months) + 4; 1–5 years (2 × age) + 8; 6–12 years (3 × age) + 7) or use a length-based tape.`},
{t:'tool',name:'peds'},
{t:'mcq',q:`Using the helper above: roughly what is the estimated weight of a 4-year-old, and the fluid bolus?`,o:[`12 kg, 240 mL`,`16 kg, 160 mL`,`20 kg, 400 mL`,`24 kg, 240 mL`],a:1,e:`(2 × 4) + 8 = 16 kg. Bolus 10 mL/kg = 160 mL, then reassess. Adult habits (“give a litre”) can drown a child.`},
],
[
{t:'case',title:'Six weeks old and hot',pt:'Paeds ED · 03:15',mon:{hr:178,bp:'—',sp:'97%',rr:52,t:'38.4'},start:'a',n:{
a:{x:`<p>A mother brings her 6-week-old daughter, born at term, no previous illness.</p>`,say:{who:'Mother',ar:`بنتي عمرها شهر ونص، من الليل وهي سخنة وما ترضع زي العادة، ونايمة كثير.`,en:`My daughter is a month and a half old. Since the night she’s been hot, she isn’t feeding like usual, and she’s sleeping a lot.`},
ch:[{x:`This is a febrile infant under 3 months with poor feeding and lethargy — senior now, septic workup and IV antibiotics`,s:2,go:'b',f:`Fever + poor feeding + sleepiness in a young infant = serious bacterial infection until proven otherwise.`},
{x:`Give paracetamol and discharge with advice — probably a virus`,s:0,go:'b',f:`Young infants can’t localise infection. Meningitis and urinary sepsis look like this.`}]},
b:{x:`<p>Your senior agrees. The workup includes blood culture, CBC, CRP/procalcitonin, urine by catheter or suprapubic aspiration, and a lumbar puncture.</p>`,
ch:[{x:`Antibiotics after cultures, without delaying them for the LP if it will take time`,s:2,go:'c',f:`Correct. A lethargic infant gets antibiotics promptly; the LP can follow.`},
{x:`Wait for all results before giving antibiotics`,s:0,go:'c',f:`Time matters in neonatal sepsis and meningitis.`}]},
c:{x:`<p>The urine shows nitrites and leukocytes; the CSF is clear. She is admitted to paediatrics on IV antibiotics for a urinary tract infection and does well.</p>`,mon:{hr:150,t:'37.6'}}},
debrief:`A febrile infant under 28 days always gets the full workup and IV antibiotics. From 29 to 90 days, your senior and the paediatric team use a risk-stratification pathway.`},
],
[
{t:'h',x:`Breathing problems in children`},
{t:'table',head:['','Clues','Treatment'],rows:[['Croup (6 months–6 years)','Barking cough, hoarse voice, stridor, often at night','Keep calm on parent’s lap. Dexamethasone 0.15 mg/kg oral. Severe (stridor at rest, recessions): nebulised adrenaline + senior.'],['Bronchiolitis (under 2)','Runny nose then cough, crackles ± wheeze, feeding poorly','Supportive: suction, feeds, oxygen if SpO₂ low. Bronchodilators and steroids usually don’t help.'],['Asthma (over 2)','Wheeze, known triggers, response to salbutamol','Salbutamol (spacer or nebuliser), steroids; escalate as in adults.'],['Foreign body','Sudden choking or coughing while eating or playing','Partial: let them cough, call senior/ENT. Complete obstruction: back blows and chest/abdominal thrusts.'],['Epiglottitis (rare now)','Toxic, drooling, sitting forward, quiet stridor','<b>Do not examine the throat</b> or upset the child. Senior, anaesthesia and ENT immediately.']]},
{t:'mcq',q:`An 18-month-old has a barking cough and stridor only when crying. He is playing between coughs. What is the best treatment?`,o:[`Nebulised salbutamol`,`Oral dexamethasone`,`IV antibiotics`,`Intubation`],a:1,e:`Mild–moderate croup: a single dose of oral dexamethasone. Salbutamol doesn’t work on the upper airway.`},
],
[
{t:'h',x:`Safeguarding children`},
{t:'list',i:[`<b>“Those who don’t cruise rarely bruise”</b> — bruises in a baby who isn’t yet moving around are a red flag.`,`<b>TEN-4</b>: bruising on the <b>T</b>orso, <b>E</b>ars or <b>N</b>eck in a child under <b>4</b>, or any bruise in a baby under 4 months.`,`Fractures in infants, especially ribs, metaphyseal and skull fractures.`,`Scalds with sharp lines or a “glove and stocking” pattern (immersion).`,`A delay in seeking care, or a story that changes or doesn’t match the child’s development.`]},
{t:'call',k:'saudi',x:`CMC has a <b>Child Protection team</b> linked to the National Family Safety Program. Your role: treat, document exactly, tell your senior, and the team does the rest. You don’t accuse anyone, and you don’t promise the child to keep a secret.`},
{t:'mcq',q:`A 3-month-old has a swollen thigh. The father says he “rolled off the sofa”. X-ray shows a femur fracture. What next?`,o:[`Cast and discharge — it fits a fall`,`Tell your senior; this needs safeguarding review and a skeletal survey per the Child Protection pathway`,`Ask the father directly if he hurt the baby`,`Call the police yourself from the bedside`],a:1,e:`Three-month-olds don’t usually roll, and a femur fracture needs significant force. Escalate through the pathway.`},
]]});

/* ================= MODULE 13 ================= */
MODULES.push({id:'m13',n:13,part:'Part D · Core presentations',title:'Poisons, bites, the sea & sugar',sub:'Overdose, organophosphates, scorpions and snakes, Red Sea injuries, drowning, carbon monoxide, DKA, hypoglycaemia and high potassium',mins:25,
take:[
`Every poisoned patient: ABCDE, glucose, ECG, time of ingestion. Every intentional overdose: paracetamol and salicylate levels, a safe observed space, and psychiatric assessment before discharge.`,
`Organophosphates: protect yourself, decontaminate, then <b>atropine</b> — doubling doses until the chest is dry.`,
`Snakebite: immobilise, no tourniquet or cutting, 20-minute whole blood clotting test, antivenom for systemic envenomation.`,
`Stonefish or stingray sting: hot water (as hot as tolerated, ~40–45 °C) for 30–90 minutes.`,
`DKA: fluids first, fixed-rate insulin 0.1 units/kg/h, <b>check potassium before insulin</b>, add dextrose when glucose falls below 14 mmol/L.`],
s:[
[
{t:'mentor',x:`<p>Toxicology scares interns because there are thousands of toxins. Relax: the first hour is almost always the same — support the ABCs, check the glucose and ECG, find out what, how much and when, and call the poison centre. The antidotes are a short list.</p>`},
{t:'list',title:'The poisoned patient — first steps',i:[`ABCDE and <b>glucose</b>`,`12-lead ECG: QRS width (tricyclics, sodium-channel blockers), QTc, heart block`,`What, how much, when, and was anything else taken? Ask for the packets.`,`<b>Paracetamol and salicylate levels</b> in every intentional overdose — paracetamol is silent for the first day.`,`Call the regional poison control centre for advice — your senior knows the number.`,`Never leave a patient with an intentional overdose alone, and never discharge without a psychiatric assessment.`]},
{t:'sort',q:`Match the poison to its antidote or key treatment.`,bins:[{l:'N-acetylcysteine'},{l:'Naloxone'},{l:'Atropine'},{l:'100% oxygen'},{l:'Sodium bicarbonate'},{l:'Flumazenil — rarely'}],i:[
{x:`Paracetamol`,b:0},
{x:`Opioids (heroin, tramadol, morphine)`,b:1,w:`Small pupils + slow breathing + drowsiness. Titrate to breathing, not full alertness.`},
{x:`Organophosphate pesticides`,b:2},
{x:`Carbon monoxide`,b:3},
{x:`Tricyclic antidepressants with a wide QRS`,b:4},
{x:`Benzodiazepines`,b:5,w:`Usually just supportive care. Flumazenil can trigger seizures, especially in mixed overdoses or chronic users.`}]},
{t:'call',k:'pearl',title:'Paracetamol',x:`Take a level <b>4 hours</b> after ingestion (or on arrival if later) and plot it on the CMC nomogram. Start N-acetylcysteine without waiting if: the time of ingestion is unknown, the overdose was staggered over hours, the patient presents more than 8 hours after, or they are already jaundiced.`},
],
[
{t:'h',x:`Organophosphates — farms around Jeddah`},
{t:'p',x:`Pesticide exposure is seen in agricultural workers in the farms around Jeddah and the wider Makkah region. Organophosphates block acetylcholinesterase, flooding the body with acetylcholine.`},
{t:'table',head:['Muscarinic (“wet”)','Nicotinic','CNS'],rows:[['Salivation, lacrimation, urination, diarrhoea, vomiting, <b>bronchorrhoea</b>, bronchospasm, bradycardia, small pupils','Muscle twitching, weakness, paralysis (including breathing muscles), tachycardia','Confusion, seizures, coma']]},
{t:'case',title:'The farm worker',pt:'Resus · 11:30',mon:{hr:48,bp:'96/60',sp:'86%',rr:28,t:'36.9'},start:'a',n:{
a:{x:`<p>A 30-year-old farm worker is brought in by his co-worker after spraying crops. He is drooling, sweating, has vomited and his clothes are wet. The co-worker speaks a little Arabic.</p>`,say:{who:'Co-worker',ar:`هو يرش دوا في المزرعة... بعدين طاح... ريحة قوية`,en:`He was spraying medicine on the farm… then he fell… a strong smell`},
ch:[{x:`PPE on, remove his clothes into a sealed bag, wash his skin, and tell your senior — then ABC`,s:2,go:'b',f:`Staff can be poisoned by contaminated clothes and vomit. Decontamination is part of the resuscitation.`},
{x:`Start examining him straight away with gloves only`,s:1,go:'b',f:`Gloves alone aren’t enough with heavily contaminated clothing. Protect the team, then treat.`}]},
b:{x:`<p>His chest is full of crackles and wheeze, pupils pinpoint, HR 48. Your senior asks what you want to give.</p>`,
ch:[{x:`Atropine 1–2 mg IV, doubling the dose every 5 minutes until the chest is clear, HR >80 and systolic BP >80`,s:2,go:'c',f:`Correct. Some patients need tens of milligrams. The target is a dry chest — not the pupil size.`},
{x:`Furosemide for the “pulmonary oedema”`,s:0,go:'c',f:`The fluid is bronchial secretions from muscarinic excess. Atropine dries them.`},
{x:`A single 0.5 mg dose of atropine and observe`,s:0,go:'c',f:`Far too little. Doses are escalated quickly.`}]},
c:{x:`<p>After 2, 4, then 8 mg his chest clears, HR 92, SpO₂ 94%. Pralidoxime is started per protocol. Your senior asks about intubating if he tires.</p>`,mon:{hr:92,bp:'110/70',sp:'94%',rr:20},
ch:[{x:`Mention that suxamethonium should be avoided — its effect can be greatly prolonged in organophosphate poisoning`,s:2,go:'d',f:`Exactly — a rocuronium-based RSI is preferred.`},
{x:`No difference — any RSI drug is fine`,s:0,go:'d',f:`Suxamethonium is broken down by cholinesterases, which are blocked. Paralysis can last hours.`}]},
d:{x:`<p>He is admitted to the ICU and recovers over several days. Because it was a workplace exposure, your senior informs the police office as a medico-legal case.</p>`}},
debrief:`Use a proper interpreter for the history as soon as he can talk — the co-worker can’t tell you the product name or how much exposure there was.`},
],
[
{t:'h',x:`Scorpions, snakes and the Red Sea`},
{t:'cards',i:[['Scorpion sting','Very common in Saudi Arabia. Most adults: severe local pain → analgesia, local anaesthetic infiltration, observe. Systemic signs (sweating, vomiting, agitation, hypertension, breathing difficulty, abnormal movements) — especially in <b>children</b> → senior, scorpion antivenom per protocol, monitored bed.'],['Snakebite','Saudi vipers (e.g. <i>Echis</i>, <i>Cerastes</i>) cause swelling and bleeding disorders. Immobilise, remove rings, mark the swelling edge with time. <b>20-minute whole blood clotting test</b>: if the blood doesn’t clot → coagulopathy → antivenom. No tourniquet, no cutting, no suction, no ice.'],['Stonefish / stingray','Excruciating pain, puncture wound after stepping on something in the sea. <b>Hot water immersion</b> (as hot as tolerated, ~40–45 °C — test with your own hand) for 30–90 min, analgesia, X-ray for spine fragments, tetanus, wound care.'],['Jellyfish','Rinse with <b>sea water</b> (fresh water can trigger more stings), remove tentacles with tweezers, analgesia. Vinegar for box-jellyfish-type stings.'],['Drowning (Obhur, the Corniche)','The problem is hypoxia. Oxygen, ABCDE, watch for delayed breathing problems over 6–8 hours. C-spine precautions only if diving injury or trauma is suspected.'],['Carbon monoxide','Headache, nausea, confusion — often several family members, generators or charcoal heaters in an enclosed space. <b>Pulse oximetry is falsely normal.</b> 100% oxygen via non-rebreather; COHb on a blood gas.']]},
{t:'mcq',q:`A child was stung by a scorpion an hour ago at home. He is now sweating, vomiting, restless and has BP 150/100. What is the right step?`,o:[`Ice on the sting site and discharge`,`Systemic envenomation: senior, antivenom per protocol, monitored bed`,`Antibiotics`,`Observe for 24 hours without treatment`],a:1,e:`Children are at highest risk from scorpion envenomation. Systemic signs need antivenom and close monitoring for cardiac and respiratory complications.`},
],
[
{t:'h',x:`Sugar, ketones and potassium`},
{t:'table',head:['','Recognise','Treat (adult — follow CMC protocol)'],rows:[
['DKA','Glucose >11 mmol/L (200 mg/dL) or known diabetic, ketones ≥3 mmol/L, pH <7.3 or HCO₃⁻ <15. Abdominal pain, vomiting, Kussmaul breathing','1 L 0.9% saline over 1 h, then by protocol · Check K⁺ <b>before</b> insulin · Fixed-rate IV insulin 0.1 units/kg/h · Add K⁺ to fluids if 3.5–5.5 · If K⁺ <3.3–3.5: replace first, senior · Add 10% dextrose when glucose <14 mmol/L (250 mg/dL) · Find the trigger'],
['Hypoglycaemia','Glucose <4 mmol/L (70 mg/dL); sweating, confusion, seizures, “stroke”','Awake: 15–20 g fast-acting sugar by mouth · Not safe to swallow: 10% dextrose 150–200 mL IV (or glucagon 1 mg IM) · Then a meal. Sulfonylurea overdose → admit (it recurs).'],
['Hyperkalaemia','K⁺ ≥6.5 or any ECG changes: peaked T, wide QRS, loss of P waves, sine wave','<b>Calcium gluconate 10% 30 mL IV</b> over 5–10 min (protects the heart, repeat if needed) · Insulin 10 units + 25 g glucose IV · Salbutamol 10–20 mg nebulised · Then remove K⁺: dialysis, binders']]},
{t:'call',k:'idea',x:`Insulin is the key that opens the cell door. Sugar goes in — and potassium goes in with it. Useful when potassium is dangerously high; dangerous when it is already low.`},
{t:'tool',name:'potassium'},
{t:'call',k:'saudi',title:'Ramadan',x:`During Ramadan, expect more hypoglycaemia in fasting diabetics before iftar, DKA in type 1 patients who reduced or stopped insulin, and dehydration and renal colic in the summer. The ED often peaks after iftar and taraweeh. Many patients will ask whether a treatment breaks their fast: answer simply, and remember that Islam excuses the sick from fasting.`},
{t:'mcq',q:`A 21-year-old with type 1 diabetes in DKA has a potassium of 3.0 mmol/L. When do you start the insulin infusion?`,o:[`Immediately — insulin is the most important treatment`,`After potassium replacement has brought K⁺ above about 3.3–3.5, with your senior`,`Never — use oral hypoglycaemics instead`,`Only after the pH is normal`],a:1,e:`Insulin drives potassium into cells. Starting it with a low K⁺ can cause fatal arrhythmias. Fluids and potassium first.`},
]]});

/* ================= MODULE 14 ================= */
MODULES.push({id:'m14',n:14,part:'Part E · People & you',partSub:'The skills that decide how your patients — and you — experience the ED',title:'Communication, mistakes & looking after yourself',sub:'Bad news with Saudi families, interpreters, angry relatives, consulting specialists, errors, burnout and getting the most from the rotation',mins:20,
take:[
`Bad news is given by your senior, in a private room, with the patient’s wishes about family respected. You can be there and learn.`,
`Ask the competent patient how much they want to know and who should be involved — before the family decides for them.`,
`Professional interpreters for anything important. Never children, and avoid fellow patients.`,
`Consults: be specific — “I am calling to ask you to see…, because…, and I need…”.`,
`Mistakes happen to everyone. Tell your senior immediately, file the incident report, learn. Hiding a mistake is the real failure.`],
s:[
[
{t:'mentor',x:`<p>Patients rarely complain about the medicine. They complain that nobody explained, nobody introduced themselves, nobody said sorry for the wait. Communication is the part of the job your patients will remember.</p>`},
{t:'h',x:`Breaking bad news — SPIKES`},
{t:'table',head:['','Step'],rows:[['<b>S</b>etting','Private room, sit down, phone on silent, tissues, the right people present'],['<b>P</b>erception','“What have you been told so far?”'],['<b>I</b>nvitation','“How much detail would you like me to go into?”'],['<b>K</b>nowledge','Warn first (“I’m afraid I have difficult news”), plain words, no jargon, pause'],['<b>E</b>motion','Silence is fine. Name the feeling. “إن شاء الله خير” is not a plan — but faith is a comfort for many families; respect it.'],['<b>S</b>trategy','What happens next, who they will see, when']]},
{t:'call',k:'saudi',title:'“Please don’t tell my mother”',x:`Families in Saudi Arabia sometimes ask doctors to keep a serious diagnosis from the patient, out of love. The competent patient has the right to know, but they also have the right to <b>choose not to know</b> or to let family lead. Ask the patient, privately and gently: <i>“بعض الناس يحبون يعرفون كل التفاصيل، وبعضهم يفضّلون إن العائلة تتكلم مع الدكتور. إنتي إيش تفضّلي؟”</i> — “Some people like to know every detail, others prefer the family to talk to the doctor. What would you prefer?” This is a senior-led conversation.`},
{t:'mcq',q:`A 60-year-old man’s CT shows a likely pancreatic cancer. His sons stop you in the corridor: “Don’t tell him anything, he won’t cope.” What do you do?`,o:[`Agree and tell the patient it is gastritis`,`Tell the patient everything immediately because it is his right`,`Acknowledge their concern, say you understand they want to protect him, and tell your senior, who will find out how the patient himself wants to receive information`,`Tell the sons the full results instead of the patient`],a:2,e:`Lying to the patient is not acceptable, and neither is forcing information on him. The patient’s own preference decides — and a senior leads that conversation.`},
],
[
{t:'h',x:`Interpreters`},
{t:'p',x:`Jeddah is one of the most multilingual cities in the region: residents from South and Southeast Asia, Africa and the wider Arab world, plus pilgrims all year. Use the hospital interpreter service or telephone line for history, consent, bad news and discharge advice.`},
{t:'list',i:[`Speak to the patient, not the interpreter. Short sentences.`,`<b>Never use children</b> as interpreters, and avoid other patients or a sponsor/employer for sensitive topics.`,`Ask the patient to repeat back the plan.`,`Write in the notes that an interpreter was used, and which language.`]},
{t:'mcq',q:`A Filipino domestic worker has abdominal pain. Her employer, who brought her, offers to translate and says “she’s fine, just give her something.” What is best?`,o:[`Let the employer translate — it’s quicker`,`Use a professional interpreter (many of our nurses speak Tagalog, or the phone service) and see her privately for part of the consultation`,`Discharge with painkillers`,`Speak to her in English only, loudly`],a:1,e:`Employers may not translate accurately and may affect what she feels safe saying — about pregnancy, injury or abuse. Give her a private, interpreted conversation.`},
],
[
{t:'case',title:'The angry son',pt:'Acute · 01:30',nomon:1,start:'a',n:{
a:{x:`<p>A son storms up to the nurses’ station. His father, 80, has been on a trolley for five hours waiting for a medical bed.</p>`,say:{who:'The son',ar:`إيش هذا المستشفى؟! أبويا له خمس ساعات على السرير هذا ولا أحد عطانا خبر! أنا بشتكي عليكم كلكم!`,en:`What kind of hospital is this?! My father has been on this bed for five hours and nobody has told us anything! I’m going to complain about all of you!`},
ch:[{x:`Tell him to lower his voice or you will call security`,s:0,go:'b',f:`Threats escalate. Security is for danger, not frustration.`},
{x:`Stay calm, step aside with him, introduce yourself, and let him finish without interrupting`,s:2,go:'c',f:`Listen first. Angry people need to feel heard before they can hear you.`},
{x:`Explain that the bed shortage is the ward’s fault, not the ED’s`,s:0,go:'b',f:`Blaming colleagues makes the hospital look worse and doesn’t help his father.`}]},
b:{x:`<p>He gets louder. Other families are watching.</p>`,ch:[{x:`Change approach: lower your own voice, move him somewhere quieter, and listen`,s:1,go:'c',f:`Good recovery.`}]},
c:{x:`<p>He finishes. He is mainly scared: his father hasn’t eaten, and nobody explained why he is still here.</p>`,
ch:[{x:`Acknowledge, apologise for the wait and lack of updates, explain the plan honestly, and fix one concrete thing now`,s:2,go:'d',f:`“أعتذر عن التأخير، ومعك حق إنه ولا أحد شرح لكم.” Then: check if his father can eat, check his pressure areas, give a realistic time.`},
{x:`Promise a bed within 30 minutes`,s:0,go:'d',f:`Don’t promise what you don’t control. Broken promises make it worse.`}]},
d:{x:`<p>You find that his father is allowed to eat, and the nurse brings a meal tray. You tell the son the admitting team will update him. He shakes your hand.</p>`,say:{who:'The son',ar:`{مشكور يا دكتور|مشكورة يا دكتورة}، والله ما كنت أبغى أرفع صوتي، بس خفت عليه.`,en:`Thank you, doctor. Honestly I didn’t want to raise my voice, I was just scared for him.`}}},
debrief:`Listen → acknowledge → apologise for the experience → explain → act on one thing. And if anyone becomes threatening or physical: step back and call security.`},
],
[
{t:'h',x:`Calling a consultation`},
{t:'p',x:`Specialists are busy too. A clear request gets a faster, kinder answer.`},
{t:'call',k:'pearl',title:'A good consult call',x:`“Hello, I’m {DR}, ER intern, calling on behalf of Dr. Fahad. I’d like you to <b>see a patient for possible admission</b>: a 68-year-old with a new upper GI bleed — melaena, Hb 72 down from 120, HR 108. He’s had 2 units, a PPI, and his Glasgow-Blatchford score is 12. <b>Could you see him within the next hour for endoscopy?</b>”`},
{t:'order',q:`Order the parts of a good consult call.`,i:[`Who you are and who your senior is`,`What you are asking for (see, admit, advise, procedure)`,`The one-liner and key findings`,`What has been done so far`,`The specific question and the time frame`],e:`Lead with the request so they know why you are calling. If there’s disagreement about admission, it is a senior-to-senior conversation — escalate, don’t argue.`},
],
[
{t:'h',x:`When you make a mistake`},
{t:'p',x:`You will make mistakes. So did every consultant in this department. What matters is what you do next.`},
{t:'list',o:1,i:[`<b>Make the patient safe</b> — fix what you can now.`,`<b>Tell your senior immediately.</b>`,`File an <b>incident report</b> (often called an OVR — occurrence variance report) — it’s for system learning, not punishment.`,`Disclosure to the patient is led by your senior: honest, with an apology.`,`Debrief and learn. Talk to someone.`]},
{t:'mcq',q:`You realise you gave a patient paracetamol 1 g 2 hours after the nurse gave 1 g. The patient is well. What should you do?`,o:[`Nothing — 2 g is a safe total`,`Tell your senior and the nurse, document it, file an incident report, and make sure the next doses are adjusted`,`Change the time in the chart so it looks right`,`Ask the nurse to take the blame`],a:1,e:`It is probably harmless — and still exactly the kind of near-miss reporting that prevents a serious error later. Never alter records.`},
],
[
{t:'h',x:`Looking after yourself — and making the most of this month`},
{t:'cards',i:[['Nights','Sleep before your first night. Eat a real meal. Avoid driving home exhausted — Jeddah roads at 7 a.m. are not forgiving. Take a short break around 3–4 a.m. if your senior agrees.'],['Breaks and prayer','You are entitled to breaks and to pray. Tell your senior and the charge nurse, hand over sick patients, and go.'],['A bad case','A death, a child, a mistake — it’s normal to feel it for days. Talk to your senior, a colleague or the wellbeing service. Ask for a debrief.'],['Burnout signs','Dreading every shift, numbness, cynicism, poor sleep, irritability. Tell someone early. You are not the first.'],['Your logbook','Track your procedures and cases from day one. Ask to be signed off. Seniors remember interns who ask.'],['Residency','Your evaluation, letters of recommendation and your SMLE score all matter for the Saudi Board match. Ask for mid-rotation feedback — and act on it. If you are interested in EM, tell the program director.']]},
{t:'mentor',x:`<p>One last thing before your night shift. You don’t have to know everything. You have to be <b>safe, honest and curious</b>: know your limits, say when you’re worried, and look things up. Do that, and you will be an intern every senior wants on their shift.</p>`},
]]});

/* ================= MODULE 15 — THE NIGHT SHIFT ================= */
MODULES.push({id:'m15',n:15,final:1,part:'Final · The Night Shift',partSub:'Everything, all at once',title:'The Night Shift',sub:'A simulated Wednesday night at CMC: seven patients, one registrar, and you',mins:35,
take:[
`Sickest first — and re-check the waiting room. The quiet patient from triage is often the one who deteriorates.`,
`Time-critical pathways (STEMI, stroke, sepsis, status epilepticus, anaphylaxis) have the treatment ready before the diagnosis is perfect.`,
`In a medico-legal case: treat first, describe precisely, and never write conclusions.`,
`No valid DNR = full code. Family wishes go to the senior and the three-physician process.`,
`Hand over sickest first, with every pending item owned by a name.`],
s:[
[
{t:'mentor',x:`<p>It’s Wednesday night, 00:30. Weekend traffic has started on the Corniche, there are two weddings in halls nearby, and the waiting room is full. Your registrar tonight is <b>Dr. Fahad Bakr</b>. I’m the consultant on call from home.</p><p style="margin-top:8px">Everything you’ve learned is about to happen at once. There’s no pause button in a real shift — but here you can take your time. Think like you will on the floor.</p>`},
{t:'mentor',av:'FB',c:'s',who:'Dr. Fahad Bakr · Senior registrar',x:`<p>Welcome, {DR}. Rules for tonight: tell me early, don’t cherry-pick, and nobody goes home without me seeing them. Let’s look at the board.</p>`},
{t:'sort',tag:'00:30 — the waiting room',q:`Six new patients. Assign each a CTAS level.`,bins:CT,i:[
{x:`56M, central chest pressure for 30 min, grey and sweaty`,b:1,w:`Cardiac chest pain — CTAS 2, ECG in 10 minutes.`},
{x:`2-year-old girl, fever, now jerking all four limbs — mother says it started 4 minutes ago`,b:0,w:`Active seizure — CTAS 1.`},
{x:`34M, brought by police, bleeding scalp laceration and cuts on his forearm after a fight, GCS 15`,b:2,w:`Stable but needs assessment, head injury and wound care. CTAS 3, and medico-legal.`},
{x:`81F, confused, fever, from home with her daughters, HR 116, BP 92/50`,b:1,w:`Suspected sepsis with soft BP — CTAS 2.`},
{x:`38M, low back pain for 4 days after lifting, walking`,b:3,w:`CTAS 4 — for now. Remember him.`},
{x:`45M, wants a sick leave for yesterday, feels fine now`,b:4,w:`CTAS 5.`}]},
],
[
{t:'case',title:'01:05 · Bed R2 — chest pain',pt:'56M · smoker, hypertensive',mon:{hr:102,bp:'148/92',sp:'95%',rr:20,t:'36.8'},start:'a',n:{
a:{x:`<p>He came straight from a dinner with friends. Central chest pressure radiating to his left arm for 35 minutes. His ECG was done 6 minutes after arrival.</p>`,strip:'stemi',stripl:'V2 — ST elevation (also V1–V4 on the 12-lead)',
ch:[{x:`Tell Dr. Fahad now: anterior STEMI — suggest cath lab activation, aspirin 300 mg chewed`,s:2,go:'b',f:`ECG in 6 minutes, STEMI recognised. The cath lab call is made by your senior per CMC protocol.`},
{x:`Wait for the troponin to confirm`,s:0,go:'b',f:`STEMI is an ECG diagnosis. Troponin may still be normal this early.`}]},
b:{x:`<p>The cath lab team is on the way (20 minutes). He asks you something.</p>`,say:{who:'Patient',ar:`يا {دكتور|دكتورة}، أقدر أكلم ولدي؟ هو في الرياض. وبعدين... أنا بموت؟`,en:`Doctor, can I call my son? He’s in Riyadh. And… am I going to die?`},
ch:[{x:`Let him call. Tell him honestly that this is a heart attack, the team is opening the artery very soon, and that this is the best treatment there is`,s:2,go:'c',f:`Honest, hopeful, and specific. Fear raises heart rate and pain — information helps.`},
{x:`Tell him not to worry, it’s nothing serious`,s:0,go:'c',f:`False reassurance breaks trust. He knows something serious is happening.`}]},
c:{x:`<p>While waiting, he becomes pale. The monitor alarms.</p>`,mon:{hr:'--',bp:'--',sp:'--',r:'vf'},strip:'vf',stripl:'Monitor',
ch:[{x:`Shout for help, check for a pulse (none) — defibrillate immediately with the pads already on, then CPR`,s:2,go:'d',f:`Monitored, witnessed VF: shock as fast as possible. Pads should already be on every STEMI patient.`},
{x:`Give amiodarone first`,s:0,go:'d',f:`Shock first.`}]},
d:{x:`<p>After one shock he has a pulse and opens his eyes. He goes to the cath lab at 01:42 — door-to-balloon time 47 minutes.</p>`,mon:{hr:96,bp:'118/74',sp:'97%',rr:18,r:'sinus'}}},
debrief:`STEMI patients can go into VF at any time before reperfusion. Pads on, defibrillator at the bedside, never alone in a corridor.`},
],
[
{t:'case',title:'01:40 · Paeds resus — the seizing toddler',pt:'2-year-old girl · ~12 kg',mon:{hr:168,bp:'—',sp:'91%',rr:40,t:'39.6'},start:'a',n:{
a:{x:`<p>She is jerking all four limbs. The mother is crying. The seizure started about 7 minutes ago at home.</p>`,say:{who:'Mother',ar:`بنتي! سوّوا لها شي الله يخليكم! من شوية وهي كدا!`,en:`My daughter! Please do something for her! She’s been like this for a while!`},
ch:[{x:`Oxygen, recovery position, check glucose, and give buccal (or IV/IO) midazolam now per the paediatric dose chart — it’s already over 5 minutes`,s:2,go:'b',f:`Seizure >5 minutes = status. First benzodiazepine now; don’t wait for IV access. Glucose is part of the first minute.`},
{x:`Wait — febrile seizures usually stop on their own`,s:0,go:'b',f:`Most do — within 5 minutes. This one hasn’t.`},
{x:`Give the adult dose of 10 mg midazolam to be sure it works`,s:0,go:'b',f:`Weight-based or age-banded dosing only. Overdose causes respiratory depression.`}]},
b:{x:`<p>Glucose 5.8 mmol/L. The seizure stops 3 minutes after the midazolam. She is drowsy but breathing well. The mother asks what happened.</p>`,mon:{hr:150,sp:'97%',rr:30},
ch:[{x:`Explain calmly that it looks like a febrile seizure, that the medicine stopped it, and that the team will look for the cause of the fever and keep her under observation`,s:2,go:'c',f:`Simple, honest and reassuring — and you haven’t closed the diagnosis. A seizure lasting longer than 15 minutes is a complex febrile seizure and needs paediatric review.`},
{x:`Tell her it was epilepsy`,s:0,go:'c',f:`Don’t label. This needs assessment by the paediatric team.`}]},
c:{x:`<p>She wakes up fully over the next hour. The source is an ear infection. Because the seizure was prolonged, she is admitted under paediatrics for observation.</p>`}},
debrief:`Status epilepticus in children follows the same clock as adults — 5 minutes, first dose; 10 minutes, second; then second-line — with weight-based doses checked by two people.`},
],
[
{t:'case',title:'02:30 · Urgent care — the police case',pt:'34M · brought by police',nomon:1,start:'a',n:{
a:{x:`<p>A police officer waits outside the cubicle. The patient has a 5 cm scalp laceration and several cuts on the back of his left forearm. He smells of nothing in particular and is fully alert.</p>`,say:{who:'Patient (quietly)',ar:`يا {دكتور لا تكتب|دكتورة لا تكتبي} إني تضاربت، الله {يخليك|يخليكي}، ما أبغى مشاكل.`,en:`Doctor, please don’t write that I was in a fight. I don’t want any trouble.`},
ch:[{x:`Explain that you will write down exactly what he tells you and what you see — nothing more, nothing less — and that you must inform your senior`,s:2,go:'b',f:`Honest and neutral. You don’t hide findings, and you don’t add conclusions.`},
{x:`Agree to leave it out of the notes`,s:0,go:'b',f:`Falsifying records is a serious breach. Your notes must be accurate.`}]},
b:{x:`<p>You examine him. Which documentation is best?</p>`,
ch:[{x:`“Pt states he was ‘hit with something’. 5 cm linear laceration, left parietal scalp, clean edges. Three linear lacerations 1–3 cm on the dorsal left forearm. GCS 15, no neuro deficit.”`,s:2,go:'c',f:`Precise, factual, measurable. A forensic reviewer can work with this.`},
{x:`“Stab wounds from an assault, defensive injuries on the arm.”`,s:0,go:'c',f:`“Stab”, “assault” and “defensive” are interpretations. Describe; don’t conclude.`},
{x:`“Multiple cuts. Fight.”`,s:0,go:'c',f:`Too vague, and states a conclusion.`}]},
c:{x:`<p>The officer asks you directly how dangerous the injuries are and whether the patient was drunk.</p>`,
ch:[{x:`Politely say the treating team will provide an official medical report through the hospital, and inform your senior and the police office`,s:2,go:'d',f:`Information to the police goes through the official channel and a licensed doctor.`},
{x:`Answer his questions — he’s the police`,s:0,go:'d',f:`Even with the police, there’s a process. Interns don’t give medico-legal opinions.`}]},
d:{x:`<p>Your senior reviews, the wounds are washed and closed, a tetanus booster is given, and the medical report is written by the registrar the next morning.</p>`}},
debrief:`In medico-legal cases, your notes may be read in court years later. Measure, describe, quote — and keep your opinion out.`},
],
[
{t:'case',title:'03:20 · Acute bed 9 — the frail grandmother',pt:'81F · diabetic, CKD',mon:{hr:118,bp:'88/50',sp:'93%',rr:26,t:'38.9',gcs:13},start:'a',n:{
a:{x:`<p>Her daughters say she has had a cough for 3 days and has been “sleepy” since the afternoon.</p>`,
ch:[{x:`Sepsis bundle now with Dr. Fahad aware: lactate, cultures, antibiotics, fluids in careful boluses (CKD), oxygen`,s:2,go:'b',f:`Same bundle, with careful fluid boluses and reassessment because of her kidneys and age.`},
{x:`Wait for the chest X-ray to confirm pneumonia before antibiotics`,s:0,go:'b',f:`Never delay antibiotics in septic shock for imaging.`}]},
b:{x:`<p>Lactate 5.2. After two boluses, her BP is 84/48. The registrar plans noradrenaline and calls ICU. One daughter takes you aside.</p>`,say:{who:'Her daughter',ar:`يا {دكتور|دكتورة}، أمي قالت لنا قبل كدا إنها ما تبغى أجهزة ولا إنعاش. لا تسوون لها كدا.`,en:`Doctor, my mother told us before that she doesn’t want machines or resuscitation. Please don’t do that to her.`},
ch:[{x:`Thank her, tell her this is important, and bring Dr. Fahad straight away — until a decision is made through the proper process, she remains full code`,s:2,go:'c',f:`Her previously expressed wishes matter a lot. But a DNR is a senior, three-physician decision and must be documented.`},
{x:`Write “DNR” on her chart since the family agrees`,s:0,go:'c',f:`Interns never write DNR, and family wishes alone don’t create one.`},
{x:`Tell the daughter that families can’t make that decision, and walk away`,s:0,go:'c',f:`Technically true, cold in practice. This is the start of an important conversation — escalate it.`}]},
c:{x:`<p>The consultant joins by phone, the ICU consultant and Dr. Fahad assess her. After discussion with the family, a DNR is documented by three physicians. She continues antibiotics, oxygen and noradrenaline on the ward, and comfort is prioritised.</p>`}},
debrief:`DNR doesn’t mean “stop treating”. She still gets antibiotics, fluids, oxygen, pain relief and dignity.`},
],
[
{t:'case',title:'04:30 · Resus — the wedding guest',pt:'19F · brought from a wedding hall',mon:{hr:128,bp:'82/50',sp:'91%',rr:28,t:'37.0'},start:'a',n:{
a:{x:`<p>She ate dessert at a wedding 20 minutes ago. Her lips are swollen, she has hives, and she is wheezing. Her cousin says she has a “nut allergy”.</p>`,say:{who:'Her cousin',ar:`أكلت حلا فيه مكسرات يمكن، وبعدين وجهها انتفخ وصارت تكح ومو قادرة تتنفس!`,en:`She ate a dessert that maybe had nuts in it, then her face swelled up, she started coughing and can’t breathe!`},
ch:[{x:`Adrenaline 0.5 mg IM into the outer thigh now, call Dr. Fahad, high-flow oxygen, lie her flat with legs raised (or sitting if breathing is worse), IV fluids`,s:2,go:'b',f:`Anaphylaxis with shock and wheeze. IM adrenaline is the treatment.`},
{x:`IV chlorphenamine and hydrocortisone first`,s:0,go:'b',f:`Antihistamines and steroids don’t treat airway swelling or shock. Adrenaline first.`},
{x:`Adrenaline 1 mg IV push`,s:0,go:'b',f:`IV bolus adrenaline is for cardiac arrest. In anaphylaxis it can cause arrhythmias and MI. IM — or a senior-run infusion if refractory.`}]},
b:{x:`<p>Five minutes later she is still wheezy, BP 88/54.</p>`,mon:{hr:120,bp:'88/54',sp:'94%'},
ch:[{x:`Repeat IM adrenaline 0.5 mg, fluid bolus, salbutamol nebuliser, and tell Dr. Fahad she isn’t responding`,s:2,go:'c',f:`Repeat every 5 minutes if needed. After two doses with ongoing shock, a senior starts an adrenaline infusion.`},
{x:`Wait — it can take time`,s:0,go:'c',f:`Five minutes is the interval to repeat.`}]},
c:{x:`<p>After the second dose she improves: BP 112/70, lips less swollen. The cousin asks if she can go back to the wedding.</p>`,mon:{hr:104,bp:'112/70',sp:'98%',rr:18},
ch:[{x:`Explain she must be observed for several hours because symptoms can return, and that the senior will decide on discharge with an adrenaline auto-injector, training and an allergy referral`,s:2,go:'d',f:`Observation (often 6–12 hours after severe reactions), auto-injector training before she leaves, allergy clinic follow-up.`},
{x:`Yes, she looks fine now`,s:0,go:'d',f:`Biphasic reactions can happen hours later.`}]},
d:{x:`<p>She is observed until morning and discharged by Dr. Fahad with two adrenaline auto-injectors and an allergy clinic appointment.</p>`}},
debrief:`IM adrenaline 0.5 mg, repeat every 5 minutes. Observe. Discharge with an auto-injector and a plan.`},
],
[
{t:'case',title:'05:50 · The waiting room again',pt:'38M · back pain · CTAS 4 at 00:30',nomon:1,start:'a',n:{
a:{x:`<p>The back-pain patient from 00:30 is still waiting. On your way past, you see him walking oddly to the bathroom. He comes back and stops you.</p>`,say:{who:'Patient',ar:`يا {دكتور|دكتورة}، صار لي ساعتين أحاول أسوي حمام وما أقدر، وحاس إن تحت عندي خدران، زي ما يكون مو حاس بشي.`,en:`Doctor, for two hours I’ve been trying to pass urine and I can’t, and I feel numb down below, like I can’t feel anything.`},
ch:[{x:`Red flags for cauda equina syndrome: re-triage, tell Dr. Fahad, bladder scan, examine perineal sensation and anal tone with a chaperone, urgent MRI`,s:2,go:'b',f:`Urinary retention + saddle anaesthesia after back pain = cauda equina until proven otherwise. It’s a surgical emergency.`},
{x:`Tell him the urine problem is from the painkillers and he will be seen soon`,s:0,go:'b',f:`Painkillers can cause retention, but with saddle numbness you must assume cauda equina.`}]},
b:{x:`<p>Bladder scan: 900 mL. Reduced sensation around the perineum. MRI confirms a large central disc prolapse compressing the cauda equina. Neurosurgery operates that morning.</p>`}},
debrief:`He was correctly triaged at 00:30. He changed. The waiting room is part of your department — every patient, every time you walk through.`},
],
[
{t:'h',x:`06:50 — Handover`},
{t:'p',x:`The day team has arrived. Still in the department: the grandmother (bed 9, waiting for an ICU bed), the toddler (waiting for a paediatric bed), the allergy patient (under observation), and the police case (sutured, waiting for the CT head report). The patient wanting sick leave has been seen by Dr. Fahad and has gone.`},
{t:'mcq',q:`Who do you hand over first?`,o:[`The police case — the police are waiting`,`The grandmother in septic shock on noradrenaline`,`The allergy patient — she wants to go home`,`The toddler — the mother is anxious`],a:1,e:`Sickest first. The unstable patient gets the most attention from the incoming team.`},
{t:'order',q:`Put your I-PASS handover of the grandmother in order.`,i:[`“Unstable.”`,`“Bed 9, 81F, CKD, pneumonia with septic shock — antibiotics at 03:35, 2 boluses, noradrenaline 0.1 mcg/kg/min, DNR documented by three physicians.”`,`“To do: repeat lactate at 07:30 — the nurse knows; ICU bed expected around 09:00.”`,`“If MAP falls below 65 despite the current dose, call the ICU registrar — the plan is to increase noradrenaline, no CPR.”`,`Receiver repeats back: “Unstable, lactate at 07:30, ICU at 9, escalate if MAP drops.”`],e:`Illness severity → Patient summary → Action list → Situation awareness → Synthesis.`},
],
[
{t:'mentor',x:`<p>07:15. You walk out into the Jeddah morning. Tonight you recognised a STEMI and a VF arrest, stopped a seizure, documented a police case properly, helped a family with an end-of-life decision, treated anaphylaxis, and caught a cauda equina in the waiting room.</p><p style="margin-top:8px">That is what an ER intern does. Go home, eat, and sleep. See you tomorrow night, {DR}.</p>`},
{t:'mentor',av:'FB',c:'s',who:'Dr. Fahad Bakr · Senior registrar',x:`<p class="ar">{يعطيك العافية يا دكتور|يعطيكي العافية يا دكتورة}</p><p>Good shift.</p>`},
]]});

window.POCKET=[
